"NYG","status":"ACTIVE","slot_id":20,"slot":"Bench","owner_id":0,"eligible_slots":[2,3,23,7,20,21],"projection":4.82616485,"actual":null,"kickoff":"2026-09-14T00:20:00+00:00","opponent":"vs DAL","game_state":"pre","locked":false,"availability":"FREEAGENT","week_outlook":[{"week":1,"projection":4.82616485,"opponent":"vs DAL","kickoff":"2026-09-14T00:20:00+00:00"},{"week":2,"projection":4.03599884,"opponent":"@ LAR","kickoff":"2026-09-22T00:15:00+00:00"},{"week":3,"projection":5.26247057,"opponent":"vs TEN","kickoff":"2026-09-27T17:00:00+00:00"}],"outlook":""},{"id":5083754,"name":"Ryan Flournoy","pos":"WR","nfl_team":"DAL","status":"ACTIVE","slot_id":20,"slot":"Bench","owner_id":0,"eligible_slots":[3,4,5,23,7,20,21],"projection":4.8234008,"actual":null,"kickoff":"2026-09-14T00:20:00+00:00","opponent":"@ NYG","game_state":"pre","locked":false,"availability":"FREEAGENT","week_outlook":[{"week":1,"projection":4.8234008,"opponent":"@ NYG","kickoff":"2026-09-14T00:20:00+00:00"},{"week":2,"projection":5.22085104,"opponent":"vs WSH","kickoff":"2026-09-20T20:25:00+00:00"},{"week":3,"projection":4.69623918,"opponent":"vs BAL","kickoff":"2026-09-27T20:25:00+00:00"}],"outlook":"Flournoy is an intriguing deep sleeper as the favorite for No. 3 wide receiver duties behind CeeDee Lamb and George Pickens in Dallas. Flournoy flashed in 2025, putting up 14.2 fantasy PPG during the only five games in which his route participation was at least 60%. Flournoy did disappear quite a bit behind the heavily targeted Lamb and Pickens (three or fewer targets in seven of his final 10 games), so he's a long shot for standalone fantasy value even if he locks down the No. 3 gig. The 26-year-old should be added to rosters only if Lamb or Pickens are sidelined."},{"id":4685247,"name":"Braelon Allen","pos":"RB","nfl_team":"NYJ","status":"ACTIVE","slot_id":20,"slot":"Bench","owner_id":0,"eligible_slots":[2,3,23,7,20,21],"projection":4.69882666,"actual":null,"kickoff":"2026-09-13T17:00:00+00:00","opponent":"@ TEN","game_state":"pre","locked":false,"availability":"FREEAGENT","week_outlook":[{"week":1,"projection":4.69882666,"opponent":"@ TEN","kickoff":"2026-09-13T17:00:00+00:00"},{"week":2,"projection":4.50032198,"opponent":"vs GB","kickoff":"2026-09-20T17:00:00+00:00"},{"week":3,"projection":4.11508726,"opponent":"@ DET","kickoff":"2026-09-27T17:00:00+00:00"}],"outlook":"Hopes were high for Allen entering 2025, but a slow start was followed by a season-ending knee injury in Week 4. During Weeks 1-3, Allen played 28% of the Jets' snaps and totaled 67 yards and one touchdown on 16 touches. The 2024 fourth-round pick has shown he can contribute as both a rusher (110 career carries) and receiver (32 targets), but he's simply not going to see the field much as long as feature back Breece Hall is healthy. Allen, 22, has some late-round insurance stash appeal, as he'd likely start over Isaiah Davis in the event of a Hall injury and would thus find himself on the flex radar."},{"id":4361409,"name":"Jahan Dotson","pos":"WR","nfl_team":"ATL","status":"ACTIVE","slot_id":20,"slot":"Bench","owner_id":0,"eligible_slots":[3,4,5,23,7,20,21],"projection":4.69762398,"actual":null,"kickoff":"2026-09-13T17:00:00+00:00","opponent":"@ PIT","game_state":"pre","locked":false,"availability":"FREEAGENT","week_outlook":[{"week":1,"projection":4.69762398,"opponent":"@ PIT","kickoff":"2026-09-13T17:00:00+00:00"},{"week":2,"projection":5.14553047,"opponent":"vs CAR","kickoff":"2026-09-20T17:00:00+00:00"},{"week":3,"projection":5.03764653,"opponent":"@ GB","kickoff":"2026-09-25T00:15:00+00:00"}],"outlook":""},{"id":5081397,"name":"Dylan Sampson","pos":"RB","nfl_team":"CLE","status":"ACTIVE","slot_id":20,"slot":"Bench","owner_id":0,"eligible_slots":[2,3,23,7,20,21],"projection":4.67578677,"actual":null,"kickoff":"2026-09-13T17:00:00+00:00","opponent":"@ JAX","game_state":"pre","locked":false,"availability":"FREEAGENT","week_outlook":[{"week":1,"projection":4.67578677,"opponent":"@ JAX","kickoff":"2026-09-13T17:00:00+00:00"},{"week":2,"projection":4.49751801,"opponent":"@ TB","kickoff":"2026-09-20T17:00:00+00:00"},{"week":3,"projection":4.73291427,"opponent":"vs CAR","kickoff":"2026-09-27T17:00:00+00:00"}],"outlook":"Sampson is back for Year 2 in Cleveland after an underwhelming rookie campaign in which he struggled on a small sample of work as a rusher (his 2.69 yards per carry was dead last among 65 qualified backs), but was a contributor in the passing game (23rd among RBs with 33 receptions). Sampson was a young rookie (he doesn't turn 22 until September), so there's still some room for growth, and he's positioned for a larger role behind Quinshon Judkins with Jerome Ford no longer on the roster. Expect Sampson to see some change-of-pace carries and a moderate pass-catching role in 2026. He'll land on the flex radar only if Judkins misses time."},{"id":5083315,"name":"Kenyon Sadiq","pos":"TE","nfl_team":"NYJ","status":"ACTIVE","slot_id":20,"slot":"Bench","owner_id":0,"eligible_slots":[25,5,6,23,7,20,21],"projection":4.57303703,"actual":null,"kickoff":"2026-09-13T17:00:00+00:00","opponent":"@ TEN","game_state":"pre","locked":false,"availability":"FREEAGENT","week_outlook":[{"week":1,"projection":4.57303703,"opponent":"@ TEN","kickoff":"2026-09-13T17:00:00+00:00"},{"week":2,"projection":4.53808392,"opponent":"vs GB","kickoff":"2026-09-20T17:00:00+00:00"},{"week":3,"projection":7.89949044,"opponent":"@ DET","kickoff":"2026-09-27T17:00:00+00:00"}],"outlook":"Sadiq was selected by the Jets with the No. 16 pick of April's draft. After playing a limited role his first two collegiate seasons, he broke out with a 51-560-8 receiving line in 2025. He handled a respectable 17% of Oregon's targets and aligned in the slot 62% of the time. Sadiq is a bit on the small side, but he totaled 106 targets in three collegiate seasons. He needs to cut down on drops (six on 70 targets in 2025), but he's one of the youngest players in this rookie class and crushed it at the combine, posting a ridiculous 4.39 40-yard dash at 241 pounds (130 speed score) and a 43.5-inch vertical, 133-inch broad jump and 26 bench reps. Sadiq's career might start slow, especially with Mason Taylor also on the Jets' TE depth chart, but the rookie has the upside to eventually emerge as a fantasy TE1. Consider him with a mid-to-late pick."},{"id":4427095,"name":"DeMario Douglas","pos":"WR","nfl_team":"NE","status":"ACTIVE","slot_id":20,"slot":"Bench","owner_id":0,"eligible_slots":[3,4,5,23,7,20,21],"projection":4.5482933,"actual":5.5,"kickoff":"2026-09-10T00:20:00+00:00","opponent":"@ SEA","game_state":"post","locked":false,"availability":"WAIVERS","week_outlook":[{"week":1,"projection":4.5482933,"opponent":"@ SEA","kickoff":"2026-09-10T00:20:00+00:00"},{"week":2,"projection":4.18201194,"opponent":"vs PIT","kickoff":"2026-09-20T17:00:00+00:00"},{"week":3,"projection":4.48364703,"opponent":"@ JAX","kickoff":"2026-09-27T17:00:00+00:00"}],"outlook":""},{"id":4429013,"name":"Tank Bigsby","pos":"RB","nfl_team":"PHI","status":"ACTIVE","slot_id":20,"slot":"Bench","owner_id":0,"eligible_slots":[2,3,23,7,20,21],"projection":4.5129415,"actual":null,"kickoff":"2026-09-13T20:25:00+00:00","opponent":"vs WSH","game_state":"pre","locked":false,"availability":"FREEAGENT","week_outlook":[{"week":1,"projection":4.5129415,"opponent":"vs WSH","kickoff":"2026-09-13T20:25:00+00:00"},{"week":2,"projection":4.19193961,"opponent":"@ TEN","kickoff":"2026-09-20T17:00:00+00:00"},{"week":3,"projection":4.05030117,"opponent":"@ CHI","kickoff":"2026-09-29T00:15:00+00:00"}],"outlook":"Bigsby was acquired by the Eagles early in the 2025 season and progressively worked his way up to primary backup duties, a role he's expected to play again in 2026. Granted, it's a small sample, but Bigsby has been extremely efficient over the last two seasons. Among 48 backs with 200-plus carries during the span, Bigsby ranks first in yards after contact per attempt (2.75) and eighth in yards per carry (4.86). In fact, Bigsby has led qualified RBs in YAC each of the last two seasons. On the other hand, he hasn't been used much as a receiver (20 career targets). With overworked Saquon Barkley entering his age-29 season, Bigsby certainly has some insurance appeal, even if he defers passing-down work to Will Shipley. Bigsby, 25, is worth consideration in the later rounds."},{"id":-16027,"name":"Buccaneers D/ST","pos":"DST","nfl_team":"TB","status":"ACTIVE","slot_id":20,"slot":"Bench","owner_id":0,"eligible_slots":[16,20,21],"projection":4.46338277,"actual":null,"kickoff":"2026-09-13T17:00:00+00:00","opponent":"@ CIN","game_state":"pre","locked":false,"availability":"FREEAGENT","week_outlook":[{"week":1,"projection":4.46338277,"opponent":"@ CIN","kickoff":"2026-09-13T17:00:00+00:00"},{"week":2,"projection":7.95980469,"opponent":"vs CLE","kickoff":"2026-09-20T17:00:00+00:00"},{"week":3,"projection":5.85884986,"opponent":"vs MIN","kickoff":"2026-09-27T20:05:00+00:00"}],"outlook":"A middling, matchups-driven D/ST last season, the Buccaneers saw much change among their linebacker corps during the offseason. Lavonte David retired, and the team drafted Rueben Bain Jr. 15th overall and signed Alex Anzalone and Christian Rozeboom. Take a wait-and-see approach to how the new personnel jells, especially since the Buccaneers get a tough opening matchup in a road game against the Bengals."},{"id":-16016,"name":"Vikings D/ST","pos":"DST","nfl_team":"MIN","status":"ACTIVE","slot_id":20,"slot":"Bench","owner_id":0,"eligible_slots":[16,20,21],"projection":4.43091985,"actual":null,"kickoff":"2026-09-13T20:25:00+00:00","opponent":"vs GB","game_state":"pre","locked":false,"availability":"FREEAGENT","week_outlook":[{"week":1,"projection":4.43091985,"opponent":"vs GB","kickoff":"2026-09-13T20:25:00+00:00"},{"week":2,"projection":3.98046396,"opponent":"@ CHI","kickoff":"2026-09-20T17:00:00+00:00"},{"week":3,"projection":5.2508462,"opponent":"@ TB","kickoff":"2026-09-27T20:05:00+00:00"}],"outlook":"Brian Flores' blitz-happy defense has managed exactly 49 sacks, fourth-most in the league, in each of the past two seasons, playing a big part in the team finishing among the position's top seven in fantasy scoring in each of those years. Though Jonathan Allen and Jonathan Greenard are no longer with the team, the Vikings' draft selections of DTs Caleb Banks and Domonique Orange should at least keep them competitive up front. That said, the Vikings face a brutal opening schedule (GB, Week 1; @CHI, Week 2) and have one of the toughest second-half schedules in the league. Be prepared to pivot if this D/ST starts slowly."},{"id":4595342,"name":"Oronde Gadsden","pos":"TE","nfl_team":"LAC","status":"ACTIVE","slot_id":20,"slot":"Bench","owner_id":0,"eligible_slots":[5,6,23,7,20,21],"projection":4.39139298,"actual":null,"kickoff":"2026-09-13T20:25:00+00:00","opponent":"vs ARI","game_state":"pre","locked":false,"availability":"FREEAGENT","week_outlook":[{"week":1,"projection":4.39139298,"opponent":"vs ARI","kickoff":"2026-09-13T20:25:00+00:00"},{"week":2,"projection":4.33580894,"opponent":"vs LV","kickoff":"2026-09-20T20:05:00+00:00"},{"week":3,"projection":4.40143267,"opponent":"@ BUF","kickoff":"2026-09-27T17:00:00+00:00"}],"outlook":"Gadsden's rookie season was quite the roller coaster. The 2025 fifth-round pick didn't get much early run prior to exploding for 29.4 fantasy points in Week 7 and 18.7 points in Week 8. He went on to score one touchdown and average 6.2 fantasy PPG the rest of the season, never clearing 12.2 points in a single outing. Gadsden finished the season eighth or better at the position in end zone targets, aDOT, YPR, YPT and YPRR. The 23-year-old's second-half fall is concerning, and he now enters Year 2 set to compete for work with newcomer David Njoku and Charlie Kolar. It's still possible Gadsden emerges as a featured target in new playcaller Mike McDaniel's offense, but consistent fantasy output may be tough in an offense that figures to spread the ball around. Gadsden is only worth stashing in dynasty."},{"id":4635008,"name":"Keon Coleman","pos":"WR","nfl_team":"BUF","status":"ACTIVE","slot_id":20,"slot":"Bench","owner_id":0,"eligible_slots":[3,4,5,23,7,20,21],"projection":4.38628406,"actual":null,"kickoff":"2026-09-13T17:00:00+00:00","opponent":"@ HOU","game_state":"pre","locked":false,"availability":"FREEAGENT","week_outlook":[{"week":1,"projection":4.38628406,"opponent":"@ HOU","kickoff":"2026-09-13T17:00:00+00:00"},{"week":2,"projection":4.17565372,"opponent":"vs DET","kickoff":"2026-09-18T00:15:00+00:00"},{"week":3,"projection":4.21058198,"opponent":"vs LAC","kickoff":"2026-09-27T17:00:00+00:00"}],"outlook":"So far, so bust for Coleman, who has struggled to make an impact after being selected 33rd overall in the 2024 draft. After flashing in a situational deep-threat role as a rookie (15.0 aDOT), Coleman saw more high percentage looks in 2025 (11.2 aDOT). That led to a much better catch rate (from 51% to 66%), but a big dip in yardage (19.2 YPR to 10.9). Coleman has yet to emerge as a reliable, full-time starter and was even a healthy scratch at times last season. Perhaps the 23-year-old will make a Year 3 leap with Joe Brady now running the show, but he'll have his hands full overtaking DJ Moore and Khalil Shakir atop the depth chart. Coleman is only worth a late flier in deeper leagues."},{"id":-16004,"name":"Bengals D/ST","pos":"DST","nfl_team":"CIN","status":"ACTIVE","slot_id":20,"slot":"Bench","owner_id":0,"eligible_slots":[16,20,21],"projection":4.27843589,"actual":null,"kickoff":"2026-09-13T17:00:00+00:00","opponent":"vs TB","game_state":"pre","locked":false,"availability":"FREEAGENT","week_outlook":[{"week":1,"projection":4.27843589,"opponent":"vs TB","kickoff":"2026-09-13T17:00:00+00:00"},{"week":2,"projection":4.65255112,"opponent":"@ HOU","kickoff":"2026-09-20T17:00:00+00:00"},{"week":3,"projection":4.48882071,"opponent":"@ PIT","kickoff":"2026-09-27T17:00:00+00:00"}],"outlook":"Only three defenses scored fewer fantasy points than did the Bengals last season, and other than adding DT Dexter Lawrence, the team did little to upgrade the unit during the offseason. That said, few teams have as favorable a D/ST schedule than do the Bengals, so with some early promise, they could be a streaming option for matchups against the Dolphins (Week 5), Titans (8), Saints (12), Browns (13 and 18) and Panthers (15)."},{"id":4870612,"name":"Zachariah Branch","pos":"WR","nfl_team":"ATL","status":"QUESTIONABLE","slot_id":20,"slot":"Bench","owner_id":0,"eligible_slots":[25,3,4,5,23,7,20,21],"projection":4.19794202,"actual":null,"kickoff":"2026-09-13T17:00:00+00:00","opponent":"@ PIT","game_state":"pre","locked":false,"availability":"FREEAGENT","week_outlook":[{"week":1,"projection":4.19794202,"opponent":"@ PIT","kickoff":"2026-09-13T17:00:00+00:00"},{"week":2,"projection":4.54778318,"opponent":"vs CAR","kickoff":"2026-09-20T17:00:00+00:00"},{"week":3,"projection":4.45498144,"opponent":"@ GB","kickoff":"2026-09-25T00:15:00+00:00"}],"outlook":"Branch was selected by the Falcons in the third round of April's draft. Branch is a tiny slot receiver who posted an extremely low 5.2 aDOT during 37 collegiate games. That limited his efficiency numbers a bit, though he caught 71% of his targets and was terrific after the catch (7.9 RAC). Branch has the look of a versatile (perhaps gadget) player who will help as a rusher, slot receiver and returner. That role makes him a longshot for consistent fantasy output, but he does have a path to No. 2 receiver duties behind Drake London with the likes of Olamide Zaccheaus and Jahan Dotson his primary competition. Branch should only be drafted in dynasty."},{"id":-16001,"name":"Falcons D/ST","pos":"DST","nfl_team":"ATL","status":"ACTIVE","slot_id":20,"slot":"Bench","owner_id":0,"eligible_slots":[16,20,21],"projection":4.19403903,"actual":null,"kickoff":"2026-09-13T17:00:00+00:00","opponent":"@ PIT","game_state":"pre","locked":false,"availability":"FREEAGENT","week_outlook":[{"week":1,"projection":4.19403903,"opponent":"@ PIT","kickoff":"2026-09-13T17:00:00+00:00"},{"week":2,"projection":5.42874941,"opponent":"vs CAR","kickoff":"2026-09-20T17:00:00+00:00"},{"week":3,"projection":2.50520868,"opponent":"@ GB","kickoff":"2026-09-25T00:15:00+00:00"}],"outlook":"Jeff Ulbrich's blitz-happy defense fueled 57 sacks, the league's second-best total, and a 13th best ranking in fantasy points. That approach could make this a streaming-worthy unit against weaker opposing quarterbacks, which could be the case with the Panthers (Weeks 2 and 18), Saints (4 and 17) and Browns (13). For those in deeper leagues, this could be an advantageous matchups-driven September D/ST if you wait until the end of the draft to fill the position."},{"id":-16002,"name":"Bills D/ST","pos":"DST","nfl_team":"BUF","status":"ACTIVE","slot_id":20,"slot":"Bench","owner_id":0,"eligible_slots":[16,20,21],"projection":4.18557838,"actual":null,"kickoff":"2026-09-13T17:00:00+00:00","opponent":"@ HOU","game_state":"pre","locked":false,"availability":"FREEAGENT","week_outlook":[{"week":1,"projection":4.18557838,"opponent":"@ HOU","kickoff":"2026-09-13T17:00:00+00:00"},{"week":2,"projection":3.21232129,"opponent":"vs DET","kickoff":"2026-09-18T00:15:00+00:00"},{"week":3,"projection":4.29311491,"opponent":"vs LAC","kickoff":"2026-09-27T17:00:00+00:00"}],"outlook":"Run defense was the Bills' undoing last season, as they allowed a league-worst 24 rushing scores and snapped a seven-year streak of placing among the position's top 10 in fantasy points scored. Jim Leonhard was brought in as defensive coordinator, switching from a 4-3 to 3-4 scheme, though the team's personnel remains light up front. Regard the Bills a D/ST streaming candidate, and one better to leave undrafted due to their rough early schedule (@HOU, DET, LAC, NE, @LAR)."},{"id":-16015,"name":"Dolphins D/ST","pos":"DST","nfl_team":"MIA","status":"ACTIVE","slot_id":20,"slot":"Bench","owner_id":0,"eligible_slots":[16,20,21],"projection":4.16204206,"actual":null,"kickoff":"2026-09-13T20:25:00+00:00","opponent":"@ LV","game_state":"pre","locked":false,"availability":"FREEAGENT","week_outlook":[{"week":1,"projection":4.16204206,"opponent":"@ LV","kickoff":"2026-09-13T20:25:00+00:00"},{"week":2,"projection":2.69220508,"opponent":"@ SF","kickoff":"2026-09-20T20:25:00+00:00"},{"week":3,"projection":2.76086658,"opponent":"vs KC","kickoff":"2026-09-27T17:00:00+00:00"}],"outlook":"The rebuilding Dolphins are woefully lacking in talent on both sides of the football, and they're coming off a season in which they tied for 21st in fantasy points from the D/ST. An opening-week matchup against the Raiders could make them a viable streaming choice -- though that's directed more at you 12-, 14-team and Knockout managers ? but there's little else to like here, especially with one of the toughest overall schedules in the league ahead."},{"id":4242557,"name":"Colby Parkinson","pos":"TE","nfl_team":"LAR","status":"ACTIVE","slot_id":20,"slot":"Bench","owner_id":0,"eligible_slots":[5,6,23,7,20,21],"projection":4.07746943,"actual":null,"kickoff":"2026-09-11T00:35:00+00:00","opponent":"vs SF","game_state":"pre","locked":false,"availability":"FREEAGENT","week_outlook":[{"week":1,"projection":4.07746943,"opponent":"vs SF","kickoff":"2026-09-11T00:35:00+00:00"},{"week":2,"projection":4.05430262,"opponent":"vs NYG","kickoff":"2026-09-22T00:15:00+00:00"},{"week":3,"projection":3.76426943,"opponent":"@ DEN","kickoff":"2026-09-28T00:20:00+00:00"}],"outlook":"Parkinson is set to resume his role in the Rams' TE committee. The 2020 fourth-round pick was a part-time player early last season, but graduated to a much larger role in the second half. In fact, from Week 10 on (12 games, including the playoffs), Parkinson averaged 5.0 targets and 12.1 fantasy points per game, scoring nine touchdowns along the way. He finished the regular season with career-high marks across the board, which included his first top-35 fantasy campaign (17th). If Parkinson carries his increased role into 2026, he'll be a sneaky fantasy option, but the problem is that he needs to fend off Tyler Higbee and recent second-round picks Terrance Ferguson and Max Klare for work in an offense that also includes Puka Nacua and Davante Adams. Parkinson, 27, is a deep sleeper worth a look in leagues that start two tight ends."},{"id":5081432,"name":"Antonio Williams","pos":"WR","nfl_team":"WSH","status":"ACTIVE","slot_id":20,"slot":"Bench","owner_id":0,"eligible_slots":[25,3,4,5,23,7,20,21],"projection":4.05204274,"actual":null,"kickoff":"2026-09-13T20:25:00+00:00","opponent":"@ PHI","game_state":"pre","locked":false,"availability":"FREEAGENT","week_outlook":[{"week":1,"projection":4.05204274,"opponent":"@ PHI","kickoff":"2026-09-13T20:25:00+00:00"},{"week":2,"projection":4.34043688,"opponent":"@ DAL","kickoff":"2026-09-20T20:25:00+00:00"},{"week":3,"projection":4.06822601,"opponent":"vs SEA","kickoff":"2026-09-27T17:00:00+00:00"}],"outlook":"Williams was selected by the Commanders in the third round of April's draft. He is an undersized slot receiver (75% slot in his collegiate career) who soaked up 208 catches (fourth most in this rookie class) during his four seasons (43 games) at Clemson. He was primarily a short-range option (8.0 aDOT), but he caught a healthy 75% of his targets and added value as a rusher (career 25-187-2 rushing), punt returner and even as a passer (143 yards and two TDs on four attempts). Williams is in an all-out battle with the likes of Dyami Brown, Luke McCaffrey, Jaylin Lane and Treylon Burks for the No. 3 WR gig behind Terry McLaurin and Stefon Diggs. He's worth no more than a late pick in deep leagues."},{"id":4249417,"name":"Jalen Tolbert","pos":"WR","nfl_team":"MIA","status":"ACTIVE","slot_id":20,"slot":"Bench","owner_id":0,"eligible_slots":[3,4,5,23,7,20,21],"projection":4.05110581,"actual":null,"kickoff":"2026-09-13T20:25:00+00:00","opponent":"@ LV","game_state":"pre","locked":false,"availability":"FREEAGENT","week_outlook":[{"week":1,"projection":4.05110581,"opponent":"@ LV","kickoff":"2026-09-13T20:25:00+00:00"},{"week":2,"projection":3.9375284,"opponent":"@ SF","kickoff":"2026-09-20T20:25:00+00:00"},{"week":3,"projection":3.88471467,"opponent":"vs KC","kickoff":"2026-09-27T17:00:00+00:00"}],"outlook":"Tolbert signed with Miami after spending his first four NFL seasons in Dallas. The 2022 third-round pick has a path to a substantial offensive role, with Malik Washington and rookies Chris Bell and Caleb Douglas as his top competition for snaps and targets. We have seen Tolbert as a near-full-time player in a much better offense and he wasn't much of a fantasy option. That came in 2024 when he played 76% of the Cowboys' offensive snaps. He found the end zone seven times, but was held to 610 yards and finished 54th among receivers in fantasy PPG. Tolbert played a reduced role last season and his 203 yards were the fewest since his rookie season. The 27-year-old has very limited upside and isn't worth much late-round consideration."},{"id":4430802,"name":"Darnell Washington","pos":"TE","nfl_team":"PIT","status":"ACTIVE","slot_id":20,"slot":"Bench","owner_id":0,"eligible_slots":[5,6,23,7,20,21],"projection":4.04869563,"actual":null,"kickoff":"2026-09-13T17:00:00+00:00","opponent":"vs ATL","game_state":"pre","locked":false,"availability":"FREEAGENT","week_outlook":[{"week":1,"projection":4.04869563,"opponent":"vs ATL","kickoff":"2026-09-13T17:00:00+00:00"},{"week":2,"projection":3.71561854,"opponent":"@ NE","kickoff":"2026-09-20T17:00:00+00:00"},{"week":3,"projection":4.07081325,"opponent":"vs CIN","kickoff":"2026-09-27T17:00:00+00:00"}],"outlook":"Though he never quite made it onto the fantasy radar, Washington was one of the most fun, surprising \"breakout\" players of 2025. Essentially an extension of the offensive line at 6-foot-6, 264 pounds, Washington is known mainly for his blocking. Still, the 2023 third-round pick played well enough that he was stealing snaps and targets from both Jonnu Smith and Pat Freiermuth. Washington never cleared six targets or 10.7 fantasy points in any game, but he was effective with the ball in his hands and averaged 8.5 yards per target. Though Smith has been released, Pittsburgh's offense is no longer being led by TE superfan Arthur Smith, which is likely to lead to a lesser role for Washington. Expect him to operate as a rarely targeted blocking complement to Freiermuth."},{"id":4362921,"name":"Tyquan Thornton","pos":"WR","nfl_team":"KC","status":"ACTIVE","slot_id":20,"slot":"Bench","owner_id":0,"eligible_slots":[3,4,5,23,7,20,21],"projection":4.02171232,"actual":null,"kickoff":"2026-09-15T00:15:00+00:00","opponent":"vs DEN","game_state":"pre","locked":false,"availability":"FREEAGENT","week_outlook":[{"week":1,"projection":4.02171232,"opponent":"vs DEN","kickoff":"2026-09-15T00:15:00+00:00"},{"week":2,"projection":4.4098664,"opponent":"vs IND","kickoff":"2026-09-21T00:20:00+00:00"},{"week":3,"projection":4.49969014,"opponent":"@ MIA","kickoff":"2026-09-27T17:00:00+00:00"}],"outlook":""},{"id":5123663,"name":"Isaac TeSlaa","pos":"WR","nfl_team":"DET","status":"ACTIVE","slot_id":20,"slot":"Bench","owner_id":0,"eligible_slots":[3,4,5,23,7,20,21],"projection":3.96231989,"actual":null,"kickoff":"2026-09-13T17:00:00+00:00","opponent":"vs NO","game_state":"pre","locked":false,"availability":"FREEAGENT","week_outlook":[{"week":1,"projection":3.96231989,"opponent":"vs NO","kickoff":"2026-09-13T17:00:00+00:00"},{"week":2,"projection":4.16729061,"opponent":"@ BUF","kickoff":"2026-09-18T00:15:00+00:00"},{"week":3,"projection":3.95896098,"opponent":"vs NYJ","kickoff":"2026-09-27T17:00:00+00:00"}],"outlook":"TeSlaa is a candidate for a Year 2 leap as the favorite for No. 3 WR duties in Detroit behind Amon-Ra St. Brown and Jameson Williams. TeSlaa barely played as a rookie (27 total targets), but he had a very specific role and, believe it or not, tied for 11th in the entire NFL with 11 end zone targets. That helped lead to six touchdowns, four of which came when his snaps increased during Detroit's final six games. The 2025 third-round pick has a big size edge on both St. Brown and Williams, so while consistent targets are a long shot, he's still likely to remain busy near the goal line. TeSlaa won't be more than a boom/bust situational target most weeks, but if one of the starters misses time, he'll be on the flex radar. Consider him with a late pick."},{"id":16733,"name":"Odell Beckham Jr.","pos":"WR","nfl_team":"NYG","status":"ACTIVE","slot_id":20,"slot":"Bench","owner_id":0,"eligible_slots":[3,4,5,23,7,20,21],"projection":3.78855993,"actual":null,"kickoff":"2026-09-14T00:20:00+00:00","opponent":"vs DAL","game_state":"pre","locked":false,"availability":"FREEAGENT","week_outlook":[{"week":1,"projection":3.78855993,"opponent":"vs DAL","kickoff":"2026-09-14T00:20:00+00:00"},{"week":2,"projection":3.43008789,"opponent":"@ LAR","kickoff":"2026-09-22T00:15:00+00:00"},{"week":3,"projection":3.77427186,"opponent":"vs TEN","kickoff":"2026-09-27T17:00:00+00:00"}],"outlook":""},{"id":4600981,"name":"Pat Bryant","pos":"WR","nfl_team":"DEN","status":"ACTIVE","slot_id":20,"slot":"Bench","owner_id":0,"eligible_slots":[3,4,5,23,7,20,21],"projection":3.74561317,"actual":null,"kickoff":"2026-09-15T00:15:00+00:00","opponent":"@ KC","game_state":"pre","locked":false,"availability":"FREEAGENT","week_outlook":[{"week":1,"projection":3.74561317,"opponent":"@ KC","kickoff":"2026-09-15T00:15:00+00:00"},{"week":2,"projection":4.03163249,"opponent":"vs JAX","kickoff":"2026-09-20T20:05:00+00:00"},{"week":3,"projection":3.66610619,"opponent":"vs LAR","kickoff":"2026-09-28T00:20:00+00:00"}],"outlook":"A 2025 third-round pick, Bryant played a situational role throughout his rookie season and is likely to do the same in 2026 after Denver added Jaylen Waddle as a running mate for Courtland Sutton. Bryant will battle the likes of Troy Franklin, Marvin Mims Jr. and Lil'Jordan Humphrey for No. 3 duties. During his rookie campaign, Bryant barely saw the field early on, but eventually passed Franklin on the depth chart and earned more work down the stretch. That led to more snaps but not much fantasy production, as he failed to clear 13.2 fantasy points in a single game and found the end zone once. The 23-year-old isn't on the fantasy radar right now, but he makes for a fine dynasty stash."},{"id":4368003,"name":"Andrei Iosivas","pos":"WR","nfl_team":"CIN","status":"ACTIVE","slot_id":20,"slot":"Bench","owner_id":0,"eligible_slots":[3,4,5,23,7,20,21],"projection":3.72542945,"actual":null,"kickoff":"2026-09-13T17:00:00+00:00","opponent":"vs TB","game_state":"pre","locked":false,"availability":"FREEAGENT","week_outlook":[{"week":1,"projection":3.72542945,"opponent":"vs TB","kickoff":"2026-09-13T17:00:00+00:00"},{"week":2,"projection":3.3485526,"opponent":"@ HOU","kickoff":"2026-09-20T17:00:00+00:00"},{"week":3,"projection":3.41167662,"opponent":"@ PIT","kickoff":"2026-09-27T17:00:00+00:00"}],"outlook":""},{"id":4427834,"name":"Erick All Jr.","pos":"TE","nfl_team":"CIN","status":"ACTIVE","slot_id":20,"slot":"Bench","owner_id":0,"eligible_slots":[5,6,23,7,20,21],"projection":3.70499902,"actual":null,"kickoff":"2026-09-13T17:00:00+00:00","opponent":"vs TB","game_state":"pre","locked":false,"availability":"FREEAGENT","week_outlook":[{"week":1,"projection":3.70499902,"opponent":"vs TB","kickoff":"2026-09-13T17:00:00+00:00"},{"week":2,"projection":3.38982212,"opponent":"@ HOU","kickoff":"2026-09-20T17:00:00+00:00"},{"week":3,"projection":3.44258688,"opponent":"@ PIT","kickoff":"2026-09-27T17:00:00+00:00"}],"outlook":""},{"id":4686472,"name":"Marvin Mims Jr.","pos":"WR","nfl_team":"DEN","status":"ACTIVE","slot_id":20,"slot":"Bench","owner_id":0,"eligible_slots":[3,4,5,23,7,20,21],"projection":3.70347543,"actual":null,"kickoff":"2026-09-15T00:15:00+00:00","opponent":"@ KC","game_state":"pre","locked":false,"availability":"FREEAGENT","week_outlook":[{"week":1,"projection":3.70347543,"opponent":"@ KC","kickoff":"2026-09-15T00:15:00+00:00"},{"week":2,"projection":3.96704888,"opponent":"vs JAX","kickoff":"2026-09-20T20:05:00+00:00"},{"week":3,"projection":3.63249862,"opponent":"vs LAR","kickoff":"2026-09-28T00:20:00+00:00"}],"outlook":""},{"id":5220680,"name":"Ted Hurst III","pos":"WR","nfl_team":"TB","status":"ACTIVE","slot_id":20,"slot":"Bench","owner_id":0,"eligible_slots":[25,3,4,5,23,7,20,21],"projection":3.6646669,"actual":null,"kickoff":"2026-09-13T17:00:00+00:00","opponent":"@ CIN","game_state":"pre","locked":false,"availability":"FREEAGENT","week_outlook":[{"week":1,"projection":3.6646669,"opponent":"@ CIN","kickoff":"2026-09-13T17:00:00+00:00"},{"week":2,"projection":3.42381484,"opponent":"vs CLE","kickoff":"2026-09-20T17:00:00+00:00"},{"week":3,"projection":3.51920189,"opponent":"vs MIN","kickoff":"2026-09-27T20:05:00+00:00"}],"outlook":"Hurst was selected by the Buccaneers in the third round of April's draft. Granted he played at a small school, but Hurst ranked third in this rookie class target share (26%) and first in air yard share (45%) during his FBS career. A tall, vertical receiver, Hurst posted solid collegiate efficiency despite inconsistent QB play (only 68% of his 235 FBS targets were catchable, which is easily lowest among qualified WRs in this class). His 135-inch broad jump was best among wide receivers at the combine. Hurst will get some run at 'X' receiver as a rookie, but he's a longshot for consistent rookie-season fantasy production with Emeka Egbuka, Chris Godwin and Jalen McMillan in the fold."},{"id":4879276,"name":"Bryce Lance","pos":"WR","nfl_team":"NO","status":"ACTIVE","slot_id":20,"slot":"Bench","owner_id":0,"eligible_slots":[25,3,4,5,23,7,20,21],"projection":3.58859473,"actual":null,"kickoff":"2026-09-13T17:00:00+00:00","opponent":"@ DET","game_state":"pre","locked":false,"availability":"FREEAGENT","week_outlook":[{"week":1,"projection":3.58859473,"opponent":"@ DET","kickoff":"2026-09-13T17:00:00+00:00"},{"week":2,"projection":3.51679143,"opponent":"@ BAL","kickoff":"2026-09-20T17:00:00+00:00"},{"week":3,"projection":3.88555123,"opponent":"vs LV","kickoff":"2026-09-27T20:25:00+00:00"}],"outlook":"Lance was selected by the Saints in the fourth round of April's draft. Trey's little brother is the lone wide receiver in this rookie class who didn't play a single snap at the FBS level. However, he was productive as a perimeter receiver at North Dakota State, posting receiving lines of 75-1,053-17 and 51-1,079-8 over the last two seasons. He's a year or so older than most of his classmates, but he dominated at the combine with terrific showings in the 40-yard dash (4.34), vertical (41.5) and broad jump (133). He has the size and skillset to handle New Orleans' No. 3 gig behind Chris Olave and Devaughn Vele until first-round rookie Jordyn Tyson returns from injury. Lance's primary value is in dynasty leagues."},{"id":4597703,"name":"Tory Horton","pos":"WR","nfl_team":"SEA","status":"OUT","slot_id":20,"slot":"Bench","owner_id":0,"eligible_slots":[3,4,5,23,7,20,21],"projection":3.53920263,"actual":0.0,"kickoff":"2026-09-10T00:20:00+00:00","opponent":"vs NE","game_state":"post","locked":false,"availability":"WAIVERS","week_outlook":[{"week":1,"projection":3.53920263,"opponent":"vs NE","kickoff":"2026-09-10T00:20:00+00:00"},{"week":2,"projection":3.6971435,"opponent":"@ ARI","kickoff":"2026-09-20T20:25:00+00:00"},{"week":3,"projection":3.73667132,"opponent":"@ WSH","kickoff":"2026-09-27T17:00:00+00:00"}],"outlook":"Horton had the look of a Day 3 find by Seattle early on in 2025 prior to a season-ending shin injury suffered in Week 9. The 2025 fifth-round pick opened his career buried on the depth chart behind Jaxon Smith-Njigba and Cooper Kupp, but still found a way to make an impact while being limited to 46% of the offensive snaps. Though his production was volatile and he never cleared five targets in a game, he found the end zone five times on 23 targets. Despite the impressive showing, Horton's short-term outlook is dicey with JSN, Kupp and Rashid Shaheed presumably ahead of him on the depth chart. The 23-year-old's primary value is as a dynasty stash."},{"id":4045305,"name":"Ian Thomas","pos":"TE","nfl_team":"LV","status":"ACTIVE","slot_id":20,"slot":"Bench","owner_id":0,"eligible_slots":[5,6,23,7,20,21],"projection":3.49295351,"actual":null,"kickoff":"2026-09-13T20:25:00+00:00","opponent":"vs MIA","game_state":"pre","locked":false,"availability":"FREEAGENT","week_outlook":[{"week":1,"projection":3.49295351,"opponent":"vs MIA","kickoff":"2026-09-13T20:25:00+00:00"},{"week":2,"projection":0.41324636,"opponent":"@ LAC","kickoff":"2026-09-20T20:05:00+00:00"},{"week":3,"projection":0.41383001,"opponent":"@ NO","kickoff":"2026-09-27T20:25:00+00:00"}],"outlook":""},{"id":-16019,"name":"Giants D/ST","pos":"DST","nfl_team":"NYG","status":"ACTIVE","slot_id":20,"slot":"Bench","owner_id":0,"eligible_slots":[16,20,21],"projection":3.47112874,"actual":null,"kickoff":"2026-09-14T00:20:00+00:00","opponent":"vs DAL","game_state":"pre","locked":false,"availability":"FREEAGENT","week_outlook":[{"week":1,"projection":3.47112874,"opponent":"vs DAL","kickoff":"2026-09-14T00:20:00+00:00"},{"week":2,"projection":2.74394519,"opponent":"@ LAR","kickoff":"2026-09-22T00:15:00+00:00"},{"week":3,"projection":6.48934502,"opponent":"vs TEN","kickoff":"2026-09-27T17:00:00+00:00"}],"outlook":"The Giants' linebacker corps is their D/ST strength, and it's possible this could be a sneaky-good source of sacks. Nevertheless, it's almost impossible to make a case to draft them, being that they face the Cowboys and Rams to open 2026. Should the Giants impress in those games, however, they could be a prime pickup for a soft Weeks 3-6 portion of their schedule (TEN, ARI, @WSH, NO)."},{"id":4240603,"name":"Malik Davis","pos":"RB","nfl_team":"DAL","status":"ACTIVE","slot_id":20,"slot":"Bench","owner_id":0,"eligible_slots":[2,3,23,7,20,21],"projection":3.46681102,"actual":null,"kickoff":"2026-09-14T00:20:00+00:00","opponent":"@ NYG","game_state":"pre","locked":false,"availability":"FREEAGENT","week_outlook":[{"week":1,"projection":3.46681102,"opponent":"@ NYG","kickoff":"2026-09-14T00:20:00+00:00"},{"week":2,"projection":3.91466751,"opponent":"vs WSH","kickoff":"2026-09-20T20:25:00+00:00"},{"week":3,"projection":3.26717625,"opponent":"vs BAL","kickoff":"2026-09-27T20:25:00+00:00"}],"outlook":""},{"id":-16028,"name":"Commanders D/ST","pos":"DST","nfl_team":"WSH","status":"ACTIVE","slot_id":20,"slot":"Bench","owner_id":0,"eligible_slots":[16,20,21],"projection":3.46358507,"actual":null,"kickoff":"2026-09-13T20:25:00+00:00","opponent":"@ PHI","game_state":"pre","locked":false,"availability":"FREEAGENT","week_outlook":[{"week":1,"projection":3.46358507,"opponent":"@ PHI","kickoff":"2026-09-13T20:25:00+00:00"},{"week":2,"projection":3.3442588,"opponent":"@ DAL","kickoff":"2026-09-20T20:25:00+00:00"},{"week":3,"projection":4.38861554,"opponent":"vs SEA","kickoff":"2026-09-27T17:00:00+00:00"}],"outlook":"After a miserable 2025 that saw them surrender the most yards while scoring the third-fewest fantasy points, the Commanders brought in a slew of offseason reinforcements, though it was more of a quantitative than qualitative process. There's no reason to trust this D/ST in Weeks 1 and 2, which are road matchups with the Eagles and Cowboys, but if the Commanders show midseason promise, bear in mind its most favorable matchups come during the season's second half."},{"id":3930086,"name":"Dawson Knox","pos":"TE","nfl_team":"BUF","status":"ACTIVE","slot_id":20,"slot":"Bench","owner_id":0,"eligible_slots":[5,6,23,7,20,21],"projection":3.43517902,"actual":null,"kickoff":"2026-09-13T17:00:00+00:00","opponent":"@ HOU","game_state":"pre","locked":false,"availability":"FREEAGENT","week_outlook":[{"week":1,"projection":3.43517902,"opponent":"@ HOU","kickoff":"2026-09-13T17:00:00+00:00"},{"week":2,"projection":3.67322695,"opponent":"vs DET","kickoff":"2026-09-18T00:15:00+00:00"},{"week":3,"projection":3.70334142,"opponent":"vs LAC","kickoff":"2026-09-27T17:00:00+00:00"}],"outlook":"Knox enters his eighth season as a solid role player for the Buffalo offense. He is on the field quite a bit (20th among tight ends in snaps last season), but defers to Dalton Kincaid when it comes to the team's top target priority at the TE position. Even when Kincaid was sidelined last season, Knox was limited to only 3.6 targets and 6.1 fantasy points per game. Knox has never posted a top-10 fantasy campaign and has finished outside the top 30 in PPG each of the last three seasons. Even if Kincaid misses additional time, Knox will max out as a fantasy TE2."},{"id":-16022,"name":"Cardinals D/ST","pos":"DST","nfl_team":"ARI","status":"ACTIVE","slot_id":20,"slot":"Bench","owner_id":0,"eligible_slots":[16,20,21],"projection":3.41351987,"actual":null,"kickoff":"2026-09-13T20:25:00+00:00","opponent":"@ LAC","game_state":"pre","locked":false,"availability":"FREEAGENT","week_outlook":[{"week":1,"projection":3.41351987,"opponent":"@ LAC","kickoff":"2026-09-13T20:25:00+00:00"},{"week":2,"projection":3.82168907,"opponent":"vs SEA","kickoff":"2026-09-20T20:25:00+00:00"},{"week":3,"projection":2.8304547,"opponent":"@ SF","kickoff":"2026-09-27T20:05:00+00:00"}],"outlook":"The seeds are here for the Cardinals to have a respectable pass defense -- Budda Baker, Josh Sweat and Will Johnson all return -- but a lot would need to go right for Nick Rallis' defense to become a fantasy force. As is, the Cardinals have one of the league's toughest D/ST schedules, largely due to their playing in last year's winningest division -- their three division rivals combined to go 38-13. But hey, they do have what could be a great fantasy-playoff schedule (NYJ, @NO, LV, from Weeks 15-17), if they show us anything early."},{"id":4429148,"name":"Theo Johnson","pos":"TE","nfl_team":"NYG","status":"ACTIVE","slot_i look":"Returning for his third year with the Chargers, Vidal is set to compete with newcomer Keaton Mitchell for change-of-pace touches behind Omarion Hampton. Vidal had some big moments in 2025, clearing 17 fantasy points in four games, but the notable disclaimer here is that Hampton was sidelined for all of those outings. In fact, Vidal scored only 4.1 fantasy PPG in his other nine games. The 2024 sixth-round pick is a fine depth player who showed he can handle big workloads when needed, but he'll be worth rostering only should Hampton miss time and, even then, Mitchell figures to play a role."},{"id":4241372,"name":"Hollywood Brown","pos":"WR","nfl_team":"PHI","status":"ACTIVE","slot_id":20,"slot":"Bench","owner_id":0,"eligible_slots":[3,4,5,23,7,20,21],"projection":2.41321201,"actual":null,"kickoff":"2026-09-13T20:25:00+00:00","opponent":"vs WSH","game_state":"pre","locked":false,"availability":"FREEAGENT","week_outlook":[{"week":1,"projection":2.41321201,"opponent":"vs WSH","kickoff":"2026-09-13T20:25:00+00:00"},{"week":2,"projection":1.80790054,"opponent":"@ TEN","kickoff":"2026-09-20T17:00:00+00:00"},{"week":3,"projection":1.85033369,"opponent":"@ CHI","kickoff":"2026-09-29T00:15:00+00:00"}],"outlook":"Brown signed with the Eagles and he's likely to slot in either third or fourth on the team's depth chart behind DeVonta Smith, first-round rookie Makai Lemon and perhaps Dontayvion Wicks. Once a featured target in Baltimore and Arizona, Brown was more of a situational player during his two seasons in Kansas City. He barely saw the field in 2024 due to injury before handling a career-low 14.2% target share in 16 games in 2025. Brown cleared 10 fantasy points three times, but all came prior to Week 7. With Dallas Goedert and Saquon Barkley also heavily in the mix for targets in Philly, Brown will have to beat out Lemon and Wicks for a starting gig in order to have any chance at flex value."},{"id":4360516,"name":"Tyrone Tracy Jr.","pos":"RB","nfl_team":"NYG","sta s out to 11.8 fantasy PPG, which would've ranked eighth among all tight ends last season, ahead of the likes of Harold Fannin Jr., Travis Kelce, Tyler Warren and Jake Ferguson. Kittle (Achilles) is expected to be ready for Week 1, but if he's ruled out, Tonges will be a viable replacement."},{"id":4360797,"name":"Tutu Atwell","pos":"WR","nfl_team":"LAR","status":"OUT","slot_id":20,"slot":"Bench","owner_id":0,"eligible_slots":[3,4,5,23,7,20,21],"projection":1.7447069,"actual":null,"kickoff":"2026-09-11T00:35:00+00:00","opponent":"vs SF","game_state":"pre","locked":false,"availability":"FREEAGENT","week_outlook":[{"week":1,"projection":1.7447069,"opponent":"vs SF","kickoff":"2026-09-11T00:35:00+00:00"},{"week":2,"projection":1.74556843,"opponent":"vs NYG","kickoff":"2026-09-22T00:15:00+00:00"},{"week":3,"projection":1.58274018,"opponent":"@ DEN","kickoff":"2026-09-28T00:20:00+00:00"}],"outlook":""},{"id":4683153,"name":"Skyler Bell","pos":"WR","nfl_team":"BUF","status":"ACTIVE","slot_id":20,"slot":"Bench","owner_id":0,"eligible_slots":[25,3,4,5,23,7,20,21],"projection":1.70750542,"actual":null,"kickoff":"2026-09-13T17:00:00+00:00","opponent":"@ HOU","game_state":"pre","locked":false,"availability":"FREEAGENT","week_outlook":[{"week":1,"projection":1.70750542,"opponent":"@ HOU","kickoff":"2026-09-13T17:00:00+00:00"},{"week":2,"projection":1.84884652,"opponent":"vs DET","kickoff":"2026-09-18T00:15:00+00:00"},{"week":3,"projection":1.86761076,"opponent":"vs LAC","kickoff":"2026-09-27T17:00:00+00:00"}],"outlook":"Bell was selected by the Bills in the fourth round of April's draft. Bell is an undersized, but versatile, receiver who finished 2025 second in the nation (first in this WR rookie class) in receiving yards (1,278) and, while he had a class-high 25 drops across 52 collegiate games, he was better in this area last season (five drops on 146 targets). Bell showed well at the combine, running a solid 4.40 40-yard dash and posting terrific marks in the vertical and broad jump. With DJ Moore and Khalil Shakir locked in atop Buffalo's WR depth chart, Bell will compete with Keon Coleman and Josh Palmer for work. He's only worth drafting in dynasty formats."},{"id":4048228,"name":"John Bates","pos":"TE","nfl_team":"WSH","status":"ACTIVE","slot_id":20,"slot":"Bench","owner_id":0,"eligible_slots":[5,6,23,7,20,21],"projection":1.70029479,"actual":null,"kickoff":"2026-09-13T20:25:00+00:00","opponent":"@ PHI","game_state":"pre","locked":false,"availability":"FREEAGENT","week_outlook":[{"week":1,"projection":1.70029479,"opponent":"@ PHI","kickoff":"2026-09-13T20:25:00+00:00"},{"week":2,"projection":1.82740524,"opponent":"@ DAL","kickoff":"2026-09-20T20:25:00+00:00"},{"week":3,"projection":1.69918873,"opponent":"vs SEA","kickoff":"2026-09-27T17:00:00+00:00"}],"outlook":""},{"id":4431574,"name":"Eli Stowers","pos":"TE","nfl_team":"PHI","status":"QUESTIONABLE","slot_id":20,"slot":"Bench","owner_id":0,"eligible_slots":[25,5,6,23,7,20,21],"projection":1.67968098,"actual":null,"kickoff":"2026-09-13T20:25:00+00:00","opponent":"vs WSH","game_state":"pre","locked":false,"availability":"FREEAGENT","week_outlook":[{"week":1,"projection":1.67968098,"opponent":"vs WSH","kickoff":"2026-09-13T20:25:00+00:00"},{"week":2,"projection":1.58499937,"opponent":"@ TEN","kickoff":"2026-09-20T17:00:00+00:00"},{"week":3,"projection":1.61000927,"opponent":"@ CHI","kickoff":"2026-09-29T00:15:00+00:00"}],"outlook":"Stowers was selected by the Eagles in the second round of April's draft. Stowers is a converted quarterback who improved his production each of the last three seasons, peaking with a 62-769-4 receiving line in 2025. He aligned in the slot on 72% of his collegiate routes (highest among this rookie tight end class) and his career 2.38 YPRR is easily tops in this TE class. He's not much of a blocker, but he sports good speed and athleticism (he posted the best vertical and broad jumps among TEs at the combine). Stowers will have minimal fantasy value while wor V","kickoff":"2026-09-27T20:25:00+00:00"}],"outlook":"Kamara is entering his age-31 season set to play a change-of-pace role behind Travis Etienne and is unlikely to be a fantasy option. Over the past seven seasons, only two backs age 31 or older have posted a top-30 fantasy campaign, and both required 16-plus touchdowns. (Kamara hasn't cleared nine TDs since 2020 and scored once in 2025). Injuries limited Kamara to career-low marks across the board last season (including a 10% target share, considerably worse than his previous career low of 18%), and he hasn't played a full season since his rookie year (2017). A longtime fantasy star, Kamara is worth no more than a late flier."},{"id":4361529,"name":"Isiah Pacheco","pos":"RB","nfl_team":"DET","status":"INJURY_RESERVE","slot_id":20,"slot":"Bench","owner_id":0,"eligible_slots":[2,3,23,7,20,21],"projection":0.0,"actual":null,"kickoff":"2026-09-13T17:00:00+00:00","opponent":"vs NO","game_state":"pre","locked":false,"availability":"FREEAGENT","week_outlook":[{"week":1,"projection":0.0,"opponent":"vs NO","kickoff":"2026-09-13T17:00:00+00:00"},{"week":2,"projection":0.0,"opponent":"@ BUF","kickoff":"2026-09-18T00:15:00+00:00"},{"week":3,"projection":0.0,"opponent":"vs NYJ","kickoff":"2026-09-27T17:00:00+00:00"}],"outlook":"Pacheco signed with Detroit in the offseason after a four-year stint with the Chiefs. The 2022 seventh-round NFL draft pick opened his pro career with a bang, totaling 2,139 yards and 14 touchdowns on 432 touches during his first two seasons (31 games). Injuries and a big drop in efficiency have limited him to 952 yards and three TDs on 232 touches over the past two seasons (20 games) and ultimately led to his exit from Kansas City. The 27-year-old will now get a shot to replace David Montgomery as Detroit's change-of-pace back to Jahmyr Gibbs. Pacheco might hit for the occasional touchdown, but he won't have standalone fantasy value unless Gibbs misses time. Consider Pacheco a late-round insurance flier."},{"id":4877706,"name":"Jayden Higgins","pos":"WR","nfl_team":"HOU","status":"INJURY_RESERVE","slot_id":20,"slot":"Bench","owner_id":0,"eligible_slots":[3,4,5,23,7,20,21],"projection":0.0,"actual":null,"kickoff":"2026-09-13T17:00:00+00:00","opponent":"vs BUF","game_state":"pre","locked":false,"availability":"FREEAGENT","week_outlook":[{"week":1,"projection":0.0,"opponent":"vs BUF","kickoff":"2026-09-13T17:00:00+00:00"},{"week":2,"projection":0.0,"opponent":"vs CIN","kickoff":"2026-09-20T17:00:00+00:00"},{"week":3,"projection":0.0,"opponent":"@ IND","kickoff":"2026-09-27T17:00:00+00:00"}],"outlook":"Higgins is out for the 2026 season after tearing his ACL in mid August. As a rookie, the 2025 second-round pick played 58% of Houston's offensive snaps and handled a 12% target share en route to clearing 500 yards and scoring six touchdowns. Higgins averaged a lowly 7.6 fantasy PPG, but the 6-foot-4 perimeter receiver is a good bet for a larger role opposite Nico Collins once healthy in 2027. Keep him stashed in dynasty."},{"id":4428209,"name":"Ricky Pearsall","pos":"WR","nfl_team":"SF","status":"INJURY_RESERVE","slot_id":20,"slot":"Bench","owner_id":0,"eligible_slots":[3,4,5,23,7,20,21],"projection":0.0,"actual":null,"kickoff":"2026-09-11T00:35:00+00:00","opponent":"@ LAR","game_state":"pre","locked":false,"availability":"FREEAGENT","week_outlook":[{"week":1,"projection":0.0,"opponent":"@ LAR","kickoff":"2026-09-11T00:35:00+00:00"},{"week":2,"projection":0.0,"opponent":"vs MIA","kickoff":"2026-09-20T20:25:00+00:00"},{"week":3,"projection":0.0,"opponent":"vs ARI","kickoff":"2026-09-27T20:05:00+00:00"}],"outlook":"Pearsall (knee) is out for the 2026 season after battling injuries during his first two NFL campaigns. The 2024 first-round pick's rookie season ended on a strong note (18-plus fantasy points in Weeks 17 and 18) and that momentum carried over early in 2025 (14.6 fantasy PPG during Weeks 1-3). Pearsall then suffered a knee injury and went on to average 7.5 PPG in six games the rest of the season. Pearsall holds the unfortunate distinction of having the most targets among all players who failed to score a single TD last season. Pearsall will enter 2027 - his age-27 campaign - eyeing his first fully healthy campaign and will battle for a starting job in San Francisco. He's no longer a must hold in dynasty, but he's a fine enough hold in deep leagues."},{"id":3045147,"name":"James Conner","pos":"RB","nfl_team":"ARI","status":"INJURY_RESERVE","slot_id":20,"slot":"Bench","owner_id":0,"eligible_slots":[2,3,23,7,20,21],"projection":0.0,"actual":null,"kickoff":"2026-09-13T20:25:00+00:00","opponent":"@ LAC","game_state":"pre","locked":false,"availability":"FREEAGENT","week_outlook":[{"week":1,"projection":0.0,"opponent":"@ LAC","kickoff":"2026-09-13T20:25:00+00:00"},{"week":2,"projection":0.0,"opponent":"vs SEA","kickoff":"2026-09-20T20:25:00+00:00"},{"week":3,"projection":0.0,"opponent":"@ SF","kickoff":"2026-09-27T20:05:00+00:00"}],"outlook":"Conner is entering his 10th NFL season without a clear path to touches. For starters, we haven't seen him in a while after he suffered a season-ending foot injury in Week 3 last season. Even prior to the injury, Conner was splitting work with Trey Benson, totaling 28 touches in two full games. Conner restructured his contract during the offseason, but his days as Arizona's lead back are over after Jeremiyah Love and Tyler Allgeier were added to the roster during the offseason. Conner, who delivered four straight top-15 fantasy (points per game) campaigns prior to 2025, will need to find a new home in order to have any shot at 2026 fantasy relevance. He'll begin the season on IR."},{"id":3915411,"name":"Ty Johnson","pos":"RB","nfl_team":"BUF","status":"QUESTIONABLE","slot_id":20,"slot":"Bench","owner_id":0,"eligible_slots":[2,3,23,7,20,21],"projection":0.0,"actual":null,"kickoff":"2026-09-13T17:00:00+00:00","opponent":"@ HOU","game_state":"pre","locked":false,"availability":"FREEAGENT","week_outlook":[{"week":1,"projection":0.0,"opponent":"@ HOU","kickoff":"2026-09-13T17:00:00+00:00"},{"week":2,"projection":4.81674866,"opponent":"vs DET","kickoff":"2026-09-18T00:15:00+00:00"},{"week":3,"projection":4.89872607,"opponent":"vs LAC","kickoff":"2026-09-27T17:00:00+00:00"}],"outlook":"Johnson has settled in as a productive change-of-pace and receiving option in the Buffalo backfield behind James Cook. Johnson enters his eighth NFL season having yet to clear 63 carries or 34 catches in a season, but his role allows for him to hit for the occasional big game (15-plus fantasy points four times over the last two seasons). Of course, those games have come at random, making Johnson an unusable fantasy commodity. Even if Cook misses time this season, it's likely that Johnson would remain in his role, with Ray Davis instead stepping into lead back duties. Johnson plays a valuable role for Buffalo, but he's not a fantasy option."},{"id":4360423,"name":"Michael Penix Jr.","pos":"QB","nfl_team":"ATL","status":"OUT","slot_id":20,"slot":"Bench","owner_id":0,"eligible_slots":[0,7,20,21],"projection":0.0,"actual":null,"kickoff":"2026-09-13T17:00:00+00:00","opponent":"@ PIT","game_state":"pre","locked":false,"availability":"FREEAGENT","week_outlook":[{"week":1,"projection":0.0,"opponent":"@ PIT","kickoff":"2026-09-13T17:00:00+00:00"},{"week":2,"projection":0.0,"opponent":"vs CAR","kickoff":"2026-09-20T17:00:00+00:00"},{"week":3,"projection":0.57122315,"opponent":"@ GB","kickoff":"2026-09-25T00:15:00+00:00"}],"outlook":"Penix is no longer guaranteed a starting job entering his third season. The 2024 first-round pick has appeared in 14 games and has 14 total touchdowns, a 21% off-target rate and a 60% completion percentage to show for it. Penix has done well to avoid turnovers (six career INTs), but he's a nonfactor with his legs (career 28-81-2 rushing) and failed to post a single fantasy outing better than 10th last season. Penix tore an ACL in Week 11, which further complicates his path to beating out newcomer Tua Tagovailoa for the team's Week 1 starting gig. The 26-year-old might eventually emerge into a fine NFL starter, but even if he does, his lack of rushing will limit his fantasy output. He's well off the fantasy radar."},{"id":3916945,"name":"Darius Slayton","pos":"WR","nfl_team":"\u2014","status":"ACTIVE","slot_id":20,"slot":"Bench","owner_id":0,"eligible_slots":[3,4,5,23,7,20,21],"projection":0.0,"actual":null,"kickoff":null,"opponent":null,"game_state":"unknown","locked":false,"availability":"FREEAGENT","week_outlook":[{"week":1,"projection":0.0,"opponent":null,"kickoff":null},{"week":2,"projection":0.0,"opponent":null,"kickoff":null},{"week":3,"projection":0.0,"opponent":null,"kickoff":null}],"outlook":""},{"id":4430841,"name":"Carson Beck","pos":"QB","nfl_team":"ARI","status":"ACTIVE","slot_id":20,"slot":"Bench","owner_id":0,"eligible_slots":[25,0,7,20,21],"projection":0.0,"actual":null,"kickoff":"2026-09-13T20:25:00+00:00","opponent":"@ LAC","game_state":"pre","locked":false,"availability":"FREEAGENT","week_outlook":[{"week":1,"projection":0.0,"opponent":"@ LAC","kickoff":"2026-09-13T20:25:00+00:00"},{"week":2,"projection":0.0,"opponent":"vs SEA","kickoff":"2026-09-20T20:25:00+00:00"},{"week":3,"projection":0.0,"opponent":"@ SF","kickoff":"2026-09-27T20:05:00+00:00"}],"outlook":"Beck was selected by the Cardinals in the third round of April's draft. Beck is a big, experienced quarterback who started for two seasons at Georgia prior to leading Miami to the national championship game last season. Beck paced this rookie QB class in completion percentage last season (72.4%) and for his career (69.5%), while also leading this group with an 80.9 QBR and 8.4 YPA during his 55-game collegiate career. He's unlikely to offer much with his legs in the pros, however, and will begin his career behind Jacoby Brissett and likely Gardner Minshew. Beck has no short-term fantasy value, though he could very well make some starts during his rookie season. Monitor him in superflex."},{"id":4685279,"name":"Jaydon Blue","pos":"RB","nfl_team":"\u2014","status":"ACTIVE","slot_id":20,"slot":"Bench","owner_id":0,"eligible_slots":[2,3,23,7,20,21],"projection":0.0,"actual":null,"kickoff":null,"opponent":null,"game_state":"unknown","locked":false,"availability":"FREEAGENT","week_outlook":[{"week":1,"projection":0.0,"opponent":null,"kickoff":null},{"week":2,"projection":0.0,"opponent":null,"kickoff":null},{"week":3,"projection":0.0,"opponent":null,"kickoff":null}],"outlook":""},{"id":3895856,"name":"Christian Kirk","pos":"WR","nfl_team":"SF","status":"INJURY_RESERVE","slot_id":20,"slot":"Bench","owner_id":0,"eligible_slots":[3,4,5,23,7,20,21],"projection":0.0,"actual":null,"kickoff":"2026-09-11T00:35:00+00:00","opponent":"@ LAR","game_state":"pre","locked":false,"availability":"FREEAGENT","week_outlook":[{"week":1,"projection":0.0,"opponent":"@ LAR","kickoff":"2026-09-11T00:35:00+00:00"},{"week":2,"projection":0.0,"opponent":"vs MIA","kickoff":"2026-09-20T20:25:00+00:00"},{"week":3,"projection":0.0,"opponent":"vs ARI","kickoff":"2026-09-27T20:05:00+00:00"}],"outlook":"Kirk signed with the 49ers after spending his first eight seasons with Arizona, Jacksonville and Houston. The 2018 second-round pick peaked with a 12th-place finish in fantasy points in 2022, but that marks his only career top-25 finish and he's been way off the fantasy radar the last two seasons, partially due to injury woes (13 missed games). Kirk doesn't have a clear path to consistent targets in San Francisco, with Mike Evans, Deebo Samuel and rookie De'Zhaun Stribling also in the mix (not to mention Christian McCaffrey and eventually George Kittle). The 29-year-old will begin the season on IR and is not on the fantasy radar."},{"id":4685526,"name":"Adam Randall","pos":"RB","nfl_team":"BAL","status":"INJURY_RESERVE","slot_id":20,"slot":"Bench","owner_id":0,"eligible_slots":[25,2,3,23,7,20,21],"projection":0.0,"actual":null,"kickoff":"2026-09-1
