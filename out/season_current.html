ponent":"vs LAC","kickoff":"2026-09-27T17:00:00+00:00"}],"outlook":"Cook signed a contract extension last offseason and was immediately vaulted into the biggest role of his career. The 2022 second-round NFL draft pick finished in the top five among backs in carries, rushing yards (league-high 1,621), touchdowns and yards per carry (5.25). The one limiting factor in Cook's fantasy output was a minimal receiving role (his 40 targets ranked 26th among RBs), but he still came through with a sixth-place finish in fantasy points. The 26-year-old is set to play the same role in Joe Brady's scheme and will be a candidate for his third straight double-digit touchdown campaign as long as Josh Allen is under center. Consider Cook a midrange RB1."},{"id":4429160,"name":"De'Von Achane","pos":"RB","nfl_team":"MIA","status":"ACTIVE","slot_id":2,"slot":"RB","owner_id":8,"eligible_slots":[2,3,23,7,20,21],"projection":18.21431381,"actual":null,"kickoff":"2026-09-13T20:25:00+00:00","opponent":"@ LV","game_state":"pre","locked":false,"availability":"ONTEAM","week_outlook":[{"week":1,"projection":18.21431381,"opponent":"@ LV","kickoff":"2026-09-13T20:25:00+00:00"},{"week":2,"projection":16.79339065,"opponent":"@ SF","kickoff":"2026-09-20T20:25:00+00:00"},{"week":3,"projection":16.8231976,"opponent":"vs KC","kickoff":"2026-09-27T17:00:00+00:00"}],"outlook":"Achane has quickly staked his claim as one of the best running backs in the league. The 2023 third-round pick has scored either 11 or 12 touchdowns in each of his three seasons and put up a career-high 1,838 scrimmage yards in 2025. Achane's elite receiving production is nothing new (he has finished in the top five among backs in targets and receiving yards in each of the past two years), but he made another leap forward as a rusher last season, finishing fifth at the position in rushing yards. His 5.62 yards per carry is best among qualified backs since he entered the league. The 24-year-old is eyeing his third straight top-five fantasy campaign, and while that might be tricky in an overhauled Miami offense led by quarterback Malik Willis, Achane has minimal competition for touches and should easily be the offensive centerpiece. He's a solid RB1 option."},{"id":4569618,"name":"Garrett Wilson","pos":"WR","nfl_team":"NYJ","status":"ACTIVE","slot_id":4,"slot":"WR","owner_id":8,"eligible_slots":[3,4,5,23,7,20,21],"projection":13.54553299,"actual":null,"kickoff":"2026-09-13T17:00:00+00:00","opponent":"@ TEN","game_state":"pre","locked":false,"availability":"ONTEAM","week_outlook":[{"week":1,"projection":13.54553299,"opponent":"@ TEN","kickoff":"2026-09-13T17:00:00+00:00"},{"week":2,"projection":13.45230678,"opponent":"vs GB","kickoff":"2026-09-20T17:00:00+00:00"},{"week":3,"projection":12.9426049,"opponent":"@ DET","kickoff":"2026-09-27T17:00:00+00:00"}],"outlook":"Wilson is eyeing a bounce-back following an injury-shortened 2025 that limited him to seven games. It was the first time Wilson had missed time, having appeared in all 51 games during his first three seasons. The 2022 first-round pick ranked no lower than sixth among receivers in targets in each of those years, but he failed to produce a fantasy campaign better than 20th (PPG) due to New York's quarterback woes. Wilson was off to a hot start last season (four TDs, 14.2 fantasy PPG) thanks to a massive 33% target share (second highest). New York's signal-caller problems still aren't completely solved, but veteran Geno Smith should provide an upgrade over last year's Justin Fields/Tyrod Taylor duo. Wilson, 26, is one of the best raw talents at the position and should be valued as a good WR2."},{"id":4567750,"name":"Emeka Egbuka","pos":"WR","nfl_team":"TB","status":"ACTIVE","slot_id":4,"slot":"WR","owner_id":8,"eligible_slots":[3,4,5,23,7,20,21],"projection":13.42242469,"actual":null,"kickoff":"2026-09-13T17:00:00+00:00","opponent":"@ CIN","game_state":"pre","locked":false,"availability":"ONTEAM","week_outlook":[{"week":1,"projection":13.42242469,"opponent":"@ CIN","kickoff":"2026-09-13T17:00:00+00:00"},{"week":2,"projection":12.47469715,"opponent":"vs CLE","kickoff":"2026-09-20T17:00:00+00:00"},{"week":3,"projection":12.83632713,"opponent":"vs MIN","kickoff":"2026-09-27T20:05:00+00:00"}],"outlook":"Egbuka is a fascinating evaluation following a rookie season that couldn't have started much better (five TDs and 20.5 fantasy PPG during his first five games), but that fell apart from there (one TD and 7.8 PPG during his final 12 games). By season's end, Egbuka sat in the top 10 in targets and air yards, but a horrific 49% catch rate led to a 34th-place finish in fantasy PPG. The good news is that, with Mike Evans out of the picture and Chris Godwin now 30 years old, Egbuka has a shot to emerge as Baker Mayfield's No. 1 target. The 2025 first-round pick is a strong bet for a leap forward and should be viewed as a WR2 with the potential for a full-on breakout."},{"id":4431459,"name":"Tyler Warren","pos":"TE","nfl_team":"IND","status":"ACTIVE","slot_id":6,"slot":"TE","owner_id":8,"eligible_slots":[5,6,23,7,20,21],"projection":11.12191694,"actual":null,"kickoff":"2026-09-13T17:00:00+00:00","opponent":"vs BAL","game_state":"pre","locked":false,"availability":"ONTEAM","week_outlook":[{"week":1,"projection":11.12191694,"opponent":"vs BAL","kickoff":"2026-09-13T17:00:00+00:00"},{"week":2,"projection":11.06405473,"opponent":"@ KC","kickoff":"2026-09-21T00:20:00+00:00"},{"week":3,"projection":10.63087939,"opponent":"vs HOU","kickoff":"2026-09-27T17:00:00+00:00"}],"outlook":"Warren put together a solid rookie season, but it could've been even better. In 12 games with a healthy Daniel Jones, Warren scored five touchdowns and averaged 13.1 fantasy PPG. In five games without Jones, Warren fell to 6.3 PPG and failed to find the end zone. In fact, the 2025 first-round pick was unlucky in the scoring department, ranking fifth among tight ends in end zone targets (seven) and expected TDs (7.5). Warren finished the season third among tight ends in targets and also had three goal-line carries. The 24-year-old was already a featured target and might see even more work with Michael Pittman Jr. shipped to Pittsburgh. Warren is a quality TE1."},{"id":3915511,"name":"Joe Burrow","pos":"QB","nfl_team":"CIN","status":"ACTIVE","slot_id":0,"slot":"QB","owner_id":8,"eligible_slots":[0,7,20,21],"projection":19.56912313,"actual":null,"kickoff":"2026-09-13T17:00:00+00:00","opponent":"vs TB","game_state":"pre","locked":false,"availability":"ONTEAM","week_outlook":[{"week":1,"projection":19.56912313,"opponent":"vs TB","kickoff":"2026-09-13T17:00:00+00:00"},{"week":2,"projection":16.82712012,"opponent":"@ HOU","kickoff":"2026-09-20T17:00:00+00:00"},{"week":3,"projection":17.34451476,"opponent":"@ PIT","kickoff":"2026-09-27T17:00:00+00:00"}],"outlook":"Burrow will attempt to bounce back after injuries limited him to eight games in 2025. The 29-year-old has now missed at least six games in three of his six pro seasons, including two of his past three. Burrow was still a starting-caliber fantasy quarterback when active last season (top-12 scorer in five of his final six games), but his ceiling was limited by a near complete lack of rushing (41 yards on 14 carries). Burrow was a top-five scoring quarterback in each of his past two full seasons, and coach Zac Taylor cut back a bit on his extreme pass-heavy playcalling last season, so Burrow is best valued as more of a midrange QB1 than an elite option."},{"id":4432708,"name":"Marvin Harrison Jr.","pos":"WR","nfl_team":"ARI","status":"ACTIVE","slot_id":23,"slot":"FLEX","owner_id":8,"eligible_slots":[3,4,5,23,7,20,21],"projection":10.68034965,"actual":null,"kickoff":"2026-09-13T20:25:00+00:00","opponent":"@ LAC","game_state":"pre","locked":false,"availability":"ONTEAM","week_outlook":[{"week":1,"projection":10.68034965,"opponent":"@ LAC","kickoff":"2026-09-13T20:25:00+00:00"},{"week":2,"projection":10.15747236,"opponent":"vs SEA","kickoff":"2026-09-20T20:25:00+00:00"},{"week":3,"projection":10.87358685,"opponent":"@ SF","kickoff":"2026-09-27T20:05:00+00:00"}],"outlook":"Harrison's pro career is off to a slow start after he was selected with the No. 4 overall pick back in 2024. The Ohio State product was serviceable as a rookie (885 yards and eight TDs), but he missed five full games and was limited in others en route to a 41-608-4 receiving line in 2025. Harrison has finished 41st and 39th, respectively, in fantasy PPG despite a massive role near the goal line (he's third in the NFL in end zone targets since he was drafted and finished both seasons in the top five). Harrison is only entering his prime at age 24 and perhaps he'll make a Year 3 leap with new coach Mike LaFleur calling the plays and with Kyler Murray no longer under center. Harrison performed better with Jacoby Brissett under center last season and has the raw talent to make him well worth post-hype consideration in the middle rounds."},{"id":4371733,"name":"Kenny Gainwell","pos":"RB","nfl_team":"TB","status":"ACTIVE","slot_id":20,"slot":"Bench","owner_id":8,"eligible_slots":[2,3,23,7,20,21],"projection":10.27115839,"actual":null,"kickoff":"2026-09-13T17:00:00+00:00","opponent":"@ CIN","game_state":"pre","locked":false,"availability":"ONTEAM","week_outlook":[{"week":1,"projection":10.27115839,"opponent":"@ CIN","kickoff":"2026-09-13T17:00:00+00:00"},{"week":2,"projection":9.91934685,"opponent":"vs CLE","kickoff":"2026-09-20T17:00:00+00:00"},{"week":3,"projection":10.06868736,"opponent":"vs MIN","kickoff":"2026-09-27T20:05:00+00:00"}],"outlook":"Gainwell signed with the Buccaneers following a second-half breakout with Pittsburgh last season. After playing sparingly during the first four-and-a-half years of his career, Gainwell averaged 13.3 touches, 85.0 yards and 17.8 fantasy points from Week 8 on last season (eight games). Only five backs scored more points than Gainwell after Week 10. He did most of his damage as a receiver (top six among RBs in targets, catches and receiving yards) and will now look to earn a similar role alongside Bucky Irving in Tampa Bay. Gainwell's strong season suggests he'll have a role, but the 23-year-old Irving is likely to operate as the lead back. Gainwell is best valued as a bench/insurance stash with some flex appeal in deep PPR leagues."},{"id":2473037,"name":"Jason Myers","pos":"K","nfl_team":"SEA","status":"ACTIVE","slot_id":17,"slot":"K","owner_id":8,"eligible_slots":[17,20,21],"projection":8.74013267,"actual":7.0,"kickoff":"2026-09-10T00:20:00+00:00","opponent":"vs NE","game_state":"post","locked":true,"availability":"ONTEAM","week_outlook":[{"week":1,"projection":8.74013267,"opponent":"vs NE","kickoff":"2026-09-10T00:20:00+00:00"},{"week":2,"projection":8.89976362,"opponent":"@ ARI","kickoff":"2026-09-20T20:25:00+00:00"},{"week":3,"projection":8.89925892,"opponent":"@ WSH","kickoff":"2026-09-27T17:00:00+00:00"}],"outlook":""},{"id":4701936,"name":"Matthew Golden","pos":"WR","nfl_team":"GB","status":"ACTIVE","slot_id":20,"slot":"Bench","owner_id":8,"eligible_slots":[3,4,5,23,7,20,21],"projection":10.1471945,"actual":null,"kickoff":"2026-09-13T20:25:00+00:00","opponent":"@ MIN","game_state":"pre","locked":false,"availability":"ONTEAM","week_outlook":[{"week":1,"projection":10.1471945,"opponent":"@ MIN","kickoff":"2026-09-13T20:25:00+00:00"},{"week":2,"projection":10.27537239,"opponent":"@ NYJ","kickoff":"2026-09-20T17:00:00+00:00"},{"week":3,"projection":10.88190673,"opponent":"vs ATL","kickoff":"2026-09-25T00:15:00+00:00"}],"outlook":"Golden is eyeing a Year 2 leap following a disappointing rookie season in which he was limited to 39 touches and failed to find the end zone in 14 regular-season games. Golden was limited to 53% of the snaps and never cleared six targets in a single outing. Some optimism was generated from Golden's 4-84-1 receiving line in the playoff loss to Chicago, but even with Romeo Doubs and Dontayvion Wicks gone, it's unclear if he will actually see a big boost in usage in Matt LaFleur's offense considering that no Green Bay receiver has cleared a 21% target share since Davante Adams' departure prior to 2022. The speedy Golden, who also contributes as a rusher, is a recent first-round pick entering his second season. He's worth a speculative middle-round flier."},{"id":-16017,"name":"Patriots D/ST","pos":"DST","nfl_team":"NE","status":"ACTIVE","slot_id":16,"slot":"DST","owner_id":8,"eligible_slots":[16,20,21],"projection":4.65480912,"actual":7.0,"kickoff":"2026-09-10T00:20:00+00:00","opponent":"@ SEA","game_state":"post","locked":true,"availability":"ONTEAM","week_outlook":[{"week":1,"projection":4.65480912,"opponent":"@ SEA","kickoff":"2026-09-10T00:20:00+00:00"},{"week":2,"projection":6.12267984,"opponent":"vs PIT","kickoff":"2026-09-20T17:00:00+00:00"},{"week":3,"projection":5.33896558,"opponent":"@ JAX","kickoff":"2026-09-27T17:00:00+00:00"}],"outlook":"Zak Kuhr, elevated to the defensive coordinator position early last season, steered this D/ST to the sixth-most fantasy points and a Super Bowl LX berth. Now in the permanent role, he'll have a strengthened unit, with DE Dre'Mont Jones and S Kevin Byard brought on board, though it's fair to point out that the 2025 Patriots generated nearly one quarter of their fantasy points on defensive or special teams touchdowns. This is a team better used as a streaming than weekly defense, and bear in mind it has a tough-as-nails Super Bowl rematch in Seattle to begin the year."},{"id":4373678,"name":"Khalil Shakir","pos":"WR","nfl_team":"BUF","status":"ACTIVE","slot_id":20,"slot":"Bench","owner_id":8,"eligible_slots":[3,4,5,23,7,20,21],"projection":8.56052435,"actual":null,"kickoff":"2026-09-13T17:00:00+00:00","opponent":"@ HOU","game_state":"pre","locked":false,"availability":"ONTEAM","week_outlook":[{"week":1,"projection":8.56052435,"opponent":"@ HOU","kickoff":"2026-09-13T17:00:00+00:00"},{"week":2,"projection":9.19669559,"opponent":"vs DET","kickoff":"2026-09-18T00:15:00+00:00"},{"week":3,"projection":9.26170452,"opponent":"vs LAC","kickoff":"2026-09-27T17:00:00+00:00"}],"outlook":"Shakir has settled in as a reliable, short-range target for Josh Allen, though the role hasn't led to much fantasy success. The 2022 fifth-round pick has cleared a 20% target share and 70 catches in consecutive seasons, ranking top five among receivers in catch rate and RAC both years. A nonfactor near the goal line, however, Shakir totaled eight TDs and five end zone targets during the span. Shakir finished the two seasons just outside of the top 35 fantasy receivers and will now have to compete with DJ Moore for the team lead in targets. Shakir was already barely worth flex consideration, so the potential for a slight decrease in target volume suggests the 26-year-old is no more than a low-ceiling bench option."},{"id":4428557,"name":"Tyjae Spears","pos":"RB","nfl_team":"TEN","status":"ACTIVE","slot_id":20,"slot":"Bench","owner_id":8,"eligible_slots":[2,3,23,7,20,21],"projection":8.92140431,"actual":null,"kickoff":"2026-09-13T17:00:00+00:00","opponent":"vs NYJ","game_state":"pre","locked":false,"availability":"ONTEAM","week_outlook":[{"week":1,"projection":8.92140431,"opponent":"vs NYJ","kickoff":"2026-09-13T17:00:00+00:00"},{"week":2,"projection":8.14663853,"opponent":"vs PHI","kickoff":"2026-09-20T17:00:00+00:00"},{"week":3,"projection":8.57694419,"opponent":"@ NYG","kickoff":"2026-09-27T17:00:00+00:00"}],"outlook":"Spears is set for his fourth NFL season, including his third as a change-of-pace backup to Tony Pollard. The role hasn't been particularly fruitful from a fantasy standpoint, as Spears has yet to clear five touchdowns in a season, nor has he produced a top-30 fantasy campaign. Spears, who has also struggled with durability (nine games missed over the past two years), isn't used much as a rusher (100 or fewer carries all three seasons), but he is an effective receiver (top 10 among RBs in catches in both 2023 and 2025). The 25-year-old will resume his role as a receiving specialist in 2026 and, even if the Titans' offense makes a big leap in QB Cam Ward's second season, Spears is unlikely to find his way to consistent fantasy value."},{"id":4036378,"name":"Jordan Love","pos":"QB","nfl_team":"GB","status":"ACTIVE","slot_id":20,"slot":"Bench","owner_id":8,"eligible_slots":[0,7,20,21],"projection":16.18058316,"actual":null,"kickoff":"2026-09-13T20:25:00+00:00","opponent":"@ MIN","game_state":"pre","locked":false,"availability":"ONTEAM","week_outlook":[{"week":1,"projection":16.18058316,"opponent":"@ MIN","kickoff":"2026-09-13T20:25:00+00:00"},{"week":2,"projection":16.53695187,"opponent":"@ NYJ","kickoff":"2026-09-20T17:00:00+00:00"},{"week":3,"projection":18.26494671,"opponent":"vs ATL","kickoff":"2026-09-25T00:15:00+00:00"}],"outlook":"Love is back for his fourth season as the Packers' starting quarterback. The 2020 first-round pick has emerged as one of the league's best passers (he has finished ninth, fifth and third in QBR during his three seasons as a starter), but that hasn't converted to much fantasy production as of late. After finishing sixth in fantasy points per game in 2023, Love has finished 17th and 21st the past two seasons. A dramatic dip in both passing (19th in pass attempts both years) and rushing (282 yards and one TD total during the two seasons) has been the culprit. Love, who produced just five weekly finishes better than 16th last season, has a limited ceiling in Matt LaFleur's scheme. He's best valued as a back-end QB2."}],"submitted":{"assignments":[{"slot_id":2,"slot":"RB","player_id":4379399},{"slot_id":2,"slot":"RB","player_id":4429160},{"slot_id":4,"slot":"WR","player_id":4569618},{"slot_id":4,"slot":"WR","player_id":4567750},{"slot_id":6,"slot":"TE","player_id":4431459},{"slot_id":0,"slot":"QB","player_id":3915511},{"slot_id":23,"slot":"FLEX","player_id":4432708},{"slot_id":17,"slot":"K","player_id":2473037},{"slot_id":16,"slot":"DST","player_id":-16017}],"projection":116. ton has a clear path to lead rusher duties in 2026, and his targets only figure to increase with Greg Roman out and Mike McDaniel in as the team's playcaller. Add in a much-improved offensive line with star tackles Joe Alt and Rashawn Slater back healthy, and Hampton has nothing short of elite upside. Value him as a fringe RB1 with room for more."},{"id":4262921,"name":"Justin Jefferson","pos":"WR","nfl_team":"MIN","status":"ACTIVE","slot_id":4,"slot":"WR","owner_id":9,"eligible_slots":[3,4,5,23,7,20,21],"projection":15.77672234,"actual":null,"kickoff":"2026-09-13T20:25:00+00:00","opponent":"vs GB","game_state":"pre","locked":false,"availability":"ONTEAM","week_outlook":[{"week":1,"projection":15.77672234,"opponent":"vs GB","kickoff":"2026-09-13T20:25:00+00:00"},{"week":2,"projection":16.24094683,"opponent":"@ CHI","kickoff":"2026-09-20T17:00:00+00:00"},{"week":3,"projection":15.38524548,"opponent":"@ TB","kickoff":"2026-09-27T20:05:00+00:00"}],"outlook":"After finishing in the top 10 among receivers in fantasy PPG during each of his first five seasons, Jefferson plummeted to 30th in 2025. The fall was, of course, unrelated to Jefferson's ability, as the team's quarterback woes limited the star receiver to career-low showings in yardage (1,048), touchdowns (two), catch rate (60%) and yards per target (7.4). Jefferson's fall came despite him seeing a career-high 30.1% target share and ranking in the top six at the position in targets (141) and end zone targets (15). The 27-year-old remains an elite player, but the quarterback concerns aren't fully solved, with dual-threat Kyler Murray (one receiver managed a top-25 fantasy campaign during his time as a starter in Arizona) set to work as the starter. Perhaps Murray can ignite Jefferson similar to how he did DeAndre Hopkins at times, but there's certainly some risk. Jefferson is best considered as a mid-range WR1."},{"id":4685472,"name":"Tetairoa McMillan","pos":"WR","nfl_team":"CAR","status":"ACTIVE","slot_id":4,"slot":"WR","owner_id":9,"eligible_slots":[3,4,5,23,7,20,21],"projection":13.92642468,"actual":null,"kickoff":"2026-09-13T17:00:00+00:00","opponent":"vs CHI","game_state":"pre","locked":false,"availability":"ONTEAM","week_outlook":[{"week":1,"projection":13.92642468,"opponent":"vs CHI","kickoff":"2026-09-13T17:00:00+00:00"},{"week":2,"projection":13.65675801,"opponent":"@ ATL","kickoff":"2026-09-20T17:00:00+00:00"},{"week":3,"projection":12.38424122,"opponent":"@ CLE","kickoff":"2026-09-27T17:00:00+00:00"}],"outlook":"The reigning NFL Offensive Rookie of the Year, McMillan is a candidate to make the leap into the \"elite\" conversation at wide receiver this season. The 2025 eighth overall pick was very busy as a rookie (top 15 among WRs in snaps, routes, target share, targets, yards, end zone targets and touchdowns) and, while he finished 16th among receivers in fantasy points (22nd PPG), he lacked upside, producing only one top-10 outing (Week 9). Improving on a 56% catch rate will be key in Year 2, though that would require improvement from Bryce Young. McMillan, 23, remains positioned as Carolina's clear top target and, though Young's limitations may cap his ceiling a bit, McMillan's talent/usage combo supplies him with top-10 upside. He's safest as a midrange fantasy WR2."},{"id":4723086,"name":"Colston Loveland","pos":"TE","nfl_team":"CHI","status":"ACTIVE","slot_id":6,"slot":"TE","owner_id":9,"eligible_slots":[5,6,23,7,20,21],"projection":10.97862673,"actual":null,"kickoff":"2026-09-13T17:00:00+00:00","opponent":"@ CAR","game_state":"pre","locked":false,"availability":"ONTEAM","week_outlook":[{"week":1,"projection":10.97862673,"opponent":"@ CAR","kickoff":"2026-09-13T17:00:00+00:00"},{"week":2,"projection":11.00046101,"opponent":"vs MIN","kickoff":"2026-09-20T17:00:00+00:00"},{"week":3,"projection":10.66312149,"opponent":"vs PHI","kickoff":"2026-09-29T00:15:00+00:00"}],"outlook":"After averaging 4.1 targets and 8.5 fantasy PPG during his first 14 NFL games, Loveland leaped to 12.0 targets (10-plus in each) and 20.0 fantasy PPG during his final four games of 2025 (including the playoffs). For perspective, there have been only 12 instances of a tight end seeing at least 10 targets in four consecutive regular-season games in NFL history (and only one was a rookie). Loveland's overall efficiency was terrific, as he ranked eighth or better among tight ends in YPR, YPT and YPRR. With DJ Moore gone, the 2025 first-round pick enters his age-22 season all but locked into a massive workload alongside Rome Odunze and Luther Burden III. Loveland's ceiling is lofty, and midrange fantasy TE1 should be his floor."},{"id":4569173,"name":"Rhamondre Stevenson","pos":"RB","nfl_team":"NE","status":"ACTIVE","slot_id":2,"slot":"RB","owner_id":9,"eligible_slots":[2,3,23,7,20,21],"projection":13.88701885,"actual":13.0,"kickoff":"2026-09-10T00:20:00+00:00","opponent":"@ SEA","game_state":"post","locked":true,"availability":"ONTEAM","week_outlook":[{"week":1,"projection":13.88701885,"opponent":"@ SEA","kickoff":"2026-09-10T00:20:00+00:00"},{"week":2,"projection":11.2105107,"opponent":"vs PIT","kickoff":"2026-09-20T17:00:00+00:00"},{"week":3,"projection":11.80264403,"opponent":"@ JAX","kickoff":"2026-09-27T17:00:00+00:00"}],"outlook":"Stevenson will battle with second-year back TreVeyon Henderson for touches in the New England backfield. The duo shared the backfield at times last season, but it was the veteran Stevenson who usually operated as the lead back. He earned the role, ranking fifth among backs in forced missed tackle rate, per PFF, second in yards after contact (2.82) and first in yards per target (9.1). Stevenson, who is entering his sixth season, did miss three games (he has missed time three seasons in a row), and his overall volume was limited (9.3 carries and 2.7 targets per game), which led to a 25th-place finish in fantasy points. Now 28 years old and with Henderson still very much in the mix, Stevenson, who has one top-20 fantasy campaign to his name, is a low-upside bench option."},{"id":4040715,"name":"Jalen Hurts","pos":"QB","nfl_team":"PHI","status":"ACTIVE","slot_id":0,"slot":"QB","owner_id":9,"eligible_slots":[0,7,20,21],"projection":22.62902101,"actual":null,"kickoff":"2026-09-13T20:25:00+00:00","opponent":"vs WSH","game_state":"pre","locked":false,"availability":"ONTEAM","week_outlook":[{"week":1,"projection":22.62902101,"opponent":"vs WSH","kickoff":"2026-09-13T20:25:00+00:00"},{"week":2,"projection":20.58335512,"opponent":"@ TEN","kickoff":"2026-09-20T17:00:00+00:00"},{"week":3,"projection":20.7562799,"opponent":"@ CHI","kickoff":"2026-09-29T00:15:00+00:00"}],"outlook":"Hurts enters his seventh NFL season and sixth as the starter in Philadelphia. The 28-year-old tossed a career-high 25 touchdowns last season, but his rushing production was way down (105-421-8 after delivering at least 139 carries, 605 yards and 10 TDs in each of the prior four seasons). Hurts' fantasy production dipped, as his 18.7 points per game was his lowest as a starter and ranked eighth at the position after three straight top-five campaigns. Hurts' supporting cast remains strong (even without A.J. Brown), and new playcaller Sean Mannion very well could add some juice back to the offense. Hurts' fantasy stock is down a bit from years past, but his dual-threat ability locks him in as a midrange QB1."},{"id":4038815,"name":"Rico Dowdle","pos":"RB","nfl_team":"PIT","status":"ACTIVE","slot_id":2,"slot":"RB","owner_id":9,"eligible_slots":[2,3,23,7,20,21],"projection":12.87827015,"actual":null,"kickoff":"2026-09-13T17:00:00+00:00","opponent":"vs ATL","game_state":"pre","locked":false,"availability":"ONTEAM","week_outlook":[{"week":1,"projection":12.87827015,"opponent":"vs ATL","kickoff":"2026-09-13T17:00:00+00:00"},{"week":2,"projection":10.66600095,"opponent":"@ NE","kickoff":"2026-09-20T17:00:00+00:00"},{"week":3,"projection":12.28180997,"opponent":"vs CIN","kickoff":"2026-09-27T17:00:00+00:00"}],"outlook":"Dowdle signed with the Steelers after nearly identical campaigns with the Cowboys in 2024 (1,328 yards and five TDs on 274 touches) and Panthers in 2025 (1,373 yards and seven TDs on 275 touches). He was effective as a rusher (4.57 yards per carry) and fairly busy as a receiver (50 targets both years) en route to finishing just inside the top 25 in fantasy points per game both seasons. Now in Pittsburgh, the 28-year-old is expected to share work with Jaylen Warren. Earning lead-rusher duties could get Dowdle into the weekly flex discussion, but the ceiling will be low and he'll likely need an injury in order to find his way to consistent fantasy output. Consider him for your bench."},{"id":4035687,"name":"Michael Pittman Jr.","pos":"WR","nfl_team":"PIT","status":"ACTIVE","slot_id":20,"slot":"Bench","owner_id":9,"eligible_slots":[3,4,5,23,7,20,21],"projection":11.07520044,"actual":null,"kickoff":"2026-09-13T17:00:00+00:00","opponent":"vs ATL","game_state":"pre","locked":false,"availability":"ONTEAM","week_outlook":[{"week":1,"projection":11.07520044,"opponent":"vs ATL","kickoff":"2026-09-13T17:00:00+00:00"},{"week":2,"projection":10.06915176,"opponent":"@ NE","kickoff":"2026-09-20T17:00:00+00:00"},{"week":3,"projection":11.15574455,"opponent":"vs CIN","kickoff":"2026-09-27T17:00:00+00:00"}],"outlook":"Pittman was traded to the Steelers after spending his first six NFL seasons with the Colts. The 2020 second-round pick handled a hefty 23.6% of Indianapolis' targets during his tenure, which helped him to four top-20 fantasy campaigns. Pittman has reached 800 receiving yards in five consecutive seasons while primarily operating as a short-to-intermediate target. The role has limited his scoring (he has 25 TDs in 95 games) and that may not change much with DK Metcalf on the other side in Pittsburgh. Of course, Pittman will be a featured target in an offense led by Aaron Rodgers. That's enough to put the 28-year-old squarely in the weekly WR3 mix."},{"id":-16023,"name":"Steelers D/ST","pos":"DST","nfl_team":"PIT","status":"ACTIVE","slot_id":16,"slot":"DST","owner_id":9,"eligible_slots":[16,20,21],"projection":7.47802288,"actual":null,"kickoff":"2026-09-13T17:00:00+00:00","opponent":"vs ATL","game_state":"pre","locked":false,"availability":"ONTEAM","week_outlook":[{"week":1,"projection":7.47802288,"opponent":"vs ATL","kickoff":"2026-09-13T17:00:00+00:00"},{"week":2,"projection":5.90157783,"opponent":"@ NE","kickoff":"2026-09-20T17:00:00+00:00"},{"week":3,"projection":6.21711107,"opponent":"vs CIN","kickoff":"2026-09-27T17:00:00+00:00"}],"outlook":"The No. 1 D/ST selected on average last season, the Steelers finished a disappointing 14th in fantasy points and scored fewer than five points in 8-of-17 games. They've since overhauled their coaching staff, with Mike McCarthy replacing Mike Tomlin, and Patrick Graham as defensive coordinator, the same role he held with the Raiders from 2022-25. The offseason additions of S Jaquan Brisker and CB Jamel Dean should bolster this unit, and it benefits greatly from one of the softest September and October schedules in the league. Get this D/ST early, but be prepared to seek a replacement after that point."},{"id":4574716,"name":"Harrison Mevis","pos":"K","nfl_team":"LAR","status":"ACTIVE","slot_id":17,"slot":"K","owner_id":9,"eligible_slots":[17,20,21],"projection":8.84554839,"actual":null,"kickoff":"2026-09-11T00:35:00+00:00","opponent":"vs SF","game_state":"pre","locked":false,"availability":"ONTEAM","week_outlook":[{"week":1,"projection":8.84554839,"opponent":"vs SF","kickoff":"2026-09-11T00:35:00+00:00"},{"week":2,"projection":9.06375657,"opponent":"vs NYG","kickoff":"2026-09-22T00:15:00+00:00"},{"week":3,"projection":8.12293316,"opponent":"@ DEN","kickoff":"2026-09-28T00:20:00+00:00"}],"outlook":""},{"id":4361741,"name":"Brock Purdy","pos":"QB","nfl_team":"SF","status":"ACTIVE","slot_id":20,"slot":"Bench","owner_id":9,"eligible_slots":[0,7,20,21],"projection":16.87708966,"actual":null,"kickoff":"202 ceiver. He's the only back in the NFL with 40-plus catches in each of the past four seasons, and his 89.1% career catch rate is easily best in NFL history among players with 100-plus targets. The 27-year-old is the favorite to lead the Washington backfield, but Jacory Croskey-Merritt and perhaps others will be involved. White will find himself on the weekly flex radar as long as he remains atop the depth chart. "},{"id":3917315,"name":"Kyler Murray","pos":"QB","nfl_team":"MIN","status":"ACTIVE","slot_id":20,"slot":"Bench","owner_id":9,"eligible_slots":[0,7,20,21],"projection":17.86284382,"actual":null,"kickoff":"2026-09-13T20:25:00+00:00","opponent":"vs GB","game_state":"pre","locked":false,"availability":"ONTEAM","week_outlook":[{"week":1,"projection":17.86284382,"opponent":"vs GB","kickoff":"2026-09-13T20:25:00+00:00"},{"week":2,"projection":18.24995606,"opponent":"@ CHI","kickoff":"2026-09-20T17:00:00+00:00"},{"week":3,"projection":16.87785718,"opponent":"@ TB","kickoff":"2026-09-27T20:05:00+00:00"}],"outlook":"Murray signed with the Vikings after spending his first seven seasons with the Cardinals. The change comes after a disappointing and injury-shortened 2025 season in which he failed to clear 18.3 fantasy points in any of his five appearances. Murray has settled in as an accurate but conservative passer and continues to add value with his legs (78-572-5 in 17 games in 2024). Prior to the 2025 dud, Murray had finished each of his first six NFL seasons as a top-12 fantasy QB (points per game). Now that he beat out J.J. McCarthy for Minnesota's starting job, he'll have the luxury of working with Justin Jefferson, Jordan Addison and T.J. Hockenson. Add that to his rushing ability, and the 29-year-old certainly could find his way into the weekly QB1 mix. Consider Murray in the middle to late rounds."},{"id":4360689,"name":"Tyler Shough","pos":"QB","nfl_team":"NO","status":"ACTIVE","slot_id":20,"slot":"Bench","owner_id":9,"eligible_slots":[0,7,20,21],"projection":15.61420732,"actual":null,"kickoff":"2026-09-13T17:00:00+00:00","opponent":"@ DET","game_state":"pre","locked":false,"availability":"ONTEAM","week_outlook":[{"week":1,"projection":15.61420732,"opponent":"@ DET","kickoff":"2026-09-13T17:00:00+00:00"},{"week":2,"projection":15.12226847,"opponent":"@ BAL","kickoff":"2026-09-20T17:00:00+00:00"},{"week":3,"projection":18.81166345,"opponent":"vs LV","kickoff":"2026-09-27T20:25:00+00:00"}],"outlook":"One of the surprise second-half breakout players of 2025, Shough scored 17-plus fantasy points in seven of his nine full games, including six straight to end the season. The 2025 second-round pick was a solid producer with his arm (250.1 passing yards per game) and his legs (19.3 rushing yards per game and three TDs). Shough didn't show a high ceiling (he never reached 22 fantasy points in a game), though that can be traced to a shaky supporting cast. That's an area that should be better in 2026 with Travis Etienne Jr. and No. 8 overall pick Jordyn Tyson (once healthy) joining the team. He's still unproven, but Shough enters Year 2 (same as coach Kellen Moore) as an intriguing fantasy breakout candidate. He's worth a look in the later rounds."}],"submitted":{"assignments":[{"slot_id":23,"slot":"FLEX","player_id":4685382},{"slot_id":4,"slot":"WR","player_id":4262921},{"slot_id":4,"slot":"WR","player_id":4685472},{"slot_id":6,"slot":"TE","player_id":4723086},{"slot_id":2,"slot":"RB","player_id":4569173},{"slot_id":0,"slot":"QB","player_id":4040715},{"slot_id":2,"slot":"RB","player_id":4038815},{"slot_id":16,"slot":"DST","player_id":-16023},{"slot_id":17,"slot":"K","player_id":4574716}],"projection":124.18,"actual":13.0,"remaining_projection":110.29,"in_progress":false,"complete":true,"note":"ESPN projection baseline in league scoring; not independently researched. No win probability."},"recommended":{"assignments":[{"slot_id":0,"slot":"QB","player_id":4040715},{"slot_id":2,"slot":"RB","player_id":4569173},{"slot_id":2,"slot":"RB ":"QUESTIONABLE","slot_id":2,"slot":"RB","owner_id":10,"eligible_slots":[25,2,3,23,7,20,21],"projection":14.37156407,"actual":null,"kickoff":"2026-09-13T20:25:00+00:00","opponent":"@ LAC","game_state":"pre","locked":false,"availability":"ONTEAM","week_outlook":[{"week":1,"projection":14.37156407,"opponent":"@ LAC","kickoff":"2026-09-13T20:25:00+00:00"},{"week":2,"projection":15.21009102,"opponent":"vs SEA","kickoff":"2026-09-20T20:25:00+00:00"},{"week":3,"projection":16.33490594,"opponent":"@ SF","kickoff":"2026-09-27T20:05:00+00:00"}],"outlook":"Love was selected by the Cardinals with the No. 3 overall pick of April's draft. Love has good size and terrific speed (4.36 40-yard dash) to go along with a three-down skill set. He led this year's rookie class in both yards per carry (6.66) and yards after contact (4.16) while ranking second in forced missed tackle rate (3.5) during his collegiate career. He's a capable receiver at all levels, a competent pass blocker and protects the ball well (one fumble on 496 career touches). Love will immediately slot in as Arizona's feature back and, especially considering each of the past nine running backs drafted in the top 12 went on to finish top 12 in fantasy points as a rookie, he should be valued as a midrange RB1 with elite upside."},{"id":4428331,"name":"Rashee Rice","pos":"WR","nfl_team":"KC","status":"ACTIVE","slot_id":4,"slot":"WR","owner_id":10,"eligible_slots":[3,4,5,23,7,20,21],"projection":13.29086018,"actual":null,"kickoff":"2026-09-15T00:15:00+00:00","opponent":"vs DEN","game_state":"pre","locked":false,"availability":"ONTEAM","week_outlook":[{"week":1,"projection":13.29086018,"opponent":"vs DEN","kickoff":"2026-09-15T00:15:00+00:00"},{"week":2,"projection":14.5122882,"opponent":"vs IND","kickoff":"2026-09-21T00:20:00+00:00"},{"week":3,"projection":14.78109146,"opponent":"@ MIA","kickoff":"2026-09-27T17:00:00+00:00"}],"outlook":"Rice enters Year 4 of his career still seeking his first full season as a starter. The 2023 second-round pick was sidelined for most of 2024 due to injury and missed nine games last season due to suspension (Weeks 1-6) and injury (Weeks 16-18). The good news is that Rice remained highly productive when active. He handled 9.8 targets per game and was a top-12 fantasy receiver in five of his eight outings in 2025. Rice is Patrick Mahomes' top target, and his 8.0 RAC is tops among qualified receivers over the past three seasons. With Mahomes (ACL recovery) ready to go in Week 1 as expected, Rice finds himself in the WR1 mix."},{"id":4259545,"name":"D'Andre Swift","pos":"RB","nfl_team":"CHI","status":"ACTIVE","slot_id":2,"slot":"RB","owner_id":10,"eligible_slots":[2,3,23,7,20,21],"projection":12.61860228,"actual":null,"kickoff":"2026-09-13T17:00:00+00:00","opponent":"@ CAR","game_state":"pre","locked":false,"availability":"ONTEAM","week_outlook":[{"week":1,"projection":12.61860228,"opponent":"@ CAR","kickoff":"2026-09-13T17:00:00+00:00"},{"week":2,"projection":12.86211872,"opponent":"vs MIN","kickoff":"2026-09-20T17:00:00+00:00"},{"week":3,"projection":11.8648262,"opponent":"vs PHI","kickoff":"2026-09-29T00:15:00+00:00"}],"outlook":"Swift is entering his seventh NFL season and third with Chicago. The veteran back was busy as both a rusher and receiver en route to clearing 1,300 scrimmage yards in each of his first two seasons with the Bears. Though he found the end zone 10 times and finished 17th among backs in fantasy points per game last season, Swift deferred substantial work to Kyle Monangai and is likely to be in even more of a timeshare in 2026. Still in his prime at age 27, Swift continues to play at a high level (4.87 yards per carry last season), but his role in the Chicago offense figures to limit him to low-ceiling RB2/flex production."},{"id":4685702,"name":"Quinshon Judkins","pos":"RB","nfl_team":"CLE","status":"ACTIVE","slot_id":23,"slot":"FLEX","owner_id":10,"eligible_slots":[2,3,23,7,20,21],"projection":13.56387535,"actual":null,"kickoff":"2026-09-13T17:00:00+00:00","opponent":"@ JAX","game_state":"pre","locked":false,"availability":"ONTEAM","week_outlook":[{"week":1,"projection":13.56387535,"opponent":"@ JAX","kickoff":"2026-09-13T17:00:00+00:00"},{"week":2,"projection":12.89771077,"opponent":"@ TB","kickoff":"2026-09-20T17:00:00+00:00"},{"week":3,"projection":14.32768946,"opponent":"vs CAR","kickoff":"2026-09-27T17:00:00+00:00"}],"outlook":"Judkins is entering his second NFL season after a roller-coaster rookie campaign in which a solid 14-game stretch of action was bookended by missed time early because of an off-field issue and late because of a season-ending leg injury in Week 16. When on the field, Judkins handled a massive 71.4% share of Cleveland's designed rush attempts (16.4 per game). Though he was held to 3.6 yards per carry, he was dealing with a league-high 7.4 box defenders per attempt. He wasn't involved much as a receiver (2.6 targets per game), however, and was limited to 12.1 fantasy points per game (26th among RBs). The Cleveland offense has a new coach (Todd Monken) and quarterback questions remain, so while Judkins has a clear path to a big carry total, the 22-year-old might cap out as a midrange RB2 in 2026."},{"id":4038941,"name":"Justin Herbert","pos":"QB","nfl_team":"LAC","status":"ACTIVE","slot_id":0,"slot":"QB","owner_id":10,"eligible_slots":[0,7,20,21],"projection":20.44064847,"actual":null,"kickoff":"2026-09-13T20:25:00+00:00","opponent":"vs ARI","game_state":"pre","locked":false,"availability":"ONTEAM","week_outlook":[{"week":1,"projection":20.44064847,"opponent":"vs ARI","kickoff":"2026-09-13T20:25:00+00:00"},{"week":2,"projection":20.2359772,"opponent":"vs LV","kickoff":"2026-09-20T20:05:00+00:00"},{"week":3,"projection":19.62809622,"opponent":"@ BUF","kickoff":"2026-09-27T17:00:00+00:00"}],"outlook":"Herbert enters his seventh NFL season following a solid 2025 campaign in which he ranked just inside the top 10 quarterbacks in pass attempts, yards and touchdowns. Herbert added serious value with his legs, ranking fifth at the position in carries and second in rushing yards (career highs in both). He finished 10th among quarterbacks in fantasy points, but that's a bit misleading, as his inconsistent production led to five top-five weeks but no other finishes better than 13th. Herbert has finished between 11th and 15th in fantasy points per game in each of the past four seasons, though it's fair to expect a leap forward in 2026 with star tackles Joe Alt and Rashawn Slater healthy and a new playcaller in Mike McDaniel. Herbert is safest as a QB2, but there's upside for more."},{"id":4242355,"name":"Jake Ferguson","pos":"TE","nfl_team":"DAL","status":"ACTIVE","slot_id":6,"slot":"TE","owner_id":10,"eligible_slots":[5,6,23,7,20,21],"projection":8.65717176,"actual":null,"kickoff":"2026-09-14T00:20:00+00:00","opponent":"@ NYG","game_state":"pre","locked":false,"availability":"ONTEAM","week_outlook":[{"week":1,"projection":8.65717176,"opponent":"@ NYG","kickoff":"2026-09-14T00:20:00+00:00"},{"week":2,"projection":9.29035714,"opponent":"vs WSH","kickoff":"2026-09-20T20:25:00+00:00"},{"week":3,"projection":8.43834908,"opponent":"vs BAL","kickoff":"2026-09-27T20:25:00+00:00"}],"outlook":"Ferguson has emerged as a reliable target for Dak Prescott in the high-scoring Dallas offense, which has led to solid fantasy production. Ferguson, who has handled a 17% target share each of the past three seasons, is fresh off a career year in which he ranked third among tight ends in receptions, touchdowns and end zone targets (10). His nine top-12 fantasy weeks tied for second, though it's worth noting that his production dropped off substantially with a healthy CeeDee Lamb and George Pickens on the field during the second half of the season (under 12.0 fantasy points in each of his final eight healthy games, 7.3 PPG during the span). The 27-year-old's role as a short-range target (4.7 aDOT last season) limits his yardage upside, but he sees just enough work, including near the goal line, to allow fringe-TE1 production. Don't call him \"Joke Farterson\" (\"Fantasy Football Now\" viewers get it); Ferguson is vying for his third top-10 fantasy campaign in his past four seasons."},{"id":4432773,"name":"Brian Thomas Jr.","pos":"WR","nfl_team":"JAX","status":"ACTIVE","slot_id":20,"slot":"Bench","owner_id":10,"eligible_slots":[3,4,5,23,7,20,21],"projection":9.6409202,"actual":null,"kickoff":"2026-09-13T17:00:00+00:00","opponent":"vs CLE","game_state":"pre","locked":false,"availability":"ONTEAM","week_outlook":[{"week":1,"projection":9.6409202,"opponent":"vs CLE","kickoff":"2026-09-13T17:00:00+00:00"},{"week":2,"projection":9.21174202,"opponent":"@ DEN","kickoff":"2026-09-20T20:05:00+00:00"},{"week":3,"projection":9.87123876,"opponent":"vs NE","kickoff":"2026-09-27T17:00:00+00:00"}],"outlook":"Thomas is one of the biggest wild cards in fantasy after a roller-coaster start to his career. The 2024 first-round pick was fantasy's No. 4-scoring wide receiver as a rookie, but only played at that WR1 level with Mac Jones under center. Thomas averaged 5.8 targets and 14.4 fantasy PPG with Trevor Lawrence under center that season, and was even worse with Lawrence in 2025 (6.2 targets, 9.9 PPG). With Jakobi Meyers, Parker Washington and Travis Hunter in the mix, Thomas was utilized as more of a vertical threat in 2025 (his 14.4 aDOT was fourth highest), which led to a big dip in catch rate and touchdowns, as well as more drops. The Jaguars offense is suddenly very crowded, so Thomas is more likely to be a boom/bust flex than he is the superstar we expected one year ago. The 23-year-old's raw talent makes him worth middle-round consideration."},{"id":4569587,"name":"Wan'Dale Robinson","pos":"WR","nfl_team":"TEN","status":"ACTIVE","slot_id":20,"slot":"Bench","owner_id":10,"eligible_slots":[3,4,5,23,7,20,21],"projection":9.32769574,"actual":null,"kickoff":"2026-09-13T17:00:00+00:00","opponent":"vs NYJ","game_state":"pre","locked":false,"availability":"ONTEAM","week_outlook":[{"week":1,"projection":9.32769574,"opponent":"vs NYJ","kickoff":"2026-09-13T17:00:00+00:00"},{"week":2,"projection":8.82322634,"opponent":"vs PHI","kickoff":"2026-09-20T17:00:00+00:00"},{"week":3,"projection":9.19752927,"opponent":"@ NYG","kickoff":"2026-09-27T17:00:00+00:00"}],"outlook":"Robinson signed with the Titans after catching 90-plus passes each of the past two seasons. The 2022 second-round pick has progressively improved his production each season in the pros, peaking with a 30% target share (ninth among WRs), 1,014 yards (13th) and 13.6 fantasy PPG (16th) in 2025. An undersized, short-range slot target, Robinson isn't positioned for many big plays and is very rarely used near the goal line (he's yet to clear four TDs in a season and has 13 career end zone targets). In Tennessee, Robinson will battle rookie Carnell Tate and Calvin Ridley for the team lead in targets, but his potential for flex production will depend on whether Cam Ward is able to make a Year 2 leap. Robinson, 25, is a low-ceiling, middle-round target."},{"id":4429096,"name":"Blake Corum","pos":"RB","nfl_team":"LAR","status":"ACTIVE","slot_id":20,"slot":"Bench","owner_id":10,"eligible_slots":[2,3,23,7,20,21],"projection":9.73965307,"actual":null,"kickoff":"2026-09-11T00:35:00+00:00","opponent":"vs SF","game_state":"pre","locked":false,"availability":"ONTEAM","week_outlook":[{"week":1,"projection":9.73965307,"opponent":"vs SF","kickoff":"2026-09-11T00:35:00+00:00"},{"week":2,"projection":10.12384295,"opponent":"vs NYG","kickoff":"2026-09-22T00:15:00+00:00"},{"week":3,"projection":8.55408367,"opponent":"@ DEN","kickoff":"2026-09-28T00:20:00+00:00"}],"outlook":"Corum has spent his first two NFL seasons as Kyren Williams' backup, and that's expected to be the case again in 2026. The 2024 third-round NFL draft pick played well in the role last season, averaging a healthy 5.1 yards per carry (seventh among RBs) and scoring six touchdowns on 145 carries. However, Corum played only 29% of the Rams' snaps and remained a nonfactor as a receiver (36 yards on 14 targets). The 25-year-old has no standalone fantasy value, but he's an elite insurance stash, as he'd launch into the fringe-RB1 mix in the Rams' high-powered offense should Williams miss time."},{"id":-16021,"name":"Eagles D/ST","pos":"DST","nfl_team":"PHI","status":"ACTIVE","slot_id":16,"slot":"DST","owner_id":10,"eligible_slots":[16,20,21],"projection":6.33674169,"actual":null,"kickoff":"2026-09-13T20:25:00+00:00","opponent":"vs WSH","game_state":"pre","locked":false,"availability":"ONTEAM","week_outlook":[{"week":1,"projection":6.33674169,"opponent":"vs WSH","kickoff":"2026-09-13T20:25:00+00:00"},{"week":2,"projection":6.86875483,"opponent":"@ TEN","kickoff":"2026-09-20T17:00:00+00:00"},{"week":3,"projection":4.73452381,"opponent":"@ CHI","kickoff":"2026-09-29T00:15:00+00:00"}],"outlook":"Though the 2025 Eagles took a step backwards from the defensive stalwart that won Super Bowl LIX, their D/ST scored only 12 fewer total fantasy points and finished eighth at the position in scoring. Coordinator Vic Fangio typically extracts the most from his defenses, but the departures of S Reed Blankenship, LB Nakobe Dean, DE Brandon Graham and LB Jaelen Phillips heighten the challenge -- though the additions of LB Jonathan Greenard and CB Riq Woolen at least soften the blow. At least the team starts off with some soft matchups (WSH, Week 1; @TEN, Week 2), but be prepared to swap quickly if they're underperforming."},{"id":4429059,"name":"Woody Marks","pos":"RB","nfl_team":"HOU","status":"ACTIVE","slot_id":20,"slot":"Bench","owner_id":10,"eligible_slots":[2,3,23,7,20,21],"projection":8.37186165,"actual":null,"kickoff":"2026-09-13T17:00:00+00:00","opponent":"vs BUF","game_state":"pre","locked":false,"availability":"ONTEAM","week_outlook":[{"week":1,"projection":8.37186165,"opponent":"vs BUF","kickoff":"2026-09-13T17:00:00+00:00"},{"week":2,"projection":8.27656219,"opponent":"vs CIN","kickoff":"2026-09-20T17:00:00+00:00"},{"week":3,"projection":7.8455636,"opponent":"@ IND","kickoff":"2026-09-27T17:00:00+00:00"}],"outlook":"Marks, a fourth-round NFL draft pick in 2025, played a substantial role as a rookie, soaking up 220 touches (22nd among RBs), but he struggled with efficiency (his 3.59 yards per carry and 1.61 yards after contact both ranked near the basement) and found the end zone only five times. The result was 9.4 fantasy points per game and one top-10 fantasy outing. Marks appears ticketed for a lesser role in 2026 now that David Montgomery was brought in to serve as the likely leader of a backfield committee. Especially in an offense that doesn't use backs in the passing game very much, Marks is no more than a bench/insurance stash."},{"id":4430834,"name":"Jalen McMillan","pos":"WR","nfl_team":"TB","status":"QUESTIONABLE","slot_id":20,"slot":"Bench","owner_id":10,"eligible_slots":[3,4,5,23,7,20,21],"projection":7.58794287,"actual":null,"kickoff":"2026-09-13T17:00:00+00:00","opponent":"@ CIN","game_state":"pre","locked":false,"availability":"ONTEAM","week_outlook":[{"week":1,"projection":7.58794287,"opponent":"@ CIN","kickoff":"2026-09-13T17:00:00+00:00"},{"week":2,"projection":7.0427335,"opponent":"vs CLE","kickoff":"2026-09-20T17:00:00+00:00"},{"week":3,"projection":7.25044857,"opponent":"vs MIN","kickoff":"2026-09-27T20:05:00+00:00"}],"outlook":"McMillan is a fascinating late-round sleeper after he impressed as a rookie before missing all but four games due to injury last season. The 2024 third-round pick was featured during the final five games of his rookie season and exploded for a league-high seven TD catches (at least one in all five outings) and 19.8 fantasy PPG (more than 16.7 points in all five) in that span. He was limited in his return to action late in 2025, but did flash with a 7-114-0 performance on nine targets in Week 17. The 24-year-old has a path to a near-every-down role in 2026 with only Emeka Egbuka and 30-year-old Chris Godwin ahead of him on the depth chart. McMillan is worth the inexpensive flier on draft day."},{"id":17372,"name":"Chris Boswell","pos":"K","nfl_team":"PIT","status":"ACTIVE","slot_id":17,"slot":"K","owner_id":10,"eligible_slots":[17,20,21],"projection":8.40729367,"actual":null,"kickoff":"2026-09-13T17:00:00+00:00","opponent":"vs ATL","game_state":"pre","locked":false,"availability":"ONTEAM","week_outlook":[{"week":1,"projection":8.40729367,"opponent":"vs ATL","kickoff":"2026-09-13T17:00:00+00:00"},{"week":2,"projection":7.46207443,"opponent":"@ NE","kickoff":"2026-09-20T17:00:00+00:00"},{"week":3,"projection":8.30953596,"opponent":"vs CIN","kickoff":"2026-09-27T17:00:00+00:00"}],"outlook":""}],"submitted":{"assignments":[{"slot_id":4,"slot":"WR","player_id":4430878},{"slot_id":2,"slot":"RB","player_id":4870808},{"slot_id":4,"slot":"WR","player_id":4428331},{"slot_id":2,"slot":"RB","player_id":4259545},{"slot_id":23,"slot":"FLEX","player_id":4685702},{"slot_id":0,"slot":"QB","player_id":4038941},{"slot_id":6,"slot":"TE","player_id":4242355},{"slot_id":16,"slot":"DST","player_id":-16021},{"slot_id":17,"slot":"K","player_id":17372}],"projection":115.36,"actual":24.7,"remaining_projection":97.69,"in_progress":false,"complete":true,"note":"ESPN projection baseline in league scoring; not independently researched. No win probability."},"recommended":{"assignments":[{"slot_id":0,"slot":"QB","player_id":4038941},{"slot_id":2,"slot":"RB","player_id":4259545},{"slot_id":2,"slot":"RB","player_id":4685702},{"slot_id":4,"slot":"WR","player_id":4430878},{"slot_id":4,"slot":"WR","player_id":4428331},{"slot_id":6,"slot":"TE","player_id":4242355},{"slot_id":23,"slot":"FLEX","player_id":4870808},{"slot_id":17,"slot":"K","player_id":17372},{"slot_id":16,"slot":"DST","player_id":-16021}],"projection":115.36,"actual":24.7,"remaining_projection":97.69,"in_progress":false,"complete":true,"note":"ESPN projection baseline in league scoring; not independently researched. No win probability."}},{"id":11,"name":"Kevin","espn_name":"Kevin's Killers","manager":"Kevin","abbrev":"KEV","waiver_priority":11,"roster":[{"id":4430807,"name":"Bijan Robinson","pos":"RB","nfl_team":"ATL","status":"ACTIVE","slot_id":2,"slot":"RB","owner_id":11,"eligible_slots":[2,3,23,7,20,21],"projection":19.10597782,"actual":null,"kickoff":"2026-09-13T17:00:00+00:00","opponent":"@ PIT","game_state":"pre","locked":false,"availability":"ONTEAM","week_outlook":[{"week":1,"projection":19.10597782,"opponent":"@ PIT","kickoff":"2026-09-13T17:00:00+00:00"},{"week":2,"projection":21.71513456,"opponent":"vs CAR","kickoff":"2026-09-20T17:00:00+00:00"},{"week":3,"projection":20.22741467,"opponent":"@ GB","kickoff":"2026-09-25T00:15:00+00:00"}],"outlook":"Robinson enters his fourth season having finished in the top five among running backs in carries, rushing yards, touches, yards and fantasy points in each of the past two seasons. Also a big factor as a receiver, he has ranked no lower than fifth at the position in routes, targets, receptions and receiving yards in his three pro seasons. In 2025, PFF tracked him with 86 forced missed tackles, which was easily the most among backs. The 24-year-old is in his prime and, though he has a new coach in Kevin Stefanski, his path to a massive offensive role remains clear. He's on the short list of players who should be considered with the first pick of your fantasy draft."},{"id":4426354,"name":"George Pickens","pos":"WR","nfl_team":"DAL","status":"ACTIVE","slot_id":4,"slot":"WR","owner_id":11,"eligible_slots":[3,4,5,23,7,20,21],"projection":13.79182733,"actual":null,"kickoff":"2026-09-14T00:20:00+00:00","opponent":"@ NYG","game_state":"pre","locked":false,"availability":"ONTEAM","week_outlook":[{"week":1,"projection":13.79182733,"opponent":"@ NYG","kickoff":"2026-09-14T00:20:00+00:00"},{"week":2,"projection":14.06529209,"opponent":"vs WSH","kickoff":"2026-09-20T20:25:00+00:00"},{"week":3,"projection":12.8915379,"opponent":"vs BAL","kickoff":"2026-09-27T20:25:00+00:00"}],"outlook":"Pickens drew the franchise tag from Dallas after a career year in which he ranked near the top of the wide receiver position in most categories, including catches, yards, TDs, end zone targets (second with 18) and air yards (fourth with 1,576). Fantasy's No. 5-scoring receiver in 2025 certainly benefited from CeeDee Lamb missing time (24% target share, or 8.8 per game, and 24.2 fantasy PPG in four games Lamb was injured), but his \"with Lamb\" splits were also strong. Consider: In 12 full games with Lamb, Pickens handled a 23% target share (8.3 per game) and averaged 16.1 fantasy PPG, which would've ranked eighth at the position over the full season. The 25-year-old will play the same role in Dallas' high-scoring offense in 2026 and has the look of a strong fantasy WR2."},{"id":4361579,"name":"Javonte Williams","pos":"RB","nfl_team":"DAL","status":"ACTIVE","slot_id":2,"slot":"RB","owner_id":11,"eligible_slots":[2,3,23,7,20,21],"projection":15.57070424,"actual":null,"kickoff":"2026-09-14T00:20:00+00:00","opponent":"@ NYG","game_state":"pre","locked":false,"availability":"ONTEAM","week_outlook":[{"week":1,"projection":15.57070424,"opponent":"@ NYG","kickoff":"2026-09-14T00:20:00+00:00"},{"week":2,"projection":17.69841252,"opponent":"vs WSH","kickoff":"2026-09-20T20:25:00+00:00"},{"week":3,"projection":14.64897685,"opponent":"vs BAL","kickoff":"2026-09-27T20:25:00+00:00"}],"outlook":"Williams re-signed with the Cowboys following a successful first year with the team. After failing to produce a top-25 fantasy campaign during his final three seasons in Denver, Williams finished 12th in 2025, setting career-best marks in carries, rushing yards, touches (287), scrimmage yards (1,338) and yards per carry (4.77). He also scored a career-high 13 touchdowns after totaling 16 during his first four campaigns, and his 16 carries inside the 5-yard line were fifth most among backs. That helped offset his receiving struggles, as his 2.7 yards per target was last among qualified RBs. With minimal competition for touches in a high-scoring Dallas offense, the 26-year-old is a solid RB2 target."},{"id":4372016,"name":"Jaylen Waddle","pos":"WR","nfl_team":"DEN","status":"ACTIVE","slot_id":4,"slot":"WR","owner_id":11,"eligible_slots":[3,4,5,23,7,20,21],"projection":11.32505013,"actual":null,"kickoff":"2026-09-15T00:15:00+00:00","opponent":"@ KC","game_state":"pre","locked":false,"availability":"ONTEAM","week_outlook":[{"week":1,"projection":11.32505013,"opponent":"@ KC","kickoff":"2026-09-15T00:15:00+00:00"},{"week":2,"projection":12.06275008,"opponent":"vs JAX","kickoff":"2026-09-20T20:05:00+00:00"},{"week":3,"projection":11.14158039,"opponent":"vs LAR","kickoff":"2026-09-28T00:20:00+00:00"}],"outlook":"Waddle was traded to Denver after spending his first five seasons in Miami. The 2021 first-round pick was solid during his Dolphins tenure, finishing in the top 30 among receivers in fantasy PPG four times, though never reaching the top 10 while often playing second fiddle to Tyreek Hill. Although he has been a reliable target and has missed only seven games in five years, Waddle hasn't finished a season higher than 20th in targets or catches since 2021. In Denver, the 27-year-old Waddle will compete with Courtland Sutton for the team lead in targets in a scheme that likes to spread the ball around. Not utilized near the goal line much at 5-foot-10 and 180 pounds (he's yet to clear seven end zone targets in a season), Waddle is likely to max out as a back-end WR2 in Denver."},{"id":4431452,"name":"Drake Maye","pos":"QB","nfl_team":"NE","status":"ACTIVE","slot_id":0,"slot":"QB","owner_id":11,"eligible_slots":[0,7,20,21],"projection":17.77531114,"actual":11.97,"kickoff":"2026-09-10T00:20:00+00:00","opponent":"@ SEA","game_state":"post","locked":true,"availability":"ONTEAM","week_outlook":[{"week":1,"projection":17.77531114,"opponent":"@ SEA","kickoff":"2026-09-10T00:20:00+00:00"},{"week":2,"projection":18.94757603,"opponent":"vs PIT","kickoff":"2026-09-20T17:00:00+00:00"},{"week":3,"projection":20.34032687,"opponent":"@ JAX","kickoff":"2026-09-27T17:00:00+00:00"}],"outlook":"Maye is entering his third NFL season and second full season as New England's starter. The 2024 No. 3 draft pick is fresh off a breakout 2025 campaign in which he finished in the top five among quarterbacks in pass completions, yards and TDs, as well as rush attempts and yards. Maye, who led the league in completion percentage (72%) and yards per attempt (8.9), trailed only Josh Allen in fantasy points (351.9), fantasy points per game (20.7) and top-10 fantasy weeks (10). The NFL MVP runner-up will need to overcome a tougher schedule, but he has a better supporting cast (including A.J. Brown) and the 24-year-old's combination of passing talent and rushing ability have him well positioned for another top-five fantasy campaign."},{"id":4248528,"name":"Christian Watson","pos":"WR","nfl_team":"GB","status":"ACTIVE","slot_id":23,"slot":"FLEX","owner_id":11,"eligible_slots":[3,4,5,23,7,20,21],"projection":10.45025487,"actual":null,"kickoff":"2026-09-13T20:25:00+00:00","opponent":"@ MIN","game_state":"pre","locked":false,"availability":"ONTEAM","week_outlook":[{"week":1,"projection":10.45025487,"opponent":"@ MIN","kickoff":"2026-09-13T20:25:00+00:00"},{"week":2,"projection":10.57048269,"opponent":"@ NYJ","kickoff":"2026-09-20T17:00:00+00:00"},{"week":3,"projection":11.13167341,"opponent":"vs ATL","kickoff":"2026-09-25T00:15:00+00:00"}],"outlook":"Watson has had quite the boom/bust NFL career and that was on full display in 2025. After missing the first seven games due to injury, Watson returned and scored 18-plus fantasy points four times, but averaged 7.7 in his other six outings. The oft-injured 2022 second-round pick has still yet to play a full regular season, but has weirdly finished with between 611 and 620 receiving yards in three of his four campaigns. Though Watson has yet to deliver a top-40 fantasy season, he's been extremely efficient in his vertical role, ranking exactly second in average depth of target, YPR and YPT each of the last two seasons. Durability is an obvious concern, but the 27-year-old could very well lead Green Bay in targets following Romeo Doubs' departure. Watson should be valued as a volatile flex option with added value in non-PPR leagues."},{"id":4430027,"name":"Sam LaPorta","pos":"TE","nfl_team":"DET","status":"ACTIVE","slot_id":6,"slot":"TE","owner_id":11,"eligible_slots":[5,6,23,7,20,21],"projection":9.87660556,"actual":null,"kickoff":"2026-09-13T17:00:00+00:00","opponent":"vs NO","game_state":"pre","locked":false,"availability":"ONTEAM","week_outlook":[{"week":1,"projection":9.87660556,"opponent":"vs NO","kickoff":"2026-09-13T17:00:00+00:00"},{"week":2,"projection":10.46600451,"opponent":"@ BUF","kickoff":"2026-09-18T00:15:00+00:00"},{"week":3,"projection":9.86652648,"opponent":"vs NYJ","kickoff":"2026-09-27T17:00:00+00:00"}],"outlook":"LaPorta has settled in as one of the league's top tight ends, but the 2023 second-round pick simply hasn't been able to match the fantasy success he enjoyed as a rookie. Since posting an 86-889-10 receiving line in 17 games that first season, LaPorta has totaled a 100-1,215-10 line in 25 games over the past two seasons. LaPorta's 2025 campaign was cut short by a back injury, otherwise he was well on his way to his third straight top-10 fantasy campaign (he finished seventh in PPG). The 25-year-old joins Amon-Ra St. Brown, Jameson Williams and Jahmyr Gibbs as the clear \"Core Four\" targets in a good, pass-friendly Detroit offense, and is thus a solid fantasy TE1."},{"id":4360078,"name":"Alec Pierce","pos":"WR","nfl_team":"IND","status":"QUESTIONABLE","slot_id":20,"slot":"Bench","owner_id":11,"eligible_slots":[3,4,5,23,7,20,21],"projection":9.19314698,"actual":null,"kickoff":"2026-09-13T17:00:00+00:00","opponent":"vs BAL","game_state":"pre","locked":false,"availability":"ONTEAM","week_outlook":[{"week":1,"projection":9.19314698,"opponent":"vs BAL","kickoff":"2026-09-13T17:00:00+00:00"},{"week":2,"projection":10.20396855,"opponent":"@ KC","kickoff":"2026-09-21T00:20:00+00:00"},{"week":3,"projection":9.82385915,"opponent":"vs HOU","kickoff":"2026-09-27T17:00:00+00:00"}],"outlook":"Pierce has spent the majority of his first four NFL seasons as a situational deep threat, but that didn't stop him from becoming one of the league's highest-paid wide receivers during the offseason. The 2022 second-round pick is fresh off a career year and he's now paced all receivers in YPR, YPT and aDOT each of the last two seasons. However, he's yet to finish a season better than 48th at WR in target share (18%), 42nd in targets (84), 45th in catches (47), 18th in yards (1,003), 18th in TDs (seven) or 25th in fantasy PPG. Of course, with Michael Pittman Jr. no longer in the mix, Pierce is a good bet for a more well-rounded role as Daniel Jones' top target. There's some risk here, but the 26-year-old's hefty contract suggests we should take him seriously as a fantasy WR3."},{"id":-16014,"name":"Rams D/ST","pos":"DST","nfl_team":"LAR","status":"ACTIVE","slot_id":16,"slot":"DST","owner_id":11,"eligible_slots":[16,20,21],"projection":6.11892266,"actual":null,"kickoff":"2026-09-11T00:35:00+00:00","opponent":"vs SF","game_state":"pre","locked":false,"availability":"ONTEAM","week_outlook":[{"week":1,"projection":6.11892266,"opponent":"vs SF","kickoff":"2026-09-11T00:35:00+00:00"},{"week":2,"projection":7.21712902,"opponent":"vs NYG","kickoff":"2026-09-22T00:15:00+00:00"},{"week":3,"projection":6.00937108,"opponent":"@ DEN","kickoff":"2026-09-28T00:20:00+00:00"}],"outlook":"This already highly regarded defense only got stronger in June with the acquisition of two-time Defensive Player of the Year (2023, 2025) Myles Garrett. He wasn't their only addition, as CBs Trent McDuffie and Jaylen Watson were brought in from the Chiefs. Expect another productive season from this unit, though it does face one of the tougher early-season schedules, with the 49ers (Week 1), Broncos (3), Eagles (4) and Bills (5) among their first five opponents. The Rams' second-half schedule is one of the easiest, meaning they might be a better in-season trade target than a draft-day pickup."},{"id":3916433,"name":"Jakobi Meyers","pos":"WR","nfl_team":"JAX","status":"QUESTIONABLE","slot_id":20,"slot":"Bench","owner_id":11,"eligible_slots":[3,4,5,23,7,20,21],"projection":9.58191528,"actual":null,"kickoff":"2026-09-13T17:00:00+00:00","opponent":"vs CLE","game_state":"pre","locked":false,"availability":"ONTEAM","week_outlook":[{"week":1,"projection":9.58191528,"opponent":"vs CLE","kickoff":"2026-09-13T17:00:00+00:00"},{"week":2,"projection":9.10974348,"opponent":"@ DEN","kickoff":"2026-09-20T20:05:00+00:00"},{"week":3,"projection":9.81772279,"opponent":"vs NE","kickoff":"2026-09-27T17:00:00+00:00"}],"outlook":"One of the league's most underrated players, Meyers is entering his first full season with Jacksonville after being acquired via trade in November. The 2019 UDFA has produced 800-plus receiving yards in five consecutive seasons while operating primarily as a short-to-intermediate target. More of a solid producer than a high-ceiling contributor, Meyers has finished no lower than 32nd in fantasy points over the last five seasons, but has yet to do better than 19th. The 29-year-old isn't much of a touchdown scorer (23 TDs in 78 games since 2021) and has substantial target competition via Parker Washington, Brian Thomas Jr., Brenton Strange and Travis Hunter. Meyers is a good player, but is likely to cap out as a flex option."},{"id":3042519,"name":"Aaron Jones Sr.","pos":"RB","nfl_team":"MIN","status":"ACTIVE","slot_id":20,"slot":"Bench","owner_id":11,"eligible_slots":[2,3,23,7,20,21],"projection":10.00879851,"actual":null,"kickoff":"2026-09-13T20:25:00+00:00","opponent":"vs GB","game_state":"pre","locked":false,"availability":"ONTEAM","week_outlook":[{"week":1,"projection":10.00879851,"opponent":"vs GB","kickoff":"2026-09-13T20:25:00+00:00"},{"week":2,"projection":10.25444189,"opponent":"@ CHI","kickoff":"2026-09-20T17:00:00+00:00"},{"week":3,"projection":9.67540425,"opponent":"@ TB","kickoff":"2026-09-27T20:05:00+00:00"}],"outlook":"Jones is back for a third season in Minnesota after an injury-plagued 2025 campaign limited him to 747 yards (his fewest since his rookie season in 2017) and three touchdowns in 12 games. Jones remained fairly busy (11.0 carries and 3.4 targets per game) but didn't perform well, ranking dead last among 65 backs with 50-plus carries in forced missed tackle rate and elusive rating, per PFF. Jones failed to record a single top-10 fantasy outing. Now 31 years old, Jones remains a starter and will get some run, but he's well past his prime and unlikely to return to consistent fantasy output. Jones is best valued as a bench player with occasional flex appeal."},{"id":4695883,"name":"Jalen Coker","pos":"WR","nfl_team":"CAR","status":"ACTIVE","slot_id":20,"slot":"Bench","owner_id":11,"eligible_slots":[3,4,5,23,7,20,21],"projection":8.39427185,"actual":null,"kickoff":"2026-09-13T17:00:00+00:00","opponent":"vs CHI","game_state":"pre","locked":false,"availability":"ONTEAM","week_outlook":[{"week":1,"projection":8.39427185,"opponent":"vs CHI","kickoff":"2026-09-13T17:00:00+00:00"},{"week":2,"projection":8.23474038,"opponent":"@ ATL","kickoff":"2026-09-20T17:00:00+00:00"},{"week":3,"projection":7.44382899,"opponent":"@ CLE","kickoff":"2026-09-27T17:00:00+00:00"}],"outlook":"After missing nearly the entire first half of 2025, Coker passed Xavier Legette and took on a larger offensive role opposite Tetairoa McMillan. From Week 8 onward (11 games, including the playoffs), Coker played 73% of the snaps and handled a 17.8% target share. The fantasy output was inconsistent (below 11.5 points in seven games), but he peaked down the stretch (more than 14 points in four of his final six, including a 9-134-1 showing against the Rams in the playoffs). Coker's strong finish is encouraging, though his rookie season went similarly (14-plus points three times, but under 11 in the other nine games). A healthy 2026 could get Coker to the next level, but flex production is his likely ceiling as long as McMillan is commanding one-quarter (if not more) of the targets in Carolina's Bryce Young-led offense."},{"id":4686361,"name":"Cam Little","pos":"K","nfl_team":"JAX","status":"ACTIVE","slot_id":17,"slot":"K","owner_id":11,"eligible_slots":[17,20,21],"projection":8.22043022,"actual":null,"kickoff":"2026-09-13T17:00:00+00:00","opponent":"vs CLE","game_state":"pre","locked":false,"availability":"ONTEAM","week_outlook":[{"week":1,"projection":8.22043022,"opponent":"vs CLE","kickoff":"2026-09-13T17:00:00+00:00"},{"week":2,"projection":7.49851679,"opponent":"@ DEN","kickoff":"2026-09-20T20:05:00+00:00"},{"week":3,"projection":8.21041419,"opponent":"vs NE","kickoff":"2026-09-27T17:00:00+00:00"}],"outlook":""},{"id":4686658,"name":"Mike Washington Jr.","pos":"RB","nfl_team":"LV","status":"ACTIVE","slot_id":20,"slot":"Bench","owner_id":11,"eligible_slots":[25,2,3,23,7,20,21],"projection":7.24352064,"actual":null,"kickoff":"2026-09-13T20:25:00+00:00","opponent":"vs MIA","game_state":"pre","locked":false,"availability":"ONTEAM","week_outlook":[{"week":1,"projection":7.24352064,"opponent":"vs MIA","kickoff":"2026-09-13T20:25:00+00:00"},{"week":2,"projection":4.01889415,"opponent":"@ LAC","kickoff":"2026-09-20T20:05:00+00:00"},{"week":3,"projection":4.22346076,"opponent":"@ NO","kickoff":"2026-09-27T20:25:00+00:00"}],"outlook":"Washington was selected by the Raiders in the fourth round of April's draft. He's a big back with terrific speed who lit up the combine with a 4.33 40-yard dash at 6-foot-1, 223 pounds (127 speed score), while also checking in with the longest arms in this rookie RB class. His collegiate efficiency wasn't very good during stops in Buffalo and New Mexico State, but it was better in 2025 -- his lone season at Arkansas -- as he averaged 6.41 yards per carry and 3.62 yards after contact, both of which rank seventh or better in this RB class. He might not be much of an option in the passing game, as his career 4.2 yards per target is the worst in this RB class, but his traits make him an intriguing prospect. Washington will open his career as a clear No. 2 option behind Ashton Jeanty, which makes him an intriguing end-of-bench insurance stash."}],"submitted":{"assignments":[{"slot_id":2,"slot":"RB","player_id":4430807},{"slot_id":4,"slot":"WR","player_id":4426354},{"slot_id":2,"slot":"RB","player_id":4361579},{"slot_id":4,"slot":"WR","player_id":4372016},{"slot_id":0,"slot":"QB","player_id":4431452},{"slot_id":23,"slot":"FLEX","player_id":4248528},{"slot_id":6,"slot":"TE","player_id":4430027},{"slot_id":16,"slot":"DST","player_id":-16014},{"slot_id":17,"slot":"K","player_id":4686361}],"projection":112.24,"actual":11.97,"remaining_projection":94.46,"in_progress":false,"complete":true,"note":"ESPN projection baseline in league scoring; not independently researched. No win probability."},"recommended":{"assignments":[{"slot_id":0,"slot":"QB","player_id":4431452},{"slot_id":2,"slot":"RB","player_id":4430807},{"slot_id":2,"slot":"RB","player_id":4361579},{"slot_id":4,"slot":"WR","player_id":4426354},{"slot_id":4,"slot":"WR","player_id":4248528},{"slot_id":6,"slot":"TE","player_id":4430027},{"slot_id":23,"slot":"FLEX","player_id":4372016},{"slot_id":17,"slot":"K","player_id":4686361},{"slot_id":16,"slot":"DST","player_id":-16014}],"projection":112.24,"actual":11.97,"remaining_projection":94.46,"in_progress":false,"complete":true,"note":"ESPN projection baseline in league scoring; not independently researched. No win probability."}},{"id":12,"name":"Casta","espn_name":"Castelani's Cool Team","manager":"Casta","abbrev":"CCT","waiver_priority":9,"roster":[{"id":4426515,"name":"Puka Nacua","pos":"WR","nfl_team":"LAR","status":"ACTIVE","slot_id":4,"slot":"WR","owner_id":12,"eligible_slots":[3,4,5,23,7,20,21],"projection":19.68949573,"actual":null,"kickoff":"2026-09-11T00:35:00+00:00","opponent":"vs SF","game_state":"pre","locked":false,"availability":"ONTEAM","week_outlook":[{"week":1,"projection":19.68949573,"opponent":"vs SF","kickoff":"2026-09-11T00:35:00+00:00"},{"week":2,"projection":19.58074447,"opponent":"vs NYG","kickoff":"2026-09-22T00:15:00+00:00"},{"week":3,"projection":18.11446543,"opponent":"@ DEN","kickoff":"2026-09-28T00:20:00+00:00"}],"outlook":"Nacua has defied the odds, emerging from fifth-round flier in 2023 to one of the most relied upon and productive offensive players in the league. Nacua has finished each of his three pro seasons sixth or better among receivers in fantasy PPG and peaked with a first-place finish last season. Matthew Stafford's top target led the league with 129 receptions and finished no lower than third among receivers in targets, yardage and touchdowns, while also adding 105 yards and one score as a rusher. More goal-line work would be nice (he has 11 end zone targets over the past two seasons), but Nacua's heavy usage in an elite offense locks in the 25-year-old as arguably the top receiver in fantasy."},{"id":4258173,"name":"Nico Collins","pos":"WR","nfl_team":"HOU","status":"ACTIVE","slot_id":4,"slot":"WR","owner_id":12,"eligible_slots":[3,4,5,23,7,20,21],"projection":14.67514192,"actual":null,"kickoff":"2026-09-13T17:00:00+00:00","opponent":"vs BUF","game_state":"pre","locked":false,"availability":"ONTEAM","week_outlook":[{"week":1,"projection":14.67514192,"opponent":"vs BUF","kickoff":"2026-09-13T17:00:00+00:00"},{"week":2,"projection":14.37699626,"opponent":"vs CIN","kickoff":"2026-09-20T17:00:00+00:00"},{"week":3,"projection":13.74807799,"opponent":"@ IND","kickoff":"2026-09-27T17:00:00+00:00"}],"outlook":"Collins heads into his sixth NFL campaign yet to play a full 17-game season, but having been very productive when on the field. The 2021 third-round pick has cleared 1,000 yards and scored either seven or eight touchdowns each of the past three seasons, finishing in the top 10 in fantasy PPG and top 12 in yards per route run in all three. A force near the goal line, Collins ranked fourth among receivers with 13 end zone targets in 2025. The 27-year-old's target share doesn't stack up with other top receivers (he has never cleared 24.4%), but his high-end efficiency is just enough to keep him in the back-end WR1 mix."},{"id":4361307,"name":"Trey McBride","pos":"TE","nfl_team":"ARI","status":"ACTIVE","slot_id":6,"slot":"TE","owner_id":12,"eligible_slots":[5,6,23,7,20,21],"projection":12.70658594,"actual":null,"kickoff":"2026-09-13T20:25:00+00:00","opponent":"@ LAC","game_state":"pre","locked":false,"availability":"ONTEAM","week_outlook":[{"week":1,"projection":12.70658594,"opponent":"@ LAC","kickoff":"2026-09-13T20:25:00+00:00"},{"week":2,"projection":12.09690823,"opponent":"vs SEA","kickoff":"2026-09-20T20:25:00+00:00"},{"week":3,"projection":12.9184274,"opponent":"@ SF","kickoff":"2026-09-27T20:05:00+00:00"}],"outlook":"McBride has emerged as one of the league's top pass catchers -- not just tight ends -- as he trails only Ja'Marr Chase in targets (317) and receptions (252) over the past two seasons and is sixth in receiving yards (2,385). McBride led the tight end position in every fantasy-relevant counting stat in 2025, and his league-high 15 top-12 fantasy weeks were six more than any other player at the position. He finished third in the NFL with 17 end zone targets. McBride really thrived when Jacoby Brissett (21.1 PPG) replaced Kyler Murray (12.5) under center, which only adds to his 2026 appeal. The 26-year-old should be on your radar at the first-/second-round turn."},{"id":4035538,"name":"David Montgomery","pos":"RB","nfl_team":"HOU","status":"ACTIVE","slot_id":2,"slot":"RB","owner_id":12,"eligible_slots":[2,3,23,7,20,21],"projection":12.93022493,"actual":null,"kickoff":"2026-09-13T17:00:00+00:00","opponent":"vs BUF","game_s 't a factor as a receiver, however, totaling 15 receptions in 41 games. Price has a path to an immediate feature role in Seattle's run-first offense, though he may eventually defer substantial work to Zach Charbonnet (ACL recovery). Value Price as a flex, though he should land on the weekly RB2 radar while Charbonnet is sidelined."},{"id":4431611,"name":"Caleb Williams","pos":"QB","nfl_team":"CHI","status":"ACTIVE","slot_id":0,"slot":"QB","owner_id":12,"eligible_slots":[0,7,20,21],"projection":17.70639719,"actual":null,"kickoff":"2026-09-13T17:00:00+00:00","opponent":"@ CAR","game_state":"pre","locked":false,"availability":"ONTEAM","week_outlook":[{"week":1,"projection":17.70639719,"opponent":"@ CAR","kickoff":"2026-09-13T17:00:00+00:00"},{"week":2,"projection":18.03448378,"opponent":"vs MIN","kickoff":"2026-09-20T17:00:00+00:00"},{"week":3,"projection":16.88070597,"opponent":"vs PHI","kickoff":"2026-09-29T00:15:00+00:00"}],"outlook":"Williams enters his third NFL season after a solid rookie campaign in 2024 followed by a big leap forward in 2025. Williams finished last season no lower than 11th among QBs in pass attempts, completions, pass yards, passing TDs, carries, rush yards, rush TDs and fantasy points per game. While Williams' completion percentage was one of the worst in the league (58%), his dual-threat ability and turnover avoidance (seven INTs both seasons) has led to solid fantasy output. The 2024 No. 1 draft pick has a good supporting cast in playcaller Ben Johnson and a trio of young pass catchers in Rome Odunze, Luther Burden III and Colston Loveland. Williams is a fringe QB1 with upside for another leap."},{"id":3953687,"name":"Brandon Aubrey","pos":"K","nfl_team":"DAL","status":"ACTIVE","slot_id":17,"slot":"K","owner_id":12,"eligible_slots":[17,20,21],"projection":9.25290708,"actual":null,"kickoff":"2026-09-14T00:20:00+00:00","opponent":"@ NYG","game_state":"pre","locked":false,"availability":"ONTEAM","week_outlook":[{"week":1,"projection":9.2529070 e Jonah Coleman could factor in eventually as well. Harvey, 25, has a slight bit of breakout potential, but the committee setup suggests he's safest viewed as no more than a flex."},{"id":3929645,"name":"Juwan Johnson","pos":"TE","nfl_team":"NO","status":"ACTIVE","slot_id":20,"slot":"Bench","owner_id":12,"eligible_slots":[5,6,23,7,20,21],"projection":7.80883516,"actual":null,"kickoff":"2026-09-13T17:00:00+00:00","opponent":"@ DET","game_state":"pre","locked":false,"availability":"ONTEAM","week_outlook":[{"week":1,"projection":7.80883516,"opponent":"@ DET","kickoff":"2026-09-13T17:00:00+00:00"},{"week":2,"projection":7.65178769,"opponent":"@ BAL","kickoff":"2026-09-20T17:00:00+00:00"},{"week":3,"projection":8.38512397,"opponent":"vs LV","kickoff":"2026-09-27T20:25:00+00:00"}],"outlook":"Johnson's impressive progression continued in 2025, as the converted wide receiver posted career-high marks in targets, catches, yardage and fantasy points (all four were eighth or better among tight ends). Johnson produced nine top-12 fantasy weeks, which tied for second at the position. He has finished in the top 12 in aDOT each of the past four seasons but hasn't been much of an option near the goal line (no more than four TDs or end zone targets in each of the past three seasons). The 29-year-old has added target competition, including eighth-overall pick Jordyn Tyson (once healthy), but he very well could settle in as high as third in target priority in the Saints' Tyler Shough-led offense. Johnson is a fine TE2."},{"id":3126486,"name":"Deebo Samuel Sr.","pos":"WR","nfl_team":"SF","status":"ACTIVE","slot_id":20,"slot":"Bench","owner_id":12,"eligible_slots":[3,4,5,23,7,20,21],"projection":8.35155816,"actual":null,"kickoff":"2026-09-11T00:35:00+00:00","opponent":"@ LAR","game_state":"pre","locked":false,"availability":"ONTEAM","week_outlook":[{"week":1,"projection":8.35155816,"opponent":"@ LAR","kickoff":"2026-09-11T00:35:00+00:00"},{"week":2,"projection":9.5971041,"opponent":"vs M
