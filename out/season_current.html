,"projection":16.5404627,"opponent":"@ LV","kickoff":"2026-09-13T20:25:00+00:00"},{"week":2,"projection":15.26741903,"opponent":"@ SF","kickoff":"2026-09-20T20:25:00+00:00"},{"week":3,"projection":15.13505678,"opponent":"vs KC","kickoff":"2026-09-27T17:00:00+00:00"}],"outlook":"Willis signed with Miami during the offseason and is set to start after two successful seasons backing up Jordan Love in Green Bay. Willis, a 2022 third-round pick, has very little experience (155 career pass attempts), but he was outstanding in limited work the past two seasons, completing 70 of 89 passes for 972 yards, six TDs and zero INTs (12.1 yards per attempt, 86% completion rate), while also adding major value with his legs (42-261-3) during the span. Willis played at least 80% of the snaps in three games with Green Bay and averaged 23.3 fantasy points in those outings. Willis' inexperience makes him risky and the Miami supporting cast is perhaps the worst in the NFL, but his dual-threat ability makes him a very fascinating late-round flier."},{"id":3917792,"name":"Daniel Jones","pos":"QB","nfl_team":"IND","status":"ACTIVE","slot_id":20,"slot":"Bench","owner_id":0,"eligible_slots":[0,7,20,21],"projection":16.53113585,"actual":null,"kickoff":"2026-09-13T17:00:00+00:00","opponent":"vs BAL","game_state":"pre","locked":false,"availability":"FREEAGENT","week_outlook":[{"week":1,"projection":16.53113585,"opponent":"vs BAL","kickoff":"2026-09-13T17:00:00+00:00"},{"week":2,"projection":16.14200522,"opponent":"@ KC","kickoff":"2026-09-21T00:20:00+00:00"},{"week":3,"projection":15.47203315,"opponent":"vs HOU","kickoff":"2026-09-27T17:00:00+00:00"}],"outlook":"Jones re-signed with the Colts during the offseason and will return as the team's starter. The 2019 No. 6 draft pick made a big leap in 2025 -- his first season with Indianapolis -- finishing no lower than seventh in completion percentage and yards per attempt. Despite the strong play, Jones was inconsistent as a fantasy option, averaging 18.8 fantasy points during 12 full games and posting three top-five weeks but no additional finishes better than ninth. Jones was effective through the air and scored five rushing TDs, but he didn't run the ball as much as in years past and might do even less of that in 2026 after tearing an Achilles in Week 14. He's likely to be ready for Week 1, but effectiveness is a concern, so he's best viewed as a midrange QB2."},{"id":8439,"name":"Aaron Rodgers","pos":"QB","nfl_team":"PIT","status":"ACTIVE","slot_id":20,"slot":"Bench","owner_id":0,"eligible_slots":[0,7,20,21],"projection":16.01764706,"actual":null,"kickoff":"2026-09-13T17:00:00+00:00","opponent":"vs ATL","game_state":"pre","locked":false,"availability":"FREEAGENT","week_outlook":[{"week":1,"projection":16.01764706,"opponent":"vs ATL","kickoff":"2026-09-13T17:00:00+00:00"},{"week":2,"projection":13.28461482,"opponent":"@ NE","kickoff":"2026-09-20T17:00:00+00:00"},{"week":3,"projection":15.80636497,"opponent":"vs CIN","kickoff":"2026-09-27T17:00:00+00:00"}],"outlook":"Rodgers re-signed with the Steelers and will return for his second season with the team. The 42-year-old is reuniting with his longtime head coach from Green Bay, Mike McCarthy. The duo will look to improve on a 2025 campaign in which Rodgers finished just outside the top 12 in passing yards and touchdowns while ranking 23rd among 28 qualified QBs in QBR. Even if Rodgers' efficiency improves, he remains a nonfactor as a rusher (he last cleared 107 yards in 2020) and hasn't been fantasy relevant since 2021 (25th, 18th and 25th in points per game in his past three full seasons). Even with a more pass-friendly playcaller and with Michael Pittman Jr. and Germie Bernard added to the wide receiver room, Rodgers is no more than a low-ceiling QB2."},{"id":14880,"name":"Kirk Cousins","pos":"QB","nfl_team":"LV","status":"ACTIVE","slot_id":20,"slot":"Bench","owner_id":0,"eligible_slots":[0,7,20,21],"projection":15.97550829,"actual":null,"kickoff":"2026-09-13T20:25:00+00:00","opponent":"vs MIA","game_state":"pre","locked":false,"availability":"FREEAGENT","week_outlook":[{"week":1,"projection":15.97550829,"opponent":"vs MIA","kickoff":"2026-09-13T20:25:00+00:00"},{"week":2,"projection":13.04170852,"opponent":"@ LAC","kickoff":"2026-09-20T20:05:00+00:00"},{"week":3,"projection":13.38353726,"opponent":"@ NO","kickoff":"2026-09-27T20:25:00+00:00"}],"outlook":"Cousins signed with the Raiders and will work as the team's starter to open the 2026 season ahead of No. 1 overall draft selection Fernando Mendoza. Cousins made eight starts for Atlanta last season and was not much of a fantasy option, averaging 12.5 fantasy points per game while reaching 18 points only once. The 38-year-old will be a bridge starter at best until Mendoza is ready and is no longer a threat with his legs (7 yards on 14 carries last season). He won't be a fantasy option, even when on the field. He should only be drafted late in superflex leagues."},{"id":3912547,"name":"Sam Darnold","pos":"QB","nfl_team":"SEA","status":"DOUBTFUL","slot_id":20,"slot":"Bench","owner_id":0,"eligible_slots":[0,7,20,21],"projection":15.261833,"actual":0.62,"kickoff":"2026-09-10T00:20:00+00:00","opponent":"vs NE","game_state":"post","locked":false,"availability":"WAIVERS","week_outlook":[{"week":1,"projection":15.261833,"opponent":"vs NE","kickoff":"2026-09-10T00:20:00+00:00"},{"week":2,"projection":16.5849462,"opponent":"@ ARI","kickoff":"2026-09-20T20:25:00+00:00"},{"week":3,"projection":16.77348622,"opponent":"@ WSH","kickoff":"2026-09-27T17:00:00+00:00"}],"outlook":"Darnold's first season with the Super Bowl champion Seahawks couldn't have gone much better from a real-life standpoint, but it simply didn't translate to much fantasy success. Despite finishing fifth in the NFL in passing yards for the second season in a row, Darnold finished 27th in fantasy points per game. He was very boom or bust, delivering seven top-10 weeks but also nine finishes outside the top 20. Turnovers (15 INTs were second most in the NFL) and a lack of rushing were the culprits. The 29-year-old will have a new playcaller in Brian Fleury, but otherwise it's roughly the status quo offensively. Darnold is no more than a fringe QB2 with a limited ceiling."},{"id":15864,"name":"Geno Smith","pos":"QB","nfl_team":"NYJ","status":"ACTIVE","slot_id":20,"slot":"Bench","owner_id":0,"eligible_slots":[0,7,20,21],"projection":15.09664062,"actual":null,"kickoff":"2026-09-13T17:00:00+00:00","opponent":"@ TEN","game_state":"pre","locked":false,"availability":"FREEAGENT","week_outlook":[{"week":1,"projection":15.09664062,"opponent":"@ TEN","kickoff":"2026-09-13T17:00:00+00:00"},{"week":2,"projection":14.86378751,"opponent":"vs GB","kickoff":"2026-09-20T17:00:00+00:00"},{"week":3,"projection":13.6943247,"opponent":"@ DET","kickoff":"2026-09-27T17:00:00+00:00"}],"outlook":"Smith was traded to the Jets following an unsuccessful one-year stint in Las Vegas. Smith, who began his career as a second-round pick with the Jets in 2013, is in line to start, though he's a long shot for consistent fantasy production. Smith peaked with a ninth-place finish in fantasy points per game with Seattle in 2022, but he has finished no better than 16th over the past three seasons. He paced the NFL in both interceptions and sacks in 2025 after finishing third in both categories in 2024 and is no longer much of a factor with his legs. The 35-year-old might bring some stability to the fantasy outlook of the team's pass catchers, but we shouldn't expect much more than that. Consider Smith only in superflex formats."},{"id":4688380,"name":"Cam Ward","pos":"QB","nfl_team":"TEN","status":"ACTIVE","slot_id":20,"slot":"Bench","owner_id":0,"eligible_slots":[0,7,20,21],"projection":14.86732941,"actual":null,"kickoff":"2026-09-13T17:00:00+00:00","opponent":"vs NYJ","game_state":"pre","locked":false,"availability":"FREEAGENT","week_outlook":[{"week":1,"projection":14.86732941,"opponent":"vs NYJ","kickoff":"2026-09-13T17:00:00+00:00"},{"week":2,"projection":13.328999,"opponent":"vs PHI","kickoff":"2026-09-20T17:00:00+00:00"},{"week":3,"projection":14.12189395,"opponent":"@ NYG","kickoff":"2026-09-27T17:00:00+00:00"}],"outlook":"Ward is eyeing a Year 2 leap following an underwhelming rookie campaign, albeit under tough circumstances. The 2025 No. 1 draft pick was plenty busy as a rookie (eighth in the league in dropbacks and pass attempts), but he struggled to 5.9 yards per attempt and took a league-high 55 sacks. Ward was rarely a factor with his legs (more than 12 yards three times) and produced one weekly fantasy finish better than 12th. The good news is that a tough rookie year isn't overly damning for a quarterback's career trajectory, and he'll be in a better spot in 2026 with new playcaller Brian Daboll and an improved supporting cast (Carnell Tate and Wan'Dale Robinson join a now-healthy Calvin Ridley). Ward will need to run more to become an elite fantasy option, but Year 2 is the breakout season for many quarterbacks, so he's well worth a late flier."},{"id":2578570,"name":"Jacoby Brissett","pos":"QB","nfl_team":"ARI","status":"ACTIVE","slot_id":20,"slot":"Bench","owner_id":0,"eligible_slots":[0,7,20,21],"projection":14.48971274,"actual":null,"kickoff":"2026-09-13T20:25:00+00:00","opponent":"@ LAC","game_state":"pre","locked":false,"availability":"FREEAGENT","week_outlook":[{"week":1,"projection":14.48971274,"opponent":"@ LAC","kickoff":"2026-09-13T20:25:00+00:00"},{"week":2,"projection":13.55129692,"opponent":"vs SEA","kickoff":"2026-09-20T20:25:00+00:00"},{"week":3,"projection":15.04537735,"opponent":"@ SF","kickoff":"2026-09-27T20:05:00+00:00"}],"outlook":"Brissett is back for his second season in Arizona and is currently positioned as the team's probable Week 1 starter. One of the biggest fantasy surprises of 2025, Brissett reeled off nine consecutive top-12 fantasy outings spanning Weeks 6 to 15. He averaged 18.9 fantasy points across 12 starts, which was a big surprise considering his prior career high was 12.9, and that was way back in 2017. Brissett played solid ball, but he's not a major contributor with his legs (260 yards is his career high for a season). He certainly benefited from the league's pass-heaviest offense, a luxury he's unlikely to have with Mike LaFleur now calling plays. Expect the 33-year-old to regress to fringe QB2 production, and keep in mind that it's possible Arizona will turn to rookie Carson Beck at some point this season."},{"id":3122840,"name":"Deshaun Watson","pos":"QB","nfl_team":"CLE","status":"ACTIVE","slot_id":20,"slot":"Bench","owner_id":0,"eligible_slots":[0,7,20,21],"projection":13.89713042,"actual":null,"kickoff":"2026-09-13T17:00:00+00:00","opponent":"@ JAX","game_state":"pre","locked":false,"availability":"FREEAGENT","week_outlook":[{"week":1,"projection":13.89713042,"opponent":"@ JAX","kickoff":"2026-09-13T17:00:00+00:00"},{"week":2,"projection":13.11005952,"opponent":"@ TB","kickoff":"2026-09-20T17:00:00+00:00"},{"week":3,"projection":14.37919088,"opponent":"vs CAR","kickoff":"2026-09-27T17:00:00+00:00"}],"outlook":"Watson will return to the field this season after a disastrous four years in Cleveland. A top-six fantasy QB (points per game) during each of his first four NFL seasons, Watson has appeared in a total of 19 games since joining the Browns, averaging a poor 13.1 fantasy points during the span. A torn Achilles suffered in Week 7 of 2024 (followed by tearing it again less than three months later) cost Watson all of 2025. Now 30 years old, with a young, unproven supporting cast and having not been a factor since 2020, Watson will open the season as Cleveland's starter, but he's a long shot to return to fantasy relevance. He should be considered only in superflex formats."},{"id":4241479,"name":"Tua Tagovailoa","pos":"QB","nfl_team":"ATL","status":"QUESTIONABLE","slot_id":20,"slot":"Bench","owner_id":0,"eligible_slots":[0,7,20,21],"projection":11.93157021,"actual":null,"kickoff":"2026-09-13T17:00:00+00:00","opponent":"@ PIT","game_state":"pre","locked":false,"availability":"FREEAGENT","week_outlook":[{"week":1,"projection":11.93157021,"opponent":"@ PIT","kickoff":"2026-09-13T17:00:00+00:00"},{"week":2,"projection":14.18039337,"opponent":"vs CAR","kickoff":"2026-09-20T17:00:00+00:00"},{"week":3,"projection":13.11564147,"opponent":"@ GB","kickoff":"2026-09-25T00:15:00+00:00"}],"outlook":"Tagovailoa signed with Atlanta during the offseason after spending his first six seasons in Miami. The 2020 first-round pick showed signs of life a few years ago, which included a 4,624-yard, 29-TD season in 2023, but his production and efficiency have declined since. The final straw was a rough 2025 in which he threw 15 INTs (second most in the league) in just 14 games and was benched. Tagovailoa is a nonfactor with his legs (fewer than 75 yards in four straight seasons, with zero TDs during the span) and has, in turn, never finished better than 10th in fantasy points per game (he was 33rd in 2025). Even if Tagovailoa starts in Week 1, he's unlikely to be anything more than a fringe QB2 in fantasy and figures to eventually lose work to Michael Penix Jr. (recovering from a torn ACL). Tagovailoa is way off the fantasy radar."},{"id":4428718,"name":"Tre Tucker","pos":"WR","nfl_team":"LV","status":"ACTIVE","slot_id":20,"slot":"Bench","owner_id":0,"eligible_slots":[3,4,5,23,7,20,21],"projection":9.46820249,"actual":null,"kickoff":"2026-09-13T20:25:00+00:00","opponent":"vs MIA","game_state":"pre","locked":false,"availability":"WAIVERS","week_outlook":[{"week":1,"projection":9.46820249,"opponent":"vs MIA","kickoff":"2026-09-13T20:25:00+00:00"},{"week":2,"projection":7.86096498,"opponent":"@ LAC","kickoff":"2026-09-20T20:05:00+00:00"},{"week":3,"projection":7.91783201,"opponent":"@ NO","kickoff":"2026-09-27T20:25:00+00:00"}],"outlook":"A team's No. 1 wide receiver is often a household name, but that's certainly not the case for the underrated Tucker, Las Vegas' top wideout for most of the 2025 season. Tucker has finished in the top 10 among wide receivers in both snaps and routes each of the last two seasons and ranked just outside of the top 30 in targets, catches, yards and touchdowns in 2025. Tucker, who also contributes as rusher, has yet to deliver a top-35 fantasy campaign while working in the Raiders' struggling offenses and would need a terrific rookie season from Fernando Mendoza to get there in 2026. That's a long shot for the undersized receiver, so he's only worth a late flier."},{"id":4382466,"name":"Jalen Nailor","pos":"WR","nfl_team":"LV","status":"ACTIVE","slot_id":20,"slot":"Bench","owner_id":0,"eligible_slots":[3,4,5,23,7,20,21],"projection":8.55711691,"actual":null,"kickoff":"2026-09-13T20:25:00+00:00","opponent":"vs MIA","game_state":"pre","locked":false,"availability":"FREEAGENT","week_outlook":[{"week":1,"projection":8.55711691,"opponent":"vs MIA","kickoff":"2026-09-13T20:25:00+00:00"},{"week":2,"projection":7.0757171,"opponent":"@ LAC","kickoff":"2026-09-20T20:05:00+00:00"},{"week":3,"projection":7.09231248,"opponent":"@ NO","kickoff":"2026-09-27T20:25:00+00:00"}],"outlook":"Nailor signed with the Raiders and will battle the likes of Tre Tucker and second-year receivers Jack Bech and Dont'e Thornton Jr. for a starting gig in Las Vegas' new-look offense. Nailor was a rarely used commodity during his first four NFL seasons, all with the Vikings. The 2022 sixth-round pick totaled a 69-1,066-11 receiving line and never reached 30 catches or 450 yards in a single season. In fact, he's yet to clear six targets in a game. The 27-year-old very well could lock down a starting job in Las Vegas, but he's a long shot to make the big leap to consistent fantasy output in his fifth professional season. He's no more than a late-round wild card in deep leagues."},{"id":4569559,"name":"Devaughn Vele","pos":"WR","nfl_team":"NO","status":"ACTIVE","slot_id":20,"slot":"Bench","owner_id":0,"eligible_slots":[3,4,5,23,7,20,21],"projection":8.40182959,"actual":null,"kickoff":"2026-09-13T17:00:00+00:00","opponent":"@ DET","game_state":"pre","locked":false,"availability":"FREEAGENT","week_outlook":[{"week":1,"projection":8.40182959,"opponent":"@ DET","kickoff":"2026-09-13T17:00:00+00:00"},{"week":2,"projection":8.21621771,"opponent":"@ BAL","kickoff":"2026-09-20T17:00:00+00:00"},{"week":3,"projection":9.13447945,"opponent":"vs LV","kickoff":"2026-09-27T20:25:00+00:00"}],"outlook":"Vele is expected to open the season as New Orleans' No. 2 receiver behind Chris Olave until Jordyn Tyson returns from injury near midseason. Vele's first season with the Saints was marred with injuries. The 2024 seventh-round pick, who posted a 41-475-3 receiving line with Denver as a rookie, barely played throughout most of 2025 prior to taking on an every-down role during Weeks 10-15. In those five games (one of which he left hurt), he averaged 5.6 targets per game, but reached 12.0 fantasy points once (an 8-93-1 effort in Week 13 against Miami). The 28-year-old has yet to show he can be relied on for consistent targets and fantasy production, but he'll play an every-down role early on, which makes him a sleeper for flex value in deep leagues. He'll be worth a roster spot until Tyson returns."},{"id":4429022,"name":"Kayshon Boutte","pos":"WR","nfl_team":"HOU","status":"ACTIVE","slot_id":20,"slot":"Bench","owner_id":0,"eligible_slots":[3,4,5,23,7,20,21],"projection":8.1428567,"actual":null,"kickoff":"2026-09-13T17:00:00+00:00","opponent":"vs BUF","game_state":"pre","locked":false,"availability":"FREEAGENT","week_outlook":[{"week":1,"projection":8.1428567,"opponent":"vs BUF","kickoff":"2026-09-13T17:00:00+00:00"},{"week":2,"projection":7.96865617,"opponent":"vs CIN","kickoff":"2026-09-20T17:00:00+00:00"},{"week":3,"projection":7.60171604,"opponent":"@ IND","kickoff":"2026-09-27T17:00:00+00:00"}],"outlook":"Boutte was traded to the Texans in August. Reportedly a cut/trade candidate throughout most of the 2025 offseason, Boutte went on to lead the AFC champion Patriots' wide receiver room in routes and touchdowns while playing 67% of the offensive snaps when active. Despite the generous usage in a good offense, Boutte wasn't a reliable fantasy option, averaging 8.9 fantasy PPG. After seeing a career-high nine targets in Week 1, Boutte didn't clear five in a game the rest of the regular season. The 2023 sixth-round pick has finished in the range of 500-600 yards each of the last two seasons and has yet to produce a top-50 fantasy campaign. Now with Houston, Boutte will compete with Xavier Hutchinson and Jaylin Noel for Houston's No. 2 receiver role behind Nico Collins. Even if he wins that job, he doesn't figure to see enough work to find his way into the weekly flex discussion."},{"id":3050478,"name":"Jake Elliott","pos":"K","nfl_team":"PHI","status":"ACTIVE","slot_id":20,"slot":"Bench","owner_id":0,"eligible_slots":[17,20,21],"projection":8.02780514,"actual":null,"kickoff":"2026-09-13T20:25:00+00:00","opponent":"vs WSH","game_state":"pre","locked":false,"availability":"FREEAGENT","week_outlook":[{"week":1,"projection":8.02780514,"opponent":"vs WSH","kickoff":"2026-09-13T20:25:00+00:00"},{"week":2,"projection":7.43403118,"opponent":"@ TEN","kickoff":"2026-09-20T17:00:00+00:00"},{"week":3,"projection":7.43602985,"opponent":"@ CHI","kickoff":"2026-09-29T00:15:00+00:00"}],"outlook":""},{"id":4360234,"name":"Evan McPherson","pos":"K","nfl_team":"CIN","status":"ACTIVE","slot_id":20,"slot":"Bench","owner_id":0,"eligible_slots":[17,20,21],"projection":7.98078874,"actual":null,"kickoff":"2026-09-13T17:00:00+00:00","opponent":"vs TB","game_state":"pre","locked":false,"availability":"FREEAGENT","week_outlook":[{"week":1,"projection":7.98078874,"opponent":"vs TB","kickoff":"2026-09-13T17:00:00+00:00"},{"week":2,"projection":7.1961222,"opponent":"@ HOU","kickoff":"2026-09-20T17:00:00+00:00"},{"week":3,"projection":7.2899837,"opponent":"@ PIT","kickoff":"2026-09-27T17:00:00+00:00"}], rk last season. The usage led to two fantasy outings with 17-plus points, but he was otherwise a nonfactor (4.0 PPG). Efficiency remains an issue, as Mitchell's 44% catch rate ranks last, and his 6.0 yards per target is fourth worst among 77 receivers with 100-plus targets since he entered the league. The vertical threat will compete with rookie Omar Cooper Jr. for No. 2 duties opposite a now-healthy Garrett Wilson in the Jets' Geno Smith-led offense. Mitchell, 23, is not worth much more than late-round consideration."},{"id":4571557,"name":"Spencer Shrader","pos":"K","nfl_team":"IND","status":"ACTIVE","slot_id":20,"slot":"Bench","owner_id":0,"eligible_slots":[17,20,21],"projection":7.62058796,"actual":null,"kickoff":"2026-09-13T17:00:00+00:00","opponent":"vs BAL","game_state":"pre","locked":false,"availability":"FREEAGENT","week_outlook":[{"week":1,"projection":7.62058796,"opponent":"vs BAL","kickoff":"2026-09-13T17:00:00+00:00"},{"week":2,"projection":7.3016787,"opponent":"@ KC","kickoff":"2026-09-21T00:20:00+00:00"},{"week":3,"projection":7.44125633,"opponent":"vs HOU","kickoff":"2026-09-27T17:00:00+00:00"}],"outlook":""},{"id":4361411,"name":"Pat Freiermuth","pos":"TE","nfl_team":"PIT","status":"ACTIVE","slot_id":20,"slot":"Bench","owner_id":0,"eligible_slots":[5,6,23,7,20,21],"projection":7.59926058,"actual":null,"kickoff":"2026-09-13T17:00:00+00:00","opponent":"vs ATL","game_state":"pre","locked":false,"availability":"FREEAGENT","week_outlook":[{"week":1,"projection":7.59926058,"opponent":"vs ATL","kickoff":"2026-09-13T17:00:00+00:00"},{"week":2,"projection":7.00826136,"opponent":"@ NE","kickoff":"2026-09-20T17:00:00+00:00"},{"week":3,"projection":7.65364593,"opponent":"vs CIN","kickoff":"2026-09-27T17:00:00+00:00"}],"outlook":"Freiermuth's career trajectory has been quite the head-scratcher, but the bottom line is he is yet to emerge as a consistent fantasy starter. The 2021 second-round pick flirted with TE1 status in both 2022 (11th in fantasy PPG) and 2024 n the third round of April's draft. Douglas is a tall, perimeter receiver with big hands and long arms who, after not seeing much work during two seasons at Florida, exploded for 60-877-6 and 54-846-7 receiving lines at Texas Tech over the last two seasons. His overall efficiency was underwhelming, including six drops and a shaky 1.81 YPRR in 2025. He impressed with a 4.39 40-yard dash at 206 pounds (111 speed score) at the combine. Douglas has a path to a large offensive role as a rookie (Malik Washington, Jalen Tolbert and fellow rookie Chris Bell are his primary competition), but life may be tough in a rebuilding Miami offense led by unproven Malik Willis. He's only worth a late flier."},{"id":5081335,"name":"Drew Stevens","pos":"K","nfl_team":"WSH","status":"ACTIVE","slot_id":20,"slot":"Bench","owner_id":0,"eligible_slots":[25,17,20,21],"projection":6.83545788,"actual":null,"kickoff":"2026-09-13T20:25:00+00:00","opponent":"@ PHI","game_state":"pre","locked":false,"availability":"FREEAGENT","week_outlook":[{"week":1,"projection":6.83545788,"opponent":"@ PHI","kickoff":"2026-09-13T20:25:00+00:00"},{"week":2,"projection":7.17641615,"opponent":"@ DAL","kickoff":"2026-09-20T20:25:00+00:00"},{"week":3,"projection":7.13472875,"opponent":"vs SEA","kickoff":"2026-09-27T17:00:00+00:00"}],"outlook":""},{"id":-16010,"name":"Titans D/ST","pos":"DST","nfl_team":"TEN","status":"ACTIVE","slot_id":20,"slot":"Bench","owner_id":0,"eligible_slots":[16,20,21],"projection":6.80127489,"actual":null,"kickoff":"2026-09-13T17:00:00+00:00","opponent":"vs NYJ","game_state":"pre","locked":false,"availability":"FREEAGENT","week_outlook":[{"week":1,"projection":6.80127489,"opponent":"vs NYJ","kickoff":"2026-09-13T17:00:00+00:00"},{"week":2,"projection":4.40874352,"opponent":"vs PHI","kickoff":"2026-09-20T17:00:00+00:00"},{"week":3,"projection":4.29975896,"opponent":"@ NYG","kickoff":"2026-09-27T17:00:00+00:00"}],"outlook":"The Titans finished 25th in fantasy scoring from the D/ST last season,  with Kenneth Walker III no longer on the Seattle roster and Zach Charbonnet (ACL) in doubt for the early portion of the season. Holani will compete with rookie Jadrian Price and Emanuel Wilson for touches while Charbonnet is sidelined. The 2024 UDFA has 25 carries and three targets to his name through two NFL seasons. Price figures to get the first shot at lead back duties and, even if forced into a few starts in Seattle's run-friendly offense, Holani would be working in a committee and no more than a deep league flex."},{"id":4367209,"name":"Greg Dulcich","pos":"TE","nfl_team":"MIA","status":"ACTIVE","slot_id":20,"slot":"Bench","owner_id":0,"eligible_slots":[5,6,23,7,20,21],"projection":6.40824023,"actual":null,"kickoff":"2026-09-13T20:25:00+00:00","opponent":"@ LV","game_state":"pre","locked":false,"availability":"FREEAGENT","week_outlook":[{"week":1,"projection":6.40824023,"opponent":"@ LV","kickoff":"2026-09-13T20:25:00+00:00"},{"week":2,"projection":6.25009688,"opponent":"@ SF","kickoff":"2026-09-20T20:25:00+00:00"},{"week":3,"projection":6.13387755,"opponent":"vs KC","kickoff":"2026-09-27T17:00:00+00:00"}],"outlook":"Dulcich is back on the fantasy radar as the top tight end on the Miami depth chart. The 2022 third-round pick for the Denver Broncos made some noise as a rookie with a 33-411-2 receiving line in 10 games, but he went on to total 16 targets during the 2023 and 2024 seasons before landing in Miami last season. Dulcich didn't see his first target until Week 9 but went on to post a 26-335-1 receiving line the rest of the way. He wasn't a regular fantasy option (one top-15 week among TEs), but he certainly has a path to a substantial target share in 2026 with minimal competition at tight end and with Miami so short-handed at wide receiver. The 26-year-old is a long shot for consistent fantasy value in an offense expected to struggle, but there's some deep-league sleeper appeal."},{"id":15818,"name":"Keenan Allen","pos":"WR","nfl_team":"IND","status":"ACTIVE","slot_id":20,"slot":"Bench","owner_id":0,"eligible_slots":[3,4,5,23,7,20,21],"projection":6.38016013,"actual":null,"kickoff":"2026-09-13T17:00:00+00:00","opponent":"vs BAL","game_state":"pre","locked":false,"availability":"FREEAGENT","week_outlook":[{"week":1,"projection":6.38016013,"opponent":"vs BAL","kickoff":"2026-09-13T17:00:00+00:00"},{"week":2,"projection":6.34662832,"opponent":"@ KC","kickoff":"2026-09-21T00:20:00+00:00"},{"week":3,"projection":6.04874892,"opponent":"vs HOU","kickoff":"2026-09-27T17:00:00+00:00"}],"outlook":""},{"id":4685261,"name":"Germie Bernard","pos":"WR","nfl_team":"PIT","status":"ACTIVE","slot_id":20,"slot":"Bench","owner_id":0,"eligible_slots":[25,3,4,5,23,7,20,21],"projection":6.36471711,"actual":null,"kickoff":"2026-09-13T17:00:00+00:00","opponent":"vs ATL","game_state":"pre","locked":false,"availability":"FREEAGENT","week_outlook":[{"week":1,"projection":6.36471711,"opponent":"vs ATL","kickoff":"2026-09-13T17:00:00+00:00"},{"week":2,"projection":5.77961397,"opponent":"@ NE","kickoff":"2026-09-20T17:00:00+00:00"},{"week":3,"projection":6.38811979,"opponent":"vs CIN","kickoff":"2026-09-27T17:00:00+00:00"}],"outlook":"Bernard was selected by the Steelers in the second round of April's draft. Bernard is a solid, reliable receiver with good size who can align all over the formation (55% slot in 53 collegiate games). Despite playing at three schools in four years, Bernard's production increased each season, including a strong 64-862-7 receiving line (plus 18-101-2 rushing) in 2025. He dropped only four of 240 career targets. Bernard is likely to open his career third or fourth in line at receiver behind Michael Pittman Jr., DK Metcalf and perhaps Roman Wilson. That will create a tough path to consistent rookie-season usage and production, so he's only worth draft consideration in the later rounds."},{"id":4682648,"name":"Malachi Fields","pos":"WR","nfl_team":"NYG","status":"ACTIVE","slot_id":20,"slot":"Bench","owner_id":0,"eligible_slots":[25,3,4,5,23,7,20,21],"projection":6.33320728,"actual":null,"kickoff":"2026-09-14T00:20:00+00:00","opponent":"vs DAL","game_state":"pre","locked":false,"availability":"FREEAGENT","week_outlook":[{"week":1,"projection":6.33320728,"opponent":"vs DAL","kickoff":"2026-09-14T00:20:00+00:00"},{"week":2,"projection":5.26040008,"opponent":"@ LAR","kickoff":"2026-09-22T00:15:00+00:00"},{"week":3,"projection":5.79011079,"opponent":"vs TEN","kickoff":"2026-09-27T17:00:00+00:00"}],"outlook":"Fields was selected by the Giants in the third round of April's draft. One of the biggest and strongest receivers in this rookie class, Fields figures to work as a perimeter, vertical target in the pros (career 13.3 aDOT during 49 collegiate games). Fields, who dropped just seven passes in college, handled a target share of, at least, 20% and air yard share of, at least, 30% during each of his final three collegiate seasons (two at Virginia, one at Notre Dame). Fields will battle Darnell Mooney and Darius Slayton for New York's No. 2 receiver gig behind Malik Nabers. The rookie is a fine late-round flier."},{"id":4596334,"name":"Keaton Mitchell","pos":"RB","nfl_team":"LAC","status":"QUESTIONABLE","slot_id":20,"slot":"Bench","owner_id":0,"eligible_slots":[2,3,23,7,20,21],"projection":6.25064169,"actual":null,"kickoff":"2026-09-13T20:25:00+00:00","opponent":"vs ARI","game_state":"pre","locked":false,"availability":"FREEAGENT","week_outlook":[{"week":1,"projection":6.25064169,"opponent":"vs ARI","kickoff":"2026-09-13T20:25:00+00:00"},{"week":2,"projection":6.13305232,"opponent":"vs LV","kickoff":"2026-09-20T20:05:00+00:00"},{"week":3,"projection":5.73820042,"opponent":"@ BUF","kickoff":"2026-09-27T17:00:00+00:00"}],"outlook":"Mitchell signed with the Chargers after spending his first three NFL seasons with Baltimore. The 2023 UDFA will compete with Kimani Vidal for change-of-pace touches behind starter Omarion Hampton. Mitchell has been limited to 140 touches over his first three NFL seasons, but he has been extremely productive when called upon. His career 6.34 yards per carry ranks second and his 2.50 YAC fourth among 89 backs with 100-plus carries since 2023. He has also put up 184 yards on 23 targets (8.0 YPT). Mitchell is on the small side, so his ceiling is likely capped (he has never cleared 11 touches in a game), but the 24-year-old would be worth adding should Hampton miss time."},{"id":4870847,"name":"Ja'Kobi Lane","pos":"WR","nfl_team":"BAL","status":"ACTIVE","slot_id":20,"slot":"Bench","owner_id":0,"eligible_slots":[25,3,4,5,23,7,20,21],"projection":6.19429233,"actual":null,"kickoff":"2026-09-13T17:00:00+00:00","opponent":"@ IND","game_state":"pre","locked":false,"availability":"FREEAGENT","week_outlook":[{"week":1,"projection":6.19429233,"opponent":"@ IND","kickoff":"2026-09-13T17:00:00+00:00"},{"week":2,"projection":6.1442131,"opponent":"vs NO","kickoff":"2026-09-20T17:00:00+00:00"},{"week":3,"projection":6.25415233,"opponent":"@ DAL","kickoff":"2026-09-27T20:25:00+00:00"}],"outlook":"Lane was selected by the Ravens in the third round of April's draft. Lane is a tall, perimeter receiver with the biggest hands in this rookie class. He produced solid 43-525-12 and 49-745-4 receiving lines during his final two seasons at USC. Lane was rarely used in the intermediate area and struggled to produce after the catch (career 3.7 RAC is second worst in this class), but he has the frame and skill set to allow him plenty of pro potential. He'll battle the likes of Devontez Walker and fellow rookie Elijah Surratt for work behind Zay Flowers and Rashod Bateman in Baltimore's low-volume pass offense. Lane's primary value is as dynasty stash."},{"id":4360635,"name":"Chig Okonkwo","pos":"TE","nfl_team":"WSH","status":"ACTIVE","slot_id":20,"slot":"Bench","owner_id":0,"eligible_slots":[5,6,23,7,20,21],"projection":6.06799393,"actual":null,"kickoff":"2026-09-13T20:25:00+00:00","opponent":"@ PHI","game_state":"pre","locked":false,"availability":"FREEAGENT","week_outlook":[{"week":1,"projection":6.06799393,"opponent":"@ PHI","kickoff":"2026-09-13T20:25:00+00:00"},{"week":2,"projection":6.50536674,"opponent":"@ DAL","kickoff":"2026-09-20T20:25:00+00:00"},{"week":3,"projection":6.06071272,"opponent":"vs SEA","kickoff":"2026-09-27T17:00:00+00:00"}],"outlook":"Okonkwo signed with the Commanders after spending his first four seasons in Tennessee. The 2022 fourth-round pick is one of only four tight ends who have appeared in all 68 games since he entered the league, and he's also one of only six tight ends who have registered 50-plus receptions each of the past three seasons. On the other hand, Okonkwo has yet to clear a 16% target share in a single season, and he has been a nonfactor near the goal line (eight TDs and 11 end zone targets in his career). As a result, he has finished exactly 21st in fantasy points each of the past three seasons. Perhaps he'll make a leap as one of Jayden Daniels' top targets, but the 27-year-old is no more than a back-end TE2 lottery ticket."},{"id":4576297,"name":"AJ Barner","pos":"TE","nfl_team":"SEA","status":"ACTIVE","slot_id":20,"slot":"Bench","owner_id":0,"eligible_slots":[5,6,23,7,20,21],"projection":6.0043342,"actual":2.8,"kickoff":"2026-09-10T00:20:00+00:00","opponent":"vs NE","game_state":"post","locked":false,"availability":"WAIVERS","week_outlook":[{"week":1,"projection":6.0043342,"opponent":"vs NE","kickoff":"2026-09-10T00:20:00+00:00"},{"week":2,"projection":6.36142917,"opponent":"@ ARI","kickoff":"2026-09-20T20:25:00+00:00"},{"week":3,"projection":6.4315746,"opponent":"@ WSH","kickoff":"2026-09-27T17:00:00+00:00"}],"outlook":"Barner was a solid contributor for the Seattle offense last season. The 2024 fourth-round pick worked his way to the top of the depth chart, and although his overall volume was limited (20th among TEs in targets and yards), he found the end zone seven times and finished 14th in fantasy points (21st in PPG). The 24-year-old is a serviceable, short-range target for Sam Darnold, but even with some rushing worked in, his role in Seattle's low-volume passing offense won't allow much upside. In fact, it's possible he loses some targets to second-year TE Elijah Arroyo this season. Barner is a fringe TE2, at best."},{"id":3886598,"name":"Jauan Jennings","pos":"WR","nfl_team":"MIN","status":"ACTIVE","slot_id":20,"slot":"Bench","owner_id":0,"eligible_slots":[3,4,5,23,7,20,21],"projection":5.99812781,"actual":null,"kickoff":"2026-09-13T20:25:00+00:00","opponent":"vs GB","game_state":"pre","locked":false,"availability":"FREEAGENT","week_outlook":[{"week":1,"projection":5.99812781,"opponent":"vs GB","kickoff":"2026-09-13T20:25:00+00:00"},{"week":2,"projection":6.19990043,"opponent":"@ CHI","kickoff":"2026-09-20T17:00:00+00:00"},{"week":3,"projection":5.83105663,"opponent":"@ TB","kickoff":"2026-09-27T20:05:00+00:00"}],"outlook":"Jennings signed with the Vikings in May. The 2020 seventh-round pick was a situational player during his first three pro campaigns in San Francisco prior to breaking out with a 77-975-6 receiving line and 27th-place finish in fantasy PPG in 2024. He dipped quite a bit statistically in 2025 and failed to produce a single top-10 fantasy week, but did score nine touchdowns (sixth among WRs) in a good Niners offense. The 29-year-old will now file in third on the Minnesota depth chart behind Justin Jefferson and Jordan Addison. He's headed for a big dip in targets and, especially with Kyler Murray under center, won't be a consistent fantasy option. He's barely worth late-round consideration."},{"id":4599739,"name":"Kendre Miller","pos":"RB","nfl_team":"NO","status":"ACTIVE","slot_id":20,"slot":"Bench","owner_id":0,"eligible_slots":[2,3,23,7,20,21],"projection":5.98133374,"actual":null,"kickoff":"2026-09-13T17:00:00+00:00","opponent":"@ DET","game_state":"pre","locked":false,"availability":"FREEAGENT","week_outlook":[{"week":1,"projection":5.98133374,"opponent":"@ DET","kickoff":"2026-09-13T17:00:00+00:00"},{"week":2,"projection":5.85041842,"opponent":"@ BAL","kickoff":"2026-09-20T17:00:00+00:00"},{"week":3,"projection":0.57740277,"opponent":"vs LV","kickoff":"2026-09-27T20:25:00+00:00"}],"outlook":""},{"id":3123076,"name":"David Njoku","pos":"TE","nfl_team":"LAC","status":"ACTIVE","slot_id":20,"slot":"Bench","owner_id":0,"eligible_slots":[5,6,23,7,20,21],"projection":5.97580374,"actual":null,"kickoff":"2026-09-13T20:25:00+00:00","opponent":"vs ARI","game_state":"pre","locked":false,"availability":"FREEAGENT","week_outlook":[{"week":1,"projection":5.97580374,"opponent":"vs ARI","kickoff":"2026-09-13T20:25:00+00:00"},{"week":2,"projection":5.89780234,"opponent":"vs LV","kickoff":"2026-09-20T20:05:00+00:00"},{"week":3,"projection":5.97916168,"opponent":"@ BUF","kickoff":"2026-09-27T17:00:00+00:00"}],"outlook":"Njoku signed with the Chargers after spending his first nine NFL seasons in Cleveland. The 2017 first-round pick was a late bloomer and has struggled with durability (he hasn't played a full season since 2018), but he has been a productive fantasy starter in recent years. Prior to a lost 2025 campaign, Njoku finished in the top eight among tight ends in fantasy PPG three seasons in a row. A force near the goal line, Njoku paced the position in end zone targets in both 2023 and 2024. At 30 years old, Njoku likely still has something left in the tank, but he has a tough path to fantasy relevance in a Los Angeles tight end room that also includes ascending Oronde Gadsden II and Charlie Kolar. Njoku will only be worth an add if he quickly takes control as the team's clear starter at the position."},{"id":3116389,"name":"Samaje Perine","pos":"RB","nfl_team":"CIN","status":"ACTIVE","slot_id":20,"slot":"Bench","owner_id":0,"eligible_slots":[2,3,23,7,20,21],"projection":5.96551631,"actual":null,"kickoff":"2026-09-13T17:00:00+00:00","opponent":"vs TB","game_state":"pre","locked":false,"availability":"FREEAGENT","week_outlook":[{"week":1,"projection":5.96551631,"opponent":"vs TB","kickoff":"2026-09-13T17:00:00+00:00"},{"week":2,"projection":5.26525505,"opponent":"@ HOU","kickoff":"2026-09-20T17:00:00+00:00"},{"week":3,"projection":5.40441099,"opponent":"@ PIT","kickoff":"2026-09-27T17:00:00+00:00"}],"outlook":"Perine is expected to resume his role as Chase Brown's primary backup in Cincinnati. The veteran back played 31% of the Bengals' snaps last season, totaling 84 carries and 21 targets. He cleared 400 total yards for the fifth consecutive season, though he has yet to reach 200 touches in a single season in his career, nor has he produced a top-30 fantasy campaign. The 30-year-old has reached double-digit fantasy points three times over the last two seasons and would require a Brown injury in order to flirt with flex appeal. He can be left on waivers."},{"id":2977187,"name":"Cooper Kupp","pos":"WR","nfl_team":"SEA","status":"ACTIVE","slot_id":20,"slot":"Bench","owner_id":0,"eligible_slots":[3,4,5,23,7,20,21],"projection":5.71426294,"actual":5.5,"kickoff":"2026-09-10T00:20:00+00:00","opponent":"vs NE","game_state":"post","locked":false,"availability":"WAIVERS","week_outlook":[{"week":1,"projection":5.71426294,"opponent":"vs NE","kickoff":"2026-09-10T00:20:00+00:00"},{"week":2,"projection":6.02665247,"opponent":"@ ARI","kickoff":"2026-09-20T20:25:00+00:00"},{"week":3,"projection":6.1058305,"opponent":"@ WSH","kickoff":"2026-09-27T17:00:00+00:00"}],"outlook":"Kupp heads into his age-33 season positioned for situational targets in Seattle's run-first offense. The longtime Rams slot man appeared in 16 games for Seattle in 2025 -- his first season with the team -- and was limited to a career-low 16% target share. Kupp was a nonfactor in fantasy, clearing 12.0 fantasy points only once (16.0 in Week 2). The veteran remains a reliable short-range target, but his ceiling is very low with Jaxon Smith-Njigba soaking up a huge share of the targets and the likes of Rashid Shaheed and Tory Horton also in the mix. Kupp is an unexciting late-round pick."},{"id":-16003,"name":"Bears D/ST","pos":"DST","nfl_team":"CHI","status":"ACTIVE","slot_id":20,"slot":"Bench","owner_id":0,"eligible_slots":[16,20,21],"projection":5.68167421,"actual":null,"kickoff":"2026-09-13T17:00:00+00:00","opponent":"@ CAR","game_state":"pre","locked":false,"availability":"FREEAGENT","week_outlook":[{"week":1,"projection":5.68167421,"opponent":"@ CAR","kickoff":"2026-09-13T17:00:00+00:00"},{"week":2,"projection":5.58245136,"opponent":"vs MIN","kickoff":"2026-09-20T17:00:00+00:00"},{"week":3,"projection":4.5016403,"opponent":"vs PHI","kickoff":"2026-09-29T00:15:00+00:00"}],"outlook":"Despite leading the league in turnovers generated (33), the Bears' defense finished a middling 16th in fantasy points last season. The team subsequently replaced Jaquan Brisker, Kevin Byard and Tremaine Edmunds with Devin Bush, Coby Bryant and Dillon Thieneman during the offseason, meaning this will probably again be a matchups-oriented unit. Consider the Bears for favorable early matchups against the Panthers (Week 1) and Jets (4)."},{"id":4603186,"name":"Jack Bech","pos":"WR","nfl_team":"LV","status":"ACTIVE","slot_id":20,"slot":"Bench","owner_id":0,"eligible_slots":[3,4,5,23,7,20,21],"projection":5.67307164,"actual":null,"kickoff":"2026-09-13T20:25:00+00:00","opponent":"vs MIA","game_state":"pre","locked":false,"availability":"FREEAGENT","week_outlook":[{"week":1,"projection":5.67307164,"opponent":"vs MIA","kickoff":"2026-09-13T20:25:00+00:00"},{"week":2,"projection":3.62384373,"opponent":"@ LAC","kickoff":"2026-09-20T20:05:00+00:00"},{"week":3,"projection":3.6299069,"opponent":"@ NO","kickoff":"2026-09-27T20:25:00+00:00"}],"outlook":"Bech is a candidate for a Year 2 leap after an underwhelming rookie campaign. The 2025 second-round pick was limited to 36% of Las Vegas' offensive snaps and cleared three targets in a game only twice. He failed to find the end zone while predominantly working as a short-range target. Bech will now compete with the likes of Tre Tucker, Jalen Nailor and Dont'e Thornton Jr. for a starting gig in a new-look offense led by coach Klint Kubiak and, at some point, No. 1 overall draft pick Fernando Mendoza. The 23-year-old is likely headed for a larger role in his second season and is worth a late-round flier."},{"id":4243331,"name":"Cade Otton","pos":"TE","nfl_team":"TB","status":"ACTIVE","slot_id":20,"slot":"Bench","owner_id":0,"eligible_slots":[5,6,23,7,20,21],"projection":5.59378491,"actual":null,"kickoff":"2026-09-13T17:00:00+00:00","opponent":"@ CIN","game_state":"pre","locked":false,"availability":"FREEAGENT","week_outlook":[{"week":1,"projection":5.59378491,"opponent":"@ CIN","kickoff":"2026-09-13T17:00:00+00:00"},{"week":2,"projection":5.14193387,"opponent":"vs CLE","kickoff":"2026-09-20T17:00:00+00:00"},{"week":3,"projection":5.30563116,"opponent":"vs MIN","kickoff":"2026-09-27T20:05:00+00:00"}],"outlook":"Otton re-signed with Tampa Bay after spending his first four NFL seasons with the team. Since entering the league in 2022, Otton ranks first among all tight ends in snaps (3,530) and second in routes (1,838). That simply hasn't translated to much target volume (he is yet to clear 86 in a season) or goal-line work (11 TDs and 19 end zone targets in 63 games). In fact, Otton was the only player with 75-plus targets who didn't score multiple touchdowns last season. The 27-year-old has finished 25th or lower in fantasy PPG in three of four seasons and is a poor bet for his first top-10 finish in 2026. He's well off the fantasy radar."},{"id":4430034,"name":"Xavier Legette","pos":"WR","nfl_team":"CAR","status":"ACTIVE","slot_id":20,"slot":"Bench","owner_id":0,"eligible_slots":[3,4,5,23,7,20,21],"projection":5.52072002,"actual":null,"kickoff":"2026-09-13T17:00:00+00:00","opponent":"vs CHI","game_state":"pre","locked":false,"availability":"FREEAGENT","week_outlook":[{"week":1,"projection":5.52072002,"opponent":"vs CHI","kickoff":"2026-09-13T17:00:00+00:00"},{"week":2,"projection":5.41500678,"opponent":"@ ATL","kickoff":"2026-09-20T17:00:00+00:00"},{"week":3,"projection":4.83429785,"opponent":"@ CLE","kickoff":"2026-09-27T17:00:00+00:00"}],"outlook":"Legette is eyeing a Year 3 leap after a boom/bust start to his NFL career. The 2024 first-round pick flashed with 521 yards and four touchdowns on 55 touches as a rookie, but fell to 363 yards and three scores on 36 touches in 2025. Legette did post a pair of big games (24.2 points in Week 7 and 18.3 points in Week 11), but was otherwise held in check (3.6 PPG in the other 13 games). Legette has struggled with the ball in his hands (woeful 2.1 RAC in his career) and is behind Tetairoa McMillan and likely Jalen Coker on the Carolina WR depth chart. The 25-year-old will see some situational targets and carries, but he'll need a big Year 3 leap to find his way to fantasy relevance. He's no more than a late-round lottery ticket."},{"id":-16009,"name":"Packers D/ST","pos":"DST","nfl_team":"GB","status":"ACTIVE","slot_id":20,"slot":"Bench","owner_id":0,"eligible_slots":[16,20,21],"projection":5.41311946,"actual":null,"kickoff":"2026-09-13T20:25:00+00:00","opponent":"@ MIN","game_state":"pre","locked":false,"availability":"WAIVERS","week_outlook":[{"week":1,"projection":5.41311946,"opponent":"@ MIN","kickoff":"2026-09-13T20:25:00+00:00"},{"week":2,"projection":6.67495391,"opponent":"@ NYJ","kickoff":"2026-09-20T17:00:00+00:00"},{"week":3,"projection":5.81960014,"opponent":"vs ATL","kickoff":"2026-09-25T00:15:00+00:00"}],"outlook":"Micah Parsons' health has a bearing on the performance of this defense; it was 13th in fantasy points across the 13 games before his ACL tear, but had a negative score in four games without him. Tuck that away before diving head first into the team's soft September schedule (@MIN, @NYJ, ATL the first three weeks), though those are matchups that make this defense well worth streaming consideration."},{"id":3051876,"name":"Evan Engram","pos":"TE","nfl_team":"DEN","status":"ACTIVE","slot_id":20,"slot":"Bench","owner_id":0,"eligible_slots":[5,6,23,7,20,21],"projection":5.38614846,"actual":null,"kickoff":"2026-09-15T00:15:00+00:00","opponent":"@ KC","game_state":"pre","locked":false,"availability":"FREEAGENT","week_outlook":[{"week":1,"projection":5.38614846,"opponent":"@ KC","kickoff":"2026-09-15T00:15:00+00:00"},{"week":2,"projection":5.7494525,"opponent":"vs JAX","kickoff":"2026-09-20T20:05:00+00:00"},{"week":3,"projection":5.26896425,"opponent":"vs LAR","kickoff":"2026-09-28T00:20:00+00:00"}],"outlook":"Engram returns for his second season in Denver after an underwhelming debut campaign with the team. The veteran tight end was limited to a career-low 13% target share and finished 15th or lower among tight ends in routes, targets, catches and yardage, despite appearing in 16 games. Engram worked as a short-area target but still struggled to a poor 68% catch rate and was, as usual, a nonfactor near the goal line (one TD, two end zone targets). Engram hasn't cleared four touchdowns in a season since he scored six as a rookie in 2017. He finished 32nd among tight ends in fantasy PPG and isn't a good bet for a larger role this season, especially with Jaylen Waddle added to the offense. The 32-year-old Engram is a fantasy TE3, at best."},{"id":4686422,"name":"Xavier Hutchinson","pos":"WR","nfl_team":"HOU","status":"ACTIVE","slot_id":20,"slot":"Bench","owner_id":0,"eligible_slots":[3,4,5,23,7,20,21],"projection":5.34676057,"actual":null,"kickoff":"2026-09-13T17:00:00+00:00","opponent":"vs BUF","game_state":"pre","locked":false,"availability":"FREEAGENT","week_outlook":[{"week":1,"projection":5.34676057,"opponent":"vs BUF","kickoff":"2026-09-13T17:00:00+00:00"},{"week":2,"projection":5.23310604,"opponent":"vs CIN","kickoff":"2026-09-20T17:00:00+00:00"},{"week":3,"projection":4.97537784,"opponent":"@ IND","kickoff":"2026-09-27T17:00:00+00:00"}],"outlook":""},{"id":-16012,"name":"Chiefs D/ST","pos":"DST","nfl_team":"KC","status":"ACTIVE","slot_id":20,"slot":"Bench","owner_id":0,"eligible_slots":[16,20,21],"projection":5.31361191,"actual":null,"kickoff":"2026-09-15T00:15:00+00:00","opponent":"vs DEN","game_state":"pre","locked":false,"availability":"FREEAGENT","week_outlook":[{"week":1,"projection":5.31361191,"opponent":"vs DEN","kickoff":"2026-09-15T00:15:00+00:00"},{"week":2,"projection":6.09727029,"opponent":"vs IND","kickoff":"2026-09-21T00:20:00+00:00"},{"week":3,"projection":6.23966567,"opponent":"@ MIA","kickoff":"2026-09-27T17:00:00+00:00"}],"outlook":"The Chiefs have fielded a middling fantasy D/ST the past two seasons, scoring in double-digits only seven times  but finishing with zero or negative fantasy points only five times . Top draftee Mansoor Delane replaces CB Trent McDuffie, who was traded to the Rams, but the team otherwise returns largely the same starting lineup. An opening-week matchup against the Broncos should be avoided, but there are pockets of the schedule where the Chiefs would be great for streaming: Weeks 3-4 (@MIA, @LV) and Weeks 9-11 (NYJ, @ATL, ARI) especially."},{"id":4723820,"name":"Omar Cooper Jr.","pos":"WR","nfl_team":"NYJ","status":"ACTIVE","slot_id":20,"slot":"Bench","owner_id":0,"eligible_slots":[25,3,4,5,23,7,20,21],"projection":5.26763153,"actual":null,"kickoff":"2026-09-13T17:00:00+00:00","opponent":"@ TEN","game_state":"pre","locked":false,"availability":"FREEAGENT","week_outlook":[{"week":1,"projection":5.26763153,"opponent":"@ TEN","kickoff":"2026-09-13T17:00:00+00:00"},{"week":2,"projection":5.22614419,"opponent":"vs GB","kickoff":"2026-09-20T17:00:00+00:00"},{"week":3,"projection":4.50572862,"opponent":"@ DET","kickoff":"2026-09-27T17:00:00+00:00"}],"outlook":"Cooper was selected by the Jets in the first round of April's draft. The Indiana product is fresh off a breakout 2025 season in which he posted a 69-937-13 receiving line after totaling 46 catches during his first three seasons with the Hoosiers. Primarily a perimeter target in limited action from 2022 to 2024, Cooper aligned in the slot on 80% of his routes last season. He is a short-area target (9.0 aDOT last season), but still posted strong efficiency numbers, including a 2.61 YPRR. He'll begin his career behind Garrett Wilson and Adonai Mitchell in New York's Geno Smith-led offense and is unlikely to produce consistent flex value as a rookie."},{"id":4431431,"name":"Corey Kiner","pos":"RB","nfl_team":"NE","status":"ACTIVE","slot_id":20,"slot":"Bench","owner_id":0,"eligible_slots":[2,3,23,7,20,21],"projection":5.23405458,"actual":1.1,"kickoff":"2026-09-10T00:20:00+00:00","opponent":"@ SEA","game_state":"post","locked":false,"availability":"WAIVERS","week_outlook":[{"week":1,"projection":5.23405458,"opponent":"@ SEA","kickoff":"2026-09-10T00:20:00+00:00"},{"week":2,"projection":0.0,"opponent":"vs PIT","kickoff":"2026-09-20T17:00:00+00:00"},{"week":3,"projection":0.0,"opponent":"@ JAX","kickoff":"2026-09-27T17:00:00+00:00"}],"outlook":""},{"id":4241474,"name":"Brian Robinson Jr.","pos":"RB","nfl_team":"ATL","status":"ACTIVE","slot_id":20,"slot":"Bench","owner_id":0,"eligible_slots":[2,3,23,7,20,21],"projection":5.23337736,"actual":null,"kickoff":"2026-09-13T17:00:00+00:00","opponent":"@ PIT","game_state":"pre","locked":false,"availability":"FREEAGENT","week_outlook":[{"week":1,"projection":5.23337736,"opponent":"@ PIT","kickoff":"2026-09-13T17:00:00+00:00"},{"week":2,"projection":6.23692378,"opponent":"vs CAR","kickoff":"2026-09-20T17:00:00+00:00"},{"week":3,"projection":5.59629735,"opponent":"@ GB","kickoff":"2026-09-25T00:15:00+00:00"}],"outlook":"After a one-year stint as Christian McCaffrey's backup in San Francisco, Robinson signed with Atlanta where he'll now operate as a change-of-pace back behind Bijan Robinson. The 2022 third-round pick soaked up 200-plus touches in each of his first three NFL seasons (all with Washington) prior to dipping to 100 touches in 2025. Robinson is a big back who can handle early-down and short-yardage work, but he's not much of a factor as a receiver (92 career targets). He's yet to post a top-20 fantasy campaign and he won't come close to that in 2026 unless Bijan Robinson suffers a major injury. The 27-year-old back is no more than a solid insurance stash."},{"id":4686612,"name":"Tre' Harris","pos":"WR","nfl_team":"LAC","status":"ACTIVE","slot_id":20,"slot":"Bench","owner_id":0,"eligible_slots":[3,4,5,23,7,20,21],"projection":5.21481524,"actual":null,"kickoff":"2026-09-13T20:25:00+00:00","opponent":"vs ARI","game_state":"pre","locked":false,"availability":"FREEAGENT","week_outlook":[{"week":1,"projection":5.21481524,"opponent":"vs ARI","kickoff":"2026-09-13T20:25:00+00:00"},{"week":2,"projection":5.13884612,"opponent":"vs LV","kickoff":"2026-09-20T20:05:00+00:00"},{"week":3,"projection":5.20322226,"opponent":"@ BUF","kickoff":"2026-09-27T17:00:00+00:00"}],"outlook":"Harris is a Year 2 breakout candidate after flashing in a limited role as a rookie. The 2025 second-round pick quietly played 49% of the Chargers' offensive snaps, but he spent a lot of that blocking and was limited to an 8% target share. Harris is likely to open the 2026 season behind Ladd McConkey and Quentin Johnston, but with Keenan Allen gone, his competition for No. 3 duties is 2025 fifth-round pick KeAndre Lambert-Smith and rookie Brenen Thompson. A potential starter in new playcaller Mike McDaniel's offense, the 24-year-old Harris is an intriguing late-round sleeper."},{"id":3116164,"name":"Mike Gesicki","pos":"TE","nfl_team":"CIN","status":"ACTIVE","slot_id":20,"slot":"Bench","owner_id":0,"eligible_slots":[5,6,23,7,20,21],"projection":5.18812105,"actual":null,"kickoff":"2026-09-13T17:00:00+00:00","opponent":"vs TB","game_state":"pre","locked":false,"availability":"FREEAGENT","week_outlook":[{"week":1,"projection":5.18812105,"opponent":"vs TB","kickoff":"2026-09-13T17:00:00+00:00"},{"week":2,"projection":4.76789262,"opponent":"@ HOU","kickoff":"2026-09-20T17:00:00+00:00"},{"week":3,"projection":4.83866649,"opponent":"@ PIT","kickoff":"2026-09-27T17:00:00+00:00"}],"outlook":"There was an era when Gesicki was a viable starting option in fantasy, but that time has come and gone. Since posting back-to-back top-eight fantasy campaigns in 2020 and 2021, Gesicki has finished 23rd, 37th, 13th and 41st the past four seasons. The latter came during a 2025 campaign in which he was limited to 41 targets in 13 games. Gesicki is no more than a situational seam stretcher and not much of an option near the goal line (he has exactly two TDs and five end zone targets each of the past three seasons). The 30-year-old will be a risky streaming option even if Ja'Marr Chase or Tee Higgins misses time."},{"id":4808766,"name":"Mason Taylor","pos":"TE","nfl_team":"NYJ","status":"ACTIVE","slot_id":20,"slot":"Bench","owner_id":0,"eligible_slots":[5,6,23,7,20,21],"projection":5.17734543,"actual":null,"kickoff":"2026-09-13T17:00:00+00:00","opponent":"@ TEN","game_state":"pre","locked":false,"availability":"FREEAGENT","week_outlook":[{"week":1,"projection":5.17734543,"opponent":"@ TEN","kickoff":"2026-09-13T17:00:00+00:00"},{"week":2,"projection":5.11723413,"opponent":"vs GB","kickoff":"2026-09-20T17:00:00+00:00"},{"week":3,"projection":3.24903846,"opponent":"@ DET","kickoff":"2026-09-27T17:00:00+00:00"}],"outlook":"Taylor was a busy man during his rookie season, playing 81% of the Jets' offensive snaps and handling a healthy 19% of the targets in 13 games. The 2025 second-round pick struggled badly with efficiency while dealing with the team's quarterback woes, ranking near the basement in catch rate (65%) and yards per target (5.4). Taylor also dropped five passes (fourth most), scored only one touchdown and finished 30th in fantasy PPG. Taylor would've been a potential 2026 breakout candidate, but that was quickly derailed when the Jets selected Kenyon Sadiq in the first round of April's draft. Taylor will play a role in the New York offense, but he won't see nearly enough targets to allow any sort of fantasy relevance."},{"id":4569603,"name":"Malik Washington","pos":"WR","nfl_team":"MIA","status":"ACTIVE","slot_id":20,"slot":"Bench","owner_id":0,"eligible_slots":[3,4,5,23,7,20,21],"projection":5.16166853,"actual":null,"kickoff":"2026-09-13T20:25:00+00:00","opponent":"@ LV","game_state":"pre","locked":false,"availability":"FREEAGENT","week_outlook":[{"week":1,"projection":5.16166853,"opponent":"@ LV","kickoff":"2026-09-13T20:25:00+00:00"},{"week":2,"projection":4.99333936,"opponent":"@ SF","kickoff":"2026-09-20T20:25:00+00:00"},{"week":3,"projection":4.90258416,"opponent":"vs KC","kickoff":"2026-09-27T17:00:00+00:00"}],"outlook":"Washington was a sixth-round flier back in 2024, but that didn't stop him from working his way into a substantial offensive role last season. Washington finished third on the Dolphins in targets, trailing only Jaylen Waddle and De'Von Achane. Of course, Miami's shaky group of offensive personnel was an obvious factor and Washington's efficiency wasn't very good (5.0 yards per target, 7.0 yards per reception, 0.9 yards per route run). The 25-year-old is fine as a short-range target and occasional rusher, but that's likely his ceiling with newcomers Jalen Tolbert, Chris Bell, Caleb Douglas and Kevin Coleman Jr. expected to factor in at wide receiver."},{"id":4040655,"name":"Darnell Mooney","pos":"WR","nfl_team":"NYG","status":"ACTIVE","slot_id":20,"slot":"Bench","owner_id":0,"eligible_slots":[3,4,5,23,7,20,21],"projection":5.06880017,"actual":null,"kickoff":"2026-09-14T00:20:00+00:00","opponent":"vs DAL","game_state":"pre","locked":false,"availability":"FREEAGENT","week_outlook":[{"week":1,"projection":5.06880017,"opponent":"vs DAL","kickoff":"2026-09-14T00:20:00+00:00"},{"week":2,"projection":4.10502432,"opponent":"@ LAR","kickoff":"2026-09-22T00:15:00+00:00"},{"week":3,"projection":4.60634539,"opponent":"vs TEN","kickoff":"2026-09-27T17:00:00+00:00"}],"outlook":"Mooney signed with the Giants to help replace Wan'Dale Robinson as the team's No. 2 receiver behind Malik Nabers. Mooney's production has been all over the map throughout his career, having posted strong 81-1,055-4 and 64-992-5 receiving lines over the past five seasons, while also finishing in the 400-to-500-yard range the other three campaigns during the span. The 28-year-old has proven to be a serviceable starting receiver and could easily settle in second or third in line for targets in the Giants' ascending, Jaxson Dart-led offense. Mooney's ceiling isn't very high, so he's barely worth late round consideration in deep leagues."},{"id":4429501,"name":"Ray Davis","pos":"RB","nfl_team":"BUF","status":"ACTIVE","slot_id":20,"slot":"Bench","owner_id":0,"eligible_slots":[2,3,23,7,20,21],"projection":5.0546313,"actual":null,"kickoff":"2026-09-13T17:00:00+00:00","opponent":"@ HOU","game_state":"pre","locked":false,"availability":"FREEAGENT","week_outlook":[{"week":1,"projection":5.0546313,"opponent":"@ HOU","kickoff":"2026-09-13T17:00:00+00:00"},{"week":2,"projection":2.20462568,"opponent":"vs DET","kickoff":"2026-09-18T00:15:00+00:00"},{"week":3,"projection":2.24989999,"opponent":"vs LAC","kickoff":"2026-09-27T17:00:00+00:00"}],"outlook":"Davis is back as the primary insurance option behind Bills' feature back James Cook III. The 2024 fourth-round pick is one of the most valuable backups in fantasy, but flies a bit under the radar due to a very small game-day role when Cook and passing-down specialist Ty Johnson are both healthy. That's been the scenario most of the last two seasons, but we've seen Davis play more than half of Buffalo's snaps in three games. During those outings, Davis averaged 21.0 touches, 130.3 yards and 19.4 fantasy points per game. The 26-year-old has no standalone value, but he'll leap into the RB2 mix should Cook miss time, which makes him worth stashing on the end of your bench."},{"id":5150247,"name":"Malik Benson","pos":"WR","nfl_team":"LV","status":"ACTIVE","slot_id":20,"slot":"Bench","owner_id":0,"eligible_slots":[25,3,4,5,23,7,20,21],"projection":5.04534607,"actual":null,"kickoff":"2026-09-13T20:25:00+00:00","opponent":"vs MIA","game_state":"pre","locked":false,"availability":"FREEAGENT","week_outlook":[{"week":1,"projection":5.04534607,"opponent":"vs MIA","kickoff":"2026-09-13T20:25:00+00:00"},{"week":2,"projection":3.14067321,"opponent":"@ LAC","kickoff":"2026-09-20T20:05:00+00:00"},{"week":3,"projection":3.13911959,"opponent":"@ NO","kickoff":"2026-09-27T20:25:00+00:00"}],"outlook":"Benson was selected by the Raiders in the sixth round of April's draft. An accomplished sprinter, the speedy Benson has big play written all over him, though he's a slightly older prospect and his collegiate production was limited by a lot of changes in scenery (two years of community college followed by 2023 at Alabama, 2024 at Florida State and 2025 at Oregon). Benson never cleared a 15% target share in a single season, peaking with a 43-719-6 receiving line in 2025. Benson is a longshot as a sixth rounder, but the Raiders' shaky wide receiver depth chart presents him with an opportunity to quickly earn a role. Still, he's no more than a deep sleeper."},{"id":4383429,"name":"Jacob Saylors","pos":"RB","nfl_team":"DET","status":"ACTIVE","slot_id":20,"slot":"Bench","owner_id":0,"eligible_slots":[2,3,23,7,20,21],"projection":4.96184744,"actual":null,"kickoff":"2026-09-13T17:00:00+00:00","opponent":"vs NO","game_state":"pre","locked":false,"availability":"FREEAGENT","week_outlook":[{"week":1,"projection":4.96184744,"opponent":"vs NO","kickoff":"2026-09-13T17:00:00+00:00"},{"week":2,"projection":4.9043173,"opponent":"@ BUF","kickoff":"2026-09-18T00:15:00+00:00"},{"week":3,"projection":4.95589537,"opponent":"vs NYJ","kickoff":"2026-09-27T17:00:00+00:00"}],"outlook":""},{"id":-16006,"name":"Cowboys D/ST","pos":"DST","nfl_team":"DAL","status":"ACTIVE","slot_id":20,"slot":"Bench","owner_id":0,"eligible_slots":[16,20,21],"projection":4.9460089,"actual":null,"kickoff":"2026-09-14T00:20:00+00:00","opponent":"@ NYG","
