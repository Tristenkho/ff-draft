"stat_id":"97","points":0.0},{"stat_id":"19","points":2.0},{"stat_id":"20","points":-2.0},{"stat_id":"198","points":4.0},{"stat_id":"63","points":6.0},{"stat_id":"80","points":3.0},{"stat_id":"26","points":2.0},{"stat_id":"92","points":0.0},{"stat_id":"77","points":3.5},{"stat_id":"99","points":0.0},{"stat_id":"44","points":2.0},{"stat_id":"201","points":5.0}]},"teams":[{"id":1,"name":"Zach","espn_name":"Capullo","manager":"Zach","abbrev":"ZAC","waiver_priority":3,"roster":[{"id":4241389,"name":"CeeDee Lamb","pos":"WR","nfl_team":"DAL","status":"ACTIVE","slot_id":4,"slot":"WR","owner_id":1,"eligible_slots":[3,4,5,23,7,20,21],"projection":16.10037776,"actual":null,"kickoff":"2026-09-14T00:20:00+00:00","opponent":"@ NYG","game_state":"pre","locked":false,"availability":"ONTEAM","week_outlook":[{"week":1,"projection":16.10037776,"opponent":"@ NYG","kickoff":"2026-09-14T00:20:00+00:00"},{"week":2,"projection":17.2584962,"opponent":"vs WSH","kickoff":"2026-09-20T20:25:00+00:00"},{"week":3,"projection":15.76447592,"opponent":"vs BAL","kickoff":"2026-09-27T20:25:00+00:00"}],"outlook":"Lamb is eyeing a bounceback season following a 2025 campaign in which he finished 12th among receivers in fantasy PPG \ufffd his worst finish since 2021. Lamb did go over 1,000 yards for the fifth season in a row, but he missed three games, led all receivers with eight drops and was unlucky in the TD department, having scored three touchdowns (6.6 expected) despite seeing 11 end zone targets. Lamb, 27, remains in his prime and he was fantasy's top-scoring receiver the last time he played a full season (2023). As long Dak Prescott is on the field with him, Lamb will be a solid fantasy WR1 with elite upside."},{"id":3043078,"name":"Derrick Henry","pos":"RB","nfl_team":"BAL","status":"ACTIVE","slot_id":2,"slot":"RB","owner_id":1,"eligible_slots":[2,3,23,7,20,21],"projection":17.22840227,"actual":null,"kickoff":"2026-09-13T17:00:00+00:00","opponent":"@ IND","game_state":"pre","locked":false,"availability":"ONTEAM","week_outlook":[{"week":1,"projection":17.22840227,"opponent":"@ IND","kickoff":"2026-09-13T17:00:00+00:00"},{"week":2,"projection":17.93325973,"opponent":"vs NO","kickoff":"2026-09-20T17:00:00+00:00"},{"week":3,"projection":16.92827338,"opponent":"@ DAL","kickoff":"2026-09-27T20:25:00+00:00"}],"outlook":"Henry continues to defy the odds, playing at a high level despite now entering his age-32 season. In 2025, he finished exactly second in the NFL in rushing yards for the fourth season in a row, and his 24 carries inside the 5-yard line were easily the most in the league. Henry leads the NFL in carries inside the 5-yard line (42) and is second in touchdowns (34) since joining Baltimore prior to the 2024 season, and he hasn't finished lower than eighth among RBs in touchdowns since 2017. Henry continues to run at a high level (his 5.20 yards per carry last season ranked fifth among qualified backs), but he's still a nonfactor as a receiver (outside the top 45 backs in targets, catches and yards last season). He remains a featured rusher in a terrific offense and is well positioned for his fifth consecutive top-eight fantasy campaign."},{"id":4239996,"name":"Travis Etienne Jr.","pos":"RB","nfl_team":"NO","status":"ACTIVE","slot_id":2,"slot":"RB","owner_id":1,"eligible_slots":[2,3,23,7,20,21],"projection":14.97550042,"actual":null,"kickoff":"2026-09-13T17:00:00+00:00","opponent":"@ DET","game_state":"pre","locked":false,"availability":"ONTEAM","week_outlook":[{"week":1,"projection":14.97550042,"opponent":"@ DET","kickoff":"2026-09-13T17:00:00+00:00"},{"week":2,"projection":14.65147236,"opponent":"@ BAL","kickoff":"2026-09-20T17:00:00+00:00"},{"week":3,"projection":15.91242761,"opponent":"vs LV","kickoff":"2026-09-27T20:25:00+00:00"}],"outlook":"Etienne signed with the Saints after spending the first five seasons of his pro career with the Jaguars. The 2021 first-round pick has produced at least 1,399 scrimmage yards in three of the past four seasons and scored a career-high 13 touchdowns in 2025. A capable rusher and receiver, Etienne has already reached 1,000-plus rushing yards three times and has 35-plus catches in each of the past four seasons. Even if the Saints retain Alvin Kamara as a situational player, Etienne will have a clear path to feature-back duties in an ascending offense led by second-year QB Tyler Shough. That will be enough to position the 27-year-old for his third top-15 fantasy campaign in four years. Consider Etienne a solid RB2 target with backend RB1 upside."},{"id":4239993,"name":"Tee Higgins","pos":"WR","nfl_team":"CIN","status":"ACTIVE","slot_id":4,"slot":"WR","owner_id":1,"eligible_slots":[3,4,5,23,7,20,21],"projection":12.15214508,"actual":null,"kickoff":"2026-09-13T17:00:00+00:00","opponent":"vs TB","game_state":"pre","locked":false,"availability":"ONTEAM","week_outlook":[{"week":1,"projection":12.15214508,"opponent":"vs TB","kickoff":"2026-09-13T17:00:00+00:00"},{"week":2,"projection":11.13012003,"opponent":"@ HOU","kickoff":"2026-09-20T17:00:00+00:00"},{"week":3,"projection":11.29464605,"opponent":"@ PIT","kickoff":"2026-09-27T17:00:00+00:00"}],"outlook":"Higgins may be overshadowed by teammate Ja'Marr Chase, but that hasn't stopped the veteran receiver from playing a key role near the goal line in the Bengals' pass-friendly offense. Despite missing seven games over the past two seasons, Higgins sits eighth among receivers in end zone targets (24) and fourth in touchdowns (21) during the span. The 2020 second-round pick finished both seasons in the top 20 in fantasy points (overall and per game). Durability (he hasn't played a full season since 2020) and a limited target share are concerns here, but Higgins' combination of talent and role in a Joe Burrow-led offense are enough to allow fringe-WR2 production."},{"id":4871023,"name":"Carnell Tate","pos":"WR","nfl_team":"TEN","status":"ACTIVE","slot_id":20,"slot":"Bench","owner_id":1,"eligible_slots":[25,3,4,5,23,7,20,21],"projection":11.18510562,"actual":null,"kickoff":"2026-09-13T17:00:00+00:00","opponent":"vs NYJ","game_state":"pre","locked":false,"availability":"ONTEAM","week_outlook":[{"week":1,"projection":11.18510562,"opponent":"vs NYJ","kickoff":"2026-09-13T17:00:00+00:00"},{"week":2,"projection":10.68223573,"opponent":"vs PHI","kickoff":"2026-09-20T17:00:00+00:00"},{"week":3,"projection":11.04529776,"opponent":"@ NYG","kickoff":"2026-09-27T17:00:00+00:00"}],"outlook":"Tate was selected by the Titans with the fourth overall pick of April's draft. He didn't see a ton of volume at Ohio State, but he was efficient, averaging 13.1 yards per target (first in this rookie WR class) and 3.06 yards per route run (third) in 2025. He also paced the class in YPT for his career (11.6) and caught an impressive 75% of his targets during the 39-game span. Tate underwhelmed in the 40-yard dash at the combine (4.53 at 192 pounds), but he measured in with big hands and a large wingspan. Wide receivers selected in the top 10 handle, on average, one-quarter of their team's targets and generally deliver WR2/3 fantasy production. Cam Ward's development will be key here, but Tate's combination of talent and projected target volume is enough to make him an appealing WR3."},{"id":5083076,"name":"Harold Fannin Jr.","pos":"TE","nfl_team":"CLE","status":"ACTIVE","slot_id":6,"slot":"TE","owner_id":1,"eligible_slots":[5,6,23,7,20,21],"projection":9.93598658,"actual":null,"kickoff":"2026-09-13T17:00:00+00:00","opponent":"@ JAX","game_state":"pre","locked":false,"availability":"ONTEAM","week_outlook":[{"week":1,"projection":9.93598658,"opponent":"@ JAX","kickoff":"2026-09-13T17:00:00+00:00"},{"week":2,"projection":9.52274142,"opponent":"@ TB","kickoff":"2026-09-20T17:00:00+00:00"},{"week":3,"projection":9.82002454,"opponent":"vs CAR","kickoff":"2026-09-27T17:00:00+00:00"}],"outlook":"Fannin is a rising star at the tight end position after overcoming the presence of David Njoku and a quarterback merry-go-round to produce a 72-731-6 receiving line (plus 7-13-1 rushing) as a 21-year-old rookie last season. The third-round pick's 108 targets rank eighth all time by a rookie tight end, and he finished no lower than eighth at the position in catches, yards, touchdowns and fantasy points last season. Fannin figures to see some touchdown regression (seven TDs, 3.8 expected, three end zone targets) and Cleveland still has quarterback question marks, but with Njoku gone, Fannin has a path to improve a bit on what was already a healthy 22% target share. He's a solid TE1 target."},{"id":2577417,"name":"Dak Prescott","pos":"QB","nfl_team":"DAL","status":"ACTIVE","slot_id":0,"slot":"QB","owner_id":1,"eligible_slots":[0,7,20,21],"projection":18.11638707,"actual":null,"kickoff":"2026-09-14T00:20:00+00:00","opponent":"@ NYG","game_state":"pre","locked":false,"availability":"ONTEAM","week_outlook":[{"week":1,"projection":18.11638707,"opponent":"@ NYG","kickoff":"2026-09-14T00:20:00+00:00"},{"week":2,"projection":20.53909994,"opponent":"vs WSH","kickoff":"2026-09-20T20:25:00+00:00"},{"week":3,"projection":17.35452019,"opponent":"vs BAL","kickoff":"2026-09-27T20:25:00+00:00"}],"outlook":"Prescott is entering his 11th NFL season following a successful 2025 campaign in which he led the NFL in completions and ranked no lower than fourth in dropbacks, pass attempts, passing yards and passing TDs. Prescott appeared in all 17 games and has now finished no worse than 11th in fantasy points during all seven seasons in which he has played at least 16 games. Last season, his nine top-10 fantasy weeks were tied for third most at the position. Prescott is no longer much of a threat with his legs, but he should continue to put up big passing numbers with CeeDee Lamb and George Pickens at his disposal. The 33-year-old is a fringe QB1."},{"id":4429023,"name":"MarShawn Lloyd","pos":"RB","nfl_team":"GB","status":"ACTIVE","slot_id":23,"slot":"FLEX","owner_id":1,"eligible_slots":[2,3,23,7,20,21],"projection":12.94474285,"actual":null,"kickoff":"2026-09-13T20:25:00+00:00","opponent":"@ MIN","game_state":"pre","locked":false,"availability":"ONTEAM","week_outlook":[{"week":1,"projection":12.94474285,"opponent":"@ MIN","kickoff":"2026-09-13T20:25:00+00:00"},{"week":2,"projection":13.32566681,"opponent":"@ NYJ","kickoff":"2026-09-20T17:00:00+00:00"},{"week":3,"projection":14.91953784,"opponent":"vs ATL","kickoff":"2026-09-25T00:15:00+00:00"}],"outlook":"Due to a variety of injuries, Lloyd has appeared in one game since being selected in the third round of the 2024 draft. Now healthy, he appears to have a hold on No. 2 RB duties in Green Bay, which is notable with Josh Jacobs facing a potential suspension. Lloyd is likely to open the season on the RB2/flex radar and should be on your radar in the middle rounds, though note that he'll fade back to no more than an insurance stash once Jacobs returns."},{"id":-16033,"name":"Ravens D/ST","pos":"DST","nfl_team":"BAL","status":"ACTIVE","slot_id":16,"slot":"DST","owner_id":1,"eligible_slots":[16,20,21],"projection":6.81679456,"actual":null,"kickoff":"2026-09-13T17:00:00+00:00","opponent":"@ IND","game_state":"pre","locked":false,"availability":"ONTEAM","week_outlook":[{"week":1,"projection":6.81679456,"opponent":"@ IND","kickoff":"2026-09-13T17:00:00+00:00"},{"week":2,"projection":6.86311548,"opponent":"vs NO","kickoff":"2026-09-20T17:00:00+00:00"},{"week":3,"projection":4.58218607,"opponent":"@ DAL","kickoff":"2026-09-27T20:25:00+00:00"}],"outlook":"No team has as soft a schedule on the defensive side of things than do the Ravens; only the Cowboys (Week 3), Bengals (7 and 17) and Bills (8) stand out as particularly challenging matchups. That's a good thing, considering this unit finished a disappointing 21st in scoring last season. The Ravens still have stars on the defensive side, and the change in head coach to Jesse Minter and defensive coordinator to Anthony Weaver should fuel a rebound to some degree."},{"id":3116165,"name":"Chris Godwin Jr.","pos":"WR","nfl_team":"TB","status":"ACTIVE","slot_id":20,"slot":"Bench","owner_id":1,"eligible_slots":[3,4,5,23,7,20,21],"projection":8.84897716,"actual":null,"kickoff":"2026-09-13T17:00:00+00:00","opponent":"@ CIN","game_state":"pre","locked":false,"availability":"ONTEAM","week_outlook":[{"week":1,"projection":8.84897716,"opponent":"@ CIN","kickoff":"2026-09-13T17:00:00+00:00"},{"week":2,"projection":8.16845823,"opponent":"vs CLE","kickoff":"2026-09-20T17:00:00+00:00"},{"week":3,"projection":8.42367299,"opponent":"vs MIN","kickoff":"2026-09-27T20:05:00+00:00"}],"outlook":"Godwin is on the comeback trail after injuries have limited him to 16 games during the past two seasons. In 2025, he appeared in nine games and reached 11 fantasy points only twice. It seems like a long time ago, Godwin was second among receivers in fantasy points in 2024 when he suffered a severe ankle injury. He wasn't nearly as effective when he was on the field last season, but he's now more than a full year recovered from the injury and has less target competition with Mike Evans no longer on the roster. Entering his age-30 season, Godwin's days as a fantasy WR1 may be over, but with Emeka Egbuka as his only competition to lead the team in targets, he certainly has a path to flex numbers."},{"id":4710714,"name":"De'Zhaun Stribling","pos":"WR","nfl_team":"SF","status":"ACTIVE","slot_id":20,"slot":"Bench","owner_id":1,"eligible_slots":[25,3,4,5,23,7,20,21],"projection":9.00831239,"actual":null,"kickoff":"2026-09-11T00:35:00+00:00","opponent":"@ LAR","game_state":"pre","locked":false,"availability":"ONTEAM","week_outlook":[{"week":1,"projection":9.00831239,"opponent":"@ LAR","kickoff":"2026-09-11T00:35:00+00:00"},{"week":2,"projection":10.02240358,"opponent":"vs MIA","kickoff":"2026-09-20T20:25:00+00:00"},{"week":3,"projection":9.35211525,"opponent":"vs ARI","kickoff":"2026-09-27T20:05:00+00:00"}],"outlook":"Stribling was selected by the 49ers with the 33rd overall pick in April's draft. Stribling had a productive collegiate run, catching 44-plus passes in four of his five seasons, three of which came with different schools. That production included 52-882-6 and 55-811-6 receiving lines at Oklahoma State and Ole Miss over the past two seasons. Stribling primarily worked as a perimeter receiver and peaked with a 22% target share with OSU in 2024. His overall efficiency is pedestrian, but he has good size and speed (4.36 40-yard dash at the combine) and is a plus blocker. Stribling has plenty competition for Year 1 targets (Mike Evans, Deebo Samuel, George Kittle, Christian McCaffrey), so a slow start is possible, but it's likely he'll eventually find his way to a bigger role and fantasy relevance. He's a fine mid-round upside pick."},{"id":4575131,"name":"Jacory Croskey-Merritt","pos":"RB","nfl_team":"WSH","status":"QUESTIONABLE","slot_id":20,"slot":"Bench","owner_id":1,"eligible_slots":[2,3,23,7,20,21],"projection":8.62684724,"actual":null,"kickoff":"2026-09-13T20:25:00+00:00","opponent":"@ PHI","game_state":"pre","locked":false,"availability":"ONTEAM","week_outlook":[{"week":1,"projection":8.62684724,"opponent":"@ PHI","kickoff":"2026-09-13T20:25:00+00:00"},{"week":2,"projection":9.44154481,"opponent":"@ DAL","kickoff":"2026-09-20T20:25:00+00:00"},{"week":3,"projection":8.88421804,"opponent":"vs SEA","kickoff":"2026-09-27T17:00:00+00:00"}],"outlook":"One of the most hyped-up players entering the 2025 fantasy season, Croskey-Merritt didn't quite live up to lofty expectations, but he was certainly very busy for a seventh-round rookie. \"Bill\" played 39% of Washington's offensive snaps but, while he finished 23rd among backs in rushing yards, he wasn't much of a factor in the passing game (3% target share). Croskey-Merritt will now compete with newcomer Rachaad White in what appears to be setting up as a committee in Washington. The 25-year-old has shown to be an effective rusher (4.60 yards per carry, 2.19 YAC), but he'll need a big boost in receiving work to find his way into the RB2/flex discussion. He's worth only a late-round flier."},{"id":4366031,"name":"Tank Dell","pos":"WR","nfl_team":"HOU","status":"INJURY_RESERVE","slot_id":21,"slot":"IR","owner_id":1,"eligible_slots":[3,4,5,23,7,20,21],"projection":0.0,"actual":null,"kickoff":"2026-09-13T17:00:00+00:00","opponent":"vs BUF","game_state":"pre","locked":false,"availability":"ONTEAM","week_outlook":[{"week":1,"projection":0.0,"opponent":"vs BUF","kickoff":"2026-09-13T17:00:00+00:00"},{"week":2,"projection":0.0,"opponent":"vs CIN","kickoff":"2026-09-20T17:00:00+00:00"},{"week":3,"projection":0.0,"opponent":"@ IND","kickoff":"2026-09-27T17:00:00+00:00"}],"outlook":"Dell is on the comeback trail after suffering a devastating knee injury late in 2024 that cost him the entire 2025 season. It was a tough break for the 2023 third-round pick, who finished 18th among receivers in fantasy PPG as a rookie. While he wasn't quite as productive the next season, he was on pace for career highs in catches and yardage. The undersized Dell is certainly a question mark off the major injury, but, with Jayden Higgins out for the 2026 season, he has a path back to a role behind Nico Collins at some point this year. The 26-year-old will begin on injured reserve, but he'll be a fine end-of-bench stash once activated."},{"id":4689936,"name":"Jake Bates","pos":"K","nfl_team":"DET","status":"ACTIVE","slot_id":17,"slot":"K","owner_id":1,"eligible_slots":[17,20,21],"projection":8.1917819,"actual":null,"kickoff":"2026-09-13T17:00:00+00:00","opponent":"vs NO","game_state":"pre","locked":false,"availability":"ONTEAM","week_outlook":[{"week":1,"projection":8.1917819,"opponent":"vs NO","kickoff":"2026-09-13T17:00:00+00:00"},{"week":2,"projection":8.05630735,"opponent":"@ BUF","kickoff":"2026-09-18T00:15:00+00:00"},{"week":3,"projection":8.1874909,"opponent":"vs NYJ","kickoff":"2026-09-27T17:00:00+00:00"}],"outlook":""},{"id":4038441,"name":"Justice Hill","pos":"RB","nfl_team":"BAL","s e line, a new coach in Super Bowl champion Klint Kubiak and a new quarterback in projected No. 1 NFL draft pick Fernando Mendoza. Jeanty has a clean path to a massive offensive role and is a strong bet for a leap forward. The 22-year-old is a midrange RB1 with elite upside."},{"id":4427366,"name":"Breece Hall","pos":"RB","nfl_team":"NYJ","status":"ACTIVE","slot_id":2,"slot":"RB","owner_id":3,"eligible_slots":[2,3,23,7,20,21],"projection":16.63044288,"actual":null,"kickoff":"2026-09-13T17:00:00+00:00","opponent":"@ TEN","game_state":"pre","locked":false,"availability":"ONTEAM","week_outlook":[{"week":1,"projection":16.63044288,"opponent":"@ TEN","kickoff":"2026-09-13T17:00:00+00:00"},{"week":2,"projection":16.00609936,"opponent":"vs GB","kickoff":"2026-09-20T17:00:00+00:00"},{"week":3,"projection":14.84662556,"opponent":"@ DET","kickoff":"2026-09-27T17:00:00+00:00"}],"outlook":"Hall received the franchise tag during the offseason and will return for his fifth season with the Jets. Having worked in the Jets' underwhelming offenses the past two years, Hall has struggled to finishes of 17th and 21st in fantasy points per game among RBs, which is a far cry from top-eight finishes during his first two seasons. Hall has remained busy, however, producing 266-plus touches each of the past three seasons. The 2022 second-round pick saw a dip in receiving work in 2025 (career-low 10% target share) but finished fourth in that category in both 2023 and 2024, so a rebound is possible with pocket QB Geno Smith now under center. Though the Jets' offense might continue to limit Hall's upside, the 25-year-old's combination of workload and talent positions him as a solid RB2."},{"id":16800,"name":"Davante Adams","pos":"WR","nfl_team":"LAR","status":"ACTIVE","slot_id":4,"slot":"WR","owner_id":3,"eligible_slots":[3,4,5,23,7,20,21],"projection":13.18477885,"actual":null,"kickoff":"2026-09-11T00:35:00+00:00","opponent":"vs SF","game_state":"pre","locked":false,"availability":"ONTEAM","week  (eight career end zone targets) and some drop woes (NFL-high eight in 2025) are drawbacks, but Williams' explosive-play ability has led him to finish sixth or better in yards per reception and yards per target each of the past two seasons. The 25-year-old remains one of Jared Goff's top targets in Detroit's high-scoring offense and is a fine fantasy WR3 target."},{"id":4432710,"name":"TreVeyon Henderson","pos":"RB","nfl_team":"NE","status":"OUT","slot_id":20,"slot":"Bench","owner_id":3,"eligible_slots":[2,3,23,7,20,21],"projection":0.0,"actual":0.0,"kickoff":"2026-09-10T00:20:00+00:00","opponent":"@ SEA","game_state":"post","locked":true,"availability":"ONTEAM","week_outlook":[{"week":1,"projection":0.0,"opponent":"@ SEA","kickoff":"2026-09-10T00:20:00+00:00"},{"week":2,"projection":10.97247276,"opponent":"vs PIT","kickoff":"2026-09-20T17:00:00+00:00"},{"week":3,"projection":11.52937571,"opponent":"@ JAX","kickoff":"2026-09-27T17:00:00+00:00"}],"outlook":"Henderson enters Year 2 after a roller-coaster rookie campaign in which he delivered three huge fantasy performances (28-plus points in all three) but otherwise played second fiddle to Rhamondre Stevenson (8.3 points per game in his other 14 games). Though his role was limited, Henderson was effective, averaging 5.1 yards per carry (eighth best) and catching 83% of his targets while scoring 10 touchdowns. The 2025 second-round pick is a candidate for a similar role in 2026, but it's unlikely that Stevenson will completely disappear after he also had a strong 2025. Henderson is safest as a bench option, but there's upside for a lot more if the 23-year-old is promoted to a lead role."},{"id":4047650,"name":"DK Metcalf","pos":"WR","nfl_team":"PIT","status":"ACTIVE","slot_id":20,"slot":"Bench","owner_id":3,"eligible_slots":[3,4,5,23,7,20,21],"projection":11.56568069,"actual":null,"kickoff":"2026-09-13T17:00:00+00:00","opponent":"vs ATL","game_state":"pre","locked":false,"availability":"ONTEAM","week_outlook":[{"week": s durability, but it also provides the 23-year-old with elite fantasy upside. With a new coaching staff led by John Harbaugh and a new playcaller in Matt Nagy, as well as an improved supporting cast that includes a healthy Malik Nabers and newcomers Isaiah Likely and Darnell Mooney, Dart is best valued as a midrange QB1 with a high ceiling."},{"id":4608686,"name":"Kyle Monangai","pos":"RB","nfl_team":"CHI","status":"ACTIVE","slot_id":20,"slot":"Bench","owner_id":3,"eligible_slots":[2,3,23,7,20,21],"projection":10.50108543,"actual":null,"kickoff":"2026-09-13T17:00:00+00:00","opponent":"@ CAR","game_state":"pre","locked":false,"availability":"ONTEAM","week_outlook":[{"week":1,"projection":10.50108543,"opponent":"@ CAR","kickoff":"2026-09-13T17:00:00+00:00"},{"week":2,"projection":10.69279198,"opponent":"vs MIN","kickoff":"2026-09-20T17:00:00+00:00"},{"week":3,"projection":9.85932489,"opponent":"vs PHI","kickoff":"2026-09-29T00:15:00+00:00"}],"outlook":"Monangai heads into his second NFL season following an impressive rookie campaign in which he quickly forced his way into a committee with D'Andre Swift. The 2025 seventh-round flier played 41% of Chicago's offensive snaps and averaged a healthy 4.6 yards per carry on 169 attempts. Monangai was limited to 7.7 fantasy PPG during the 16 weeks Swift also played, but he showed his insurance value with a 29-touch, 198-yard effort in the one game Swift was sidelined (Week 9). The 24-year-old could see a slight boost in usage this season, but that usage and production will be limited as long as Swift is also healthy."},{"id":4678008,"name":"Jonathon Brooks","pos":"RB","nfl_team":"CAR","status":"QUESTIONABLE","slot_id":20,"slot":"Bench","owner_id":3,"eligible_slots":[2,3,23,7,20,21],"projection":11.20871757,"actual":null,"kickoff":"2026-09-13T17:00:00+00:00","opponent":"vs CHI","game_state":"pre","locked":false,"availability":"ONTEAM","week_outlook":[{"week":1,"projection":11.20871757,"opponent":"vs CHI","kickoff":"2026-09-13T1 ven-game span, Likely posted a 23-356-6 receiving line on a 16% target share and averaged a solid 13.5 fantasy PPG. The 26-year-old is obviously unproven, but his receiving skills in New York's ascending offense are enough to put him on the TE2 radar."},{"id":4870795,"name":"Makai Lemon","pos":"WR","nfl_team":"PHI","status":"ACTIVE","slot_id":20,"slot":"Bench","owner_id":3,"eligible_slots":[25,3,4,5,23,7,20,21],"projection":8.04334079,"actual":null,"kickoff":"2026-09-13T20:25:00+00:00","opponent":"vs WSH","game_state":"pre","locked":false,"availability":"ONTEAM","week_outlook":[{"week":1,"projection":8.04334079,"opponent":"vs WSH","kickoff":"2026-09-13T20:25:00+00:00"},{"week":2,"projection":8.64693655,"opponent":"@ TEN","kickoff":"2026-09-20T17:00:00+00:00"},{"week":3,"projection":8.84793169,"opponent":"@ CHI","kickoff":"2026-09-29T00:15:00+00:00"}],"outlook":"Lemon was selected by the Eagles with the 20th overall pick of April's draft. Lemon is on the small side (5-foot-11, 192 pounds), but he posted a 3.04 YPRR (best in this rookie class) during his collegiate career, dropping only three of 190 career targets (his 1.6% drop rate also paced this class). Lemon, who aligned in the slot on 74% of his collegiate routes, posted a dominant 79-1,156-11 receiving line in 2025, while also contributing as a rusher (two TDs) and returner. With A.J. Brown now in New England, Lemon will battle Dontayvion Wicks for No. 2 work opposite DeVonta Smith. Lemon's skill set provides him with upside, but with plenty of mouths to feed in Philly's low-volume pass offense, he's best valued as a flex option in 2026."},{"id":4034949,"name":"Eddy Pineiro","pos":"K","nfl_team":"SF","status":"ACTIVE","slot_id":17,"slot":"K","owner_id":3,"eligible_slots":[17,20,21],"projection":8.08261024,"actual":null,"kickoff":"2026-09-11T00:35:00+00:00","opponent":"@ LAR","game_state":"pre","locked":false,"availability":"ONTEAM","week_outlook":[{"week":1,"projection":8.08261024,"opponent":"@ LAR","kickoff":" share (11.3 per game) and he's averaging 18.2 fantasy PPG. As a rookie, the 2024 sixth overall pick finished seventh or better among receivers in targets, receptions, yards and fantasy points despite missing two games and dealing with New York's offensive struggles. Nabers' massive target share allowed him a high floor, as he was a top-30 fantasy scorer in 13 of 15 games, including 10 straight to end the 2024 season. He essentially has a new quarterback (Jaxson Dart threw only three passes his way last season), a new coach (John Harbaugh), a new offensive playcaller (Matt Nagy) and is recovering from the knee, so there are a lot of variables here, but the 23-year-old still holds elite upside. A healthy Nabers should be valued as a mid-to-back-end WR1, but the potential for a slow start needs to be considered on draft day."},{"id":4882093,"name":"Bhayshul Tuten","pos":"RB","nfl_team":"JAX","status":"ACTIVE","slot_id":2,"slot":"RB","owner_id":4,"eligible_slots":[2,3,23,7,20,21],"projection":13.0963318,"actual":null,"kickoff":"2026-09-13T17:00:00+00:00","opponent":"vs CLE","game_state":"pre","locked":false,"availability":"ONTEAM","week_outlook":[{"week":1,"projection":13.0963318,"opponent":"vs CLE","kickoff":"2026-09-13T17:00:00+00:00"},{"week":2,"projection":10.88087335,"opponent":"@ DEN","kickoff":"2026-09-20T20:05:00+00:00"},{"week":3,"projection":12.26227362,"opponent":"vs NE","kickoff":"2026-09-27T17:00:00+00:00"}],"outlook":"Tuten is positioned to take over lead-back duties in Jacksonville following the offseason departure of Travis Etienne Jr. Tuten played sparingly as a rookie, totaling 83 carries and 14 targets in 15 games. He cleared 10 touches in only one game (a 15-touch, 74-yard effort in Week 11), but he did find the end zone in all four games in which he had at least eight touches. The 2025 fourth-round pick will see some scoring regression (seven TDs on 93 touches), but he flashed in limited work, can contribute as a rusher and receiver, is working in a good offense and has only journeyman Chris Rodriguez Jr. and passing-down specialist LeQuint Allen Jr. as his competition. Tuten is still unproven, but the 23-year-old has a path to a breakout season."},{"id":3915416,"name":"DJ Moore","pos":"WR","nfl_team":"BUF","status":"ACTIVE","slot_id":4,"slot":"WR","owner_id":4,"eligible_slots":[3,4,5,23,7,20,21],"projection":10.93169499,"actual":null,"kickoff":"2026-09-13T17:00:00+00:00","opponent":"@ HOU","game_state":"pre","locked":false,"availability":"ONTEAM","week_outlook":[{"week":1,"projection":10.93169499,"opponent":"@ HOU","kickoff":"2026-09-13T17:00:00+00:00"},{"week":2,"projection":11.73249844,"opponent":"vs DET","kickoff":"2026-09-18T00:15:00+00:00"},{"week":3,"projection":11.83213471,"opponent":"vs LAC","kickoff":"2026-09-27T17:00:00+00:00"}],"outlook":"Moore was traded to Buffalo after spending his first eight NFL seasons with Carolina and Chicago. A featured target throughout most of his career, Moore was reduced to a 16% target share in 2025 -- his lowest since his rookie year in 2018. The result was a 35th-place finish in fantasy points, which ended a streak of six consecutive top 25s. Moore now heads to Buffalo with Khalil Shakir as his only roadblock to emerging as Josh Allen's No. 1 target in Buffalo's high-scoring offense. Still in his prime at age 29, Moore has the look of a fantasy WR3 with upside for more."},{"id":4432620,"name":"Parker Washington","pos":"WR","nfl_team":"JAX","status":"ACTIVE","slot_id":23,"slot":"FLEX","owner_id":4,"eligible_slots":[3,4,5,23,7,20,21],"projection":10.68494779,"actual":null,"kickoff":"2026-09-13T17:00:00+00:00","opponent":"vs CLE","game_state":"pre","locked":false,"availability":"ONTEAM","week_outlook":[{"week":1,"projection":10.68494779,"opponent":"vs CLE","kickoff":"2026-09-13T17:00:00+00:00"},{"week":2,"projection":9.62580966,"opponent":"@ DEN","kickoff":"2026-09-20T20:05:00+00:00"},{"week":3,"projection":10.30843028,"opponent":"vs NE","kickoff":"2026-09-27T17:00:00+00:00"}],"outlook":"A strong finish to the 2025 season has made Washington one of the fascinating breakout candidates of 2026. Though he's primarily worked as a situational/depth player since being drafted in the sixth round in 2023, Washington has flashed when asked to play a bigger role. In 21 games since the start of 2024 in which he had a route participation above 50%, Washington handled a 20% target share and averaged 12.2 fantasy PPG. He surprisingly emerged as Jacksonville's top target late last season, which included a stretch of four straight games with at least nine targets and 19 fantasy points to end the season. The 24-year-old appears to have cemented a big role in Jacksonville, though Jakobi Meyers, Brian Thomas Jr. and perhaps Travis Hunter will battle him for snaps and targets. Washington should be targeted for your flex spot."},{"id":4047365,"name":"Josh Jacobs","pos":"RB","nfl_team":"GB","status":"DAY_TO_DAY","slot_id":20,"slot":"Bench","owner_id":4,"eligible_slots":[2,3,23,7,20,21],"projection":0.0,"actual":null,"kickoff":"2026-09-13T20:25:00+00:00","opponent":"@ MIN","game_state":"pre","locked":false,"availability":"ONTEAM","week_outlook":[{"week":1,"projection":0.0,"opponent":"@ MIN","kickoff":"2026-09-13T20:25:00+00:00"},{"week":2,"projection":0.0,"opponent":"@ NYJ","kickoff":"2026-09-20T17:00:00+00:00"},{"week":3,"projection":0.0,"opponent":"vs ATL","kickoff":"2026-09-25T00:15:00+00:00"}],"outlook":"Jacobs' 2025 season can be split in two parts: pre-injury and post-injury. While healthy during his first nine games, Jacobs picked up where he left off from a terrific 2024 debut season with Green Bay, averaging 21.1 touches and 19.6 fantasy points while scoring 11 TDs. After missing all but 11 snaps during Weeks 11 and 12, Jacobs returned and wasn't quite the same, averaging 14.6 touches and 11.3 points while totaling three touchdowns in his final five games. But Jacobs, 28, was still effective overall (PFF's fourth-highest-graded back) and has a clear grasp on lead-back duties in a good Green Bay offense that has afforded him 30 touchdowns (fifth most in the NFL) in 32 games. He's a fine back-end RB1 when active, but a likely suspension makes him less valuable on draft day.He's worth a mid-round flier until the dust settles."},{"id":4360569,"name":"Jordan Mason","pos":"RB","nfl_team":"MIN","status":"ACTIVE","slot_id":20,"slot":"Bench","owner_id":4,"eligible_slots":[2,3,23,7,20,21],"projection":9.19743752,"actual":null,"kickoff":"2026-09-13T20:25:00+00:00","opponent":"vs GB","game_state":"pre","locked":false,"availability":"ONTEAM","week_outlook":[{"week":1,"projection":9.19743752,"opponent":"vs GB","kickoff":"2026-09-13T20:25:00+00:00"},{"week":2,"projection":9.35323596,"opponent":"@ CHI","kickoff":"2026-09-20T17:00:00+00:00"},{"week":3,"projection":8.6977706,"opponent":"@ TB","kickoff":"2026-09-27T20:05:00+00:00"}],"outlook":"Mason is back for his second season in Minnesota and will battle 31-year-old Aaron Jones Sr. for backfield opportunities. Mason's role was almost exactly as expected last season, as he was utilized often as a rusher (9.9 carries per game), but a nonfactor as a receiver (1.0 targets per game). Mason reached 13 fantasy points just once in his 16 games and it was a 23.6-point effort in Week 3, one of five games Jones missed. Mason, 27, is an effective rusher -- his 5.10 YPC ranks third and his 2.42 YAC second among 54 RBs with 350-plus carries since he entered the league -- but adding so little as a receiver (34 career targets) severely limits his fantasy output. Even if Jones were to miss time, Mason would max out as a flex."},{"id":4870653,"name":"KC Concepcion","pos":"WR","nfl_team":"CLE","status":"ACTIVE","slot_id":20,"slot":"Bench","owner_id":4,"eligible_slots":[25,3,4,5,23,7,20,21],"projection":8.38504829,"actual":null,"kickoff":"2026-09-13T17:00:00+00:00","opponent":"@ JAX","game_state":"pre","locked":false,"availability":"ONTEAM","week_outlook":[{"week":1,"projection":8.38504829,"opponent":"@ JAX","kickoff":"2026-09-13T17:00:00+00:00"},{"week":2,"projection":8.03933669,"opponent":"@ TB","kickoff":"2026-09-20T17:00:00+00:00"},{"week":3,"projection":8.33320418,"opponent":"vs CAR","kickoff":"2026-09-27T17:00:00+00:00"}],"outlook":"Concepcion was selected by the Browns in the first round of April's draft. He is a quick and explosive short-to-intermediate receiver whose career 27.2% target share topped this entire rookie class. Primarily a slot receiver during his first two seasons at NC State, Concepcion played more on the outside in 2025 at Texas A&M, but he figures to primarily work inside in the pros (career 72% slot rate), while also helping as a rusher and returner. Concepcion will need to fend off the likes of Jerry Jeudy, Harold Fannin Jr. and fellow rookie Denzel Boston for targets in an offense with quarterback issues, so while he has upside, he's best valued as a flex."},{"id":4360310,"name":"Trevor Lawrence","pos":"QB","nfl_team":"JAX","status":"ACTIVE","slot_id":0,"slot":"QB","owner_id":4,"eligible_slots":[0,7,20,21],"projection":18.36713889,"actual":null,"kickoff":"2026-09-13T17:00:00+00:00","opponent":"vs CLE","game_state":"pre","locked":false,"availability":"ONTEAM","week_outlook":[{"week":1,"projection":18.36713889,"opponent":"vs CLE","kickoff":"2026-09-13T17:00:00+00:00"},{"week":2,"projection":16.22438526,"opponent":"@ DEN","kickoff":"2026-09-20T20:05:00+00:00"},{"week":3,"projection":18.51595547,"opponent":"vs NE","kickoff":"2026-09-27T17:00:00+00:00"}],"outlook":"Lawrence is entering his sixth NFL season after a breakout 2025 in which he ranked no lower than seventh among quarterbacks in pass attempts, completions, yards and touchdowns, as well as top 10 in carries, yards and TDs. He reeled off seven consecutive top-10 fantasy outings to finish the season. Lawrence's efficiency has been fine, at best, but he continues to generate big volume, having finished in the top 10 among QBs in pass and rush attempts in each of his four full seasons. With a strong, deep group of pass catchers and Liam Coen back as playcaller, the 26-year-old is well positioned for mid-to-back-end QB1 production."},{"id":4429025,"name":"Quentin Johnston","pos":"WR","nfl_team":"LAC","status":"ACTIVE","slot_id":20,"slot":"Bench","owner_id":4,"eligible_slots":[3,4,5,23,7,20,21],"projection":9.90992355,"actual":null,"kickoff":"2026-09-13T20:25:00+00:00","opponent":"vs ARI","game_state":"pre","locked":false,"availability":"ONTEAM","week_outlook":[{"week":1,"projection":9.90992355,"opponent":"vs ARI","kickoff":"2026-09-13T20:25:00+00:00"},{"week":2,"projection":9.7778089,"opponent":"vs LV","kickoff":"2026-09-20T20:05:00+00:00"},{"week":3,"projection":9.87950459,"opponent":"@ BUF","kickoff":"2026-09-27T17:00:00+00:00"}],"outlook":"Four weeks into the 2025 season, it appeared Johnston was on the verge of a breakout campaign. The 2023 first-round pick found the end zone four times and scored 14-plus fantasy points in each game during the span. The return to earth was abrupt, as Johnston went on to average 9.2 PPG in his final 10 games. The 25-year-old has posted consistent receiving lines in each of the last two seasons (55-724-8 and 51-735-8), but neither resulted in a top-30 fantasy campaign. The Chargers offense should be better in 2026 with a healthy line and Mike McDaniel calling plays, but Johnston is unlikely to see a big boost in usage with the likes of Ladd McConkey and sophomores Tre Harris and Omarion Hampton also in the fold. Johnston is no more than a boom/bust flex in deeper leagues."},{"id":4880281,"name":"Jordyn Tyson","pos":"WR","nfl_team":"NO","status":"INJURY_RESERVE","slot_id":21,"slot":"IR","owner_id":4,"eligible_slots":[25,3,4,5,23,7,20,21],"projection":0.0,"actual":null,"kickoff":"2026-09-13T17:00:00+00:00","opponent":"@ DET","game_state":"pre","locked":false,"availability":"ONTEAM","week_outlook":[{"week":1,"projection":0.0,"opponent":"@ DET","kickoff":"2026-09-13T17:00:00+00:00"},{"week":2,"projection":0.0,"opponent":"@ BAL","kickoff":"2026-09-20T17:00:00+00:00"},{"week":3,"projection":0.0,"opponent":"vs LV","kickoff":"2026-09-27T20:25:00+00:00"}],"outlook":"Tyson was selected by the Saints with the No. 8 overall pick of April's draft. He is a versatile receiver with decent size who led this rookie class with a 35% target share during the nine weeks he was active in 2025. Injuries cost him time during all four collegiate seasons, but he still managed a 158-2,282-22 receiving line in 33 games, posting a strong 2.73 YPRR along the way (third best in this class). Tyson suffered a hamstring injury in August and will miss a month or two of the regular season prior to taking over as the Saints' No. 2 receiver behind Chris Olave. Once healthy, Tyson has a path to a substantial role in an ascending offense led by second-year QB Tyler Shough and could find himself on the WR3 radar. Of course, with the injury, he's only worth a late flier. "},{"id":4869461,"name":"Trey Smack","pos":"K","nfl_team":"GB","status":"ACTIVE","slot_id":17,"slot":"K","owner_id":4,"eligible_slots":[25,17,20,21],"projection":7.62742703,"actual":null,"kickoff":"2026-09-13T20:25:00+00:00","opponent":"@ MIN","game_state":"pre","locked":false,"availability":"ONTEAM","week_outlook":[{"week":1,"projection":7.62742703,"opponent":"@ MIN","kickoff":"2026-09-13T20:25:00+00:00"},{"week":2,"projection":7.7191835,"opponent":"@ NYJ","kickoff":"2026-09-20T17:00:00+00:00"},{"week":3,"projection":8.40589822,"opponent":"vs ATL","kickoff":"2026-09-25T00:15:00+00:00"}],"outlook":""},{"id":-16020,"name":"Jets D/ST","pos":"DST","nfl_team":"NYJ","status":"ACTIVE","slot_id":16,"slot":"DST","owner_id":4,"eligible_slots":[16,20,21],"projection":6.56645963,"actual":null,"kickoff":"2026-09-13T17:00:00+00:00","opponent":"@ TEN","game_state":"pre","locked":false,"availability":"ONTEAM","week_outlook":[{"week":1,"projection":6.56645963,"opponent":"@ TEN","kickoff":"2026-09-13T17:00:00+00:00"},{"week":2,"projection":4.1851927 s now finished four of his five NFL campaigns no lower than fifth in fantasy PPG (the exception was 11th in 2023). Chase actually saw a big dip in yardage (1,740 to 1,426), TDs (17 to 8) and fantasy PPG (23.7 to 19.6) from 2024 to 2025 (which was no surprise with Joe Burrow missing nine games), but still put up big numbers thanks to pacing the league in pass routes and targets for the second season in a row. In fact, Chase's 125 receptions make him the third receiver in NFL history with 125-plus catches in multiple seasons. The 26-year-old remains the top target in a high-scoring Bengals offense, and is one of the top players in all of fantasy."},{"id":4047646,"name":"A.J. Brown","pos":"WR","nfl_team":"NE","status":"QUESTIONABLE","slot_id":4,"slot":"WR","owner_id":5,"eligible_slots":[3,4,5,23,7,20,21],"projection":13.15964315,"actual":5.1,"kickoff":"2026-09-10T00:20:00+00:00","opponent":"@ SEA","game_state":"post","locked":true,"availability":"ONTEAM","week_outlook":[{"week":1,"projection":13.15964315,"opponent":"@ SEA","kickoff":"2026-09-10T00:20:00+00:00"},{"week":2,"projection":12.95491504,"opponent":"vs PIT","kickoff":"2026-09-20T17:00:00+00:00"},{"week":3,"projection":13.89638724,"opponent":"@ JAX","kickoff":"2026-09-27T17:00:00+00:00"}],"outlook":"Brown was traded to the Patriots in June. The veteran receiver enters 2026 looking to continue his streak of finishing in the top 15 in fantasy points per game during each of the four seasons he was with the Eagles. That includes an 11th-place finish in 2025 in which Brown reached the 1,000-yard mark for the sixth time in his seven NFL seasons while finding the end zone exactly seven times for the third year in a row. Brown continues to benefit from elite usage (he has finished no lower than seventh among WRs in target share each of the past seven seasons) and elite efficiency (he has finished 80th percentile or better in yards per route run all seven years). He could use more end zone targets in New England (he had a career-low four last season), but Brown, 29, is set to work as Drake Maye's top target in a good Patriots' offense. He is a fringe fantasy WR1."},{"id":3918298,"name":"Josh Allen","pos":"QB","nfl_team":"BUF","status":"ACTIVE","slot_id":0,"slot":"QB","owner_id":5,"eligible_slots":[0,7,20,21],"projection":20.91154806,"actual":null,"kickoff":"2026-09-13T17:00:00+00:00","opponent":"@ HOU","game_state":"pre","locked":false,"availability":"ONTEAM","week_outlook":[{"week":1,"projection":20.91154806,"opponent":"@ HOU","kickoff":"2026-09-13T17:00:00+00:00"},{"week":2,"projection":23.48050832,"opponent":"vs DET","kickoff":"2026-09-18T00:15:00+00:00"},{"week":3,"projection":23.88139818,"opponent":"vs LAC","kickoff":"2026-09-27T17:00:00+00:00"}],"outlook":"Allen enters his age-30 campaign having finished each of the past six seasons no worse than second among quarterbacks in fantasy points. Despite seeing less passing volume the past two seasons (14th or lower in pass attempts both years), the 2024 NFL MVP has finished in the top 10 in passing TDs six seasons in a row and remains a major threat with his legs (top five in carries and rushing TDs among quarterbacks all eight seasons of his career). Allen's 21.4 fantasy points per game in 2025 was actually his lowest since 2019, but it was still enough to lead the position. With Joe Brady returning as playcaller and the Bills adding a No. 1 receiver in DJ Moore, Allen remains an elite fantasy quarterback."},{"id":4696981,"name":"Cam Skattebo","pos":"RB","nfl_team":"NYG","status":"ACTIVE","slot_id":2,"slot":"RB","owner_id":5,"eligible_slots":[2,3,23,7,20,21],"projection":13.74754536,"actual":null,"kickoff":"2026-09-14T00:20:00+00:00","opponent":"vs DAL","game_state":"pre","locked":false,"availability":"ONTEAM","week_outlook":[{"week":1,"projection":13.74754536,"opponent":"vs DAL","kickoff":"2026-09-14T00:20:00+00:00"},{"week":2,"projection":11.6000307,"opponent":"@ LAR","kickoff":"2026-09-22T00:15:00+00:00"},{"week":3,"projection":14.78997164,"opponent":"vs TEN","kickoff":"2026-09-27T17:00:00+00:00"}],"outlook":"Skattebo is a Year 2 breakout candidate following an impressive but injury-shortened rookie season. The fourth-round pick first played a significant offensive role in Week 2 and went on to average 16.0 carries, 4.7 targets and 96.3 yards while scoring six TDs during his six full games. His 19.1 fantasy points per game during the span would've ranked sixth over the full season. The 24-year-old enters 2026 with a new coach (John Harbaugh) and playcaller (Matt Nagy), but his competition for touches are Najee Harris and the same guys he beat out for work in 2025 (Tyrone Tracy Jr., Devin Singletary). Assuming his ankle heals up as expected, Skattebo will be on the RB2 radar with upside for more."},{"id":4596448,"name":"Bucky Irving","pos":"RB","nfl_team":"TB","status":"ACTIVE","slot_id":2,"slot":"RB","owner_id":5,"eligible_slots":[2,3,23,7,20,21],"projection":12.58966128,"actual":null,"kickoff":"2026-09-13T17:00:00+00:00","opponent":"@ CIN","game_state":"pre","locked":false,"availability":"ONTEAM","week_outlook":[{"week":1,"projection":12.58966128,"opponent":"@ CIN","kickoff":"2026-09-13T17:00:00+00:00"},{"week":2,"projection":12.47401308,"opponent":"vs CLE","kickoff":"2026-09-20T17:00:00+00:00"},{"week":3,"projection":12.54948153,"opponent":"vs MIN","kickoff":"2026-09-27T20:05:00+00:00"}],"outlook":"Irving enters his third season coming off a disappointing 2025 campaign in which he missed seven games and struggled with efficiency. After averaging 5.42 yards per carry and producing 1,514 yards and eight touchdowns as a rookie, Irving fell to 3.40 YPC (fourth worst among qualified RBs), 865 yards and four touchdowns in 2025. He failed to clear 4.2 YPC in any of his 10 outings and had zero carries inside the opponent's 5 yard line. The 24-year-old remains positioned as the lead back in Tampa Bay, but the combination of his small frame (5-foot-9, 192 pounds) and the arrival of Kenneth Gainwell (not to mention Sean Tucker at the goal line) suggest he might play a lesser role moving forward. Irving should be valued as a back-end RB2."},{"id":4685278,"name":"Luther Burden III","pos":"WR","nfl_team":"CHI","status":"ACTIVE","slot_id":23,"slot":"FLEX","owner_id":5,"eligible_slots":[3,4,5,23,7,20,21],"projection":11.15859905,"actual":null,"kickoff":"2026-09-13T17:00:00+00:00","opponent":"@ CAR","game_state":"pre","locked":false,"availability":"ONTEAM","week_outlook":[{"week":1,"projection":11.15859905,"opponent":"@ CAR","kickoff":"2026-09-13T17:00:00+00:00"},{"week":2,"projection":11.21590506,"opponent":"vs MIN","kickoff":"2026-09-20T17:00:00+00:00"},{"week":3,"projection":10.82680201,"opponent":"vs PHI","kickoff":"2026-09-29T00:15:00+00:00"}],"outlook":"Burden enters his second NFL season as one of the most popular breakout candidates in fantasy. The 2025 second-round pick played sparingly during most of his rookie season, but flashed elite efficiency when called upon, ranking in the top five among wide receivers in catch rate (77%), yards per target (10.8), RAC (7.3) and YPRR (2.9). Burden is obviously an unproven commodity (he has two career top-20 fantasy outings, after all), but with DJ Moore no longer on the roster, he's a lock for a larger role and very well could lead Chicago in targets. He could cost a pretty penny on draft day, but Burden, 22, is a fine WR3 target with upside for more."},{"id":4569987,"name":"Jaylen Warren","pos":"RB","nfl_team":"PIT","status":"ACTIVE","slot_id":20,"slot":"Bench","owner_id":5,"eligible_slots":[2,3,23,7,20,21],"projection":12.56442371,"actual":null,"kickoff":"2026-09-13T17:00:00+00:00","opponent":"vs ATL","game_state":"pre","locked":false,"availability":"ONTEAM","week_outlook":[{"week":1,"projection":12.56442371,"opponent":"vs ATL","kickoff":"2026-09-13T17:00:00+00:00"},{"week":2,"projection":10.68544418,"opponent":"@ NE","kickoff":"2026-09-20T17:00:00+00:00"},{"week":3,"projection":12.11214827,"opponent":"vs CIN","kickoff":"2026-09-27T17:00:00+00:00"}],"outlook":"Warren reached career-high marks in touches (251), yardage (1,291) and touchdowns (eight) last season, his fourth in the league. The former undrafted free agent put up 13.6 fantasy points per game (19th among backs) and PFF tracked him with 56 forced missed tackles (seventh). Pittsburgh swapped out Kenneth Gainwell for Rico Dowdle as Warren's running mate, and the two are expected to split work in a Mike McCarthy offense that rarely deploys its backs in the passing game. Warren is capable and effective as a rusher and receiver, but his ceiling figures to be limited in this committee. He's likely to cap out as a flex."},{"id":4241985,"name":"J.K. Dobbins","pos":"RB","nfl_team":"DEN","status":"ACTIVE","slot_id":20,"slot":"Bench","owner_id":5,"eligible_slots":[2,3,23,7,20,21],"projection":9.82106697,"actual":null,"kickoff":"2026-09-15T00:15:00+00:00","opponent":"@ KC","game_state":"pre","locked":false,"availability":"ONTEAM","week_outlook":[{"week":1,"projection":9.82106697,"opponent":"@ KC","kickoff":"2026-09-15T00:15:00+00:00"},{"week":2,"projection":11.12478835,"opponent":"vs JAX","kickoff":"2026-09-20T20:05:00+00:00"},{"week":3,"projection":9.37489765,"opponent":"vs LAR","kickoff":"2026-09-28T00:20:00+00:00"}],"outlook":"Dobbins re-signed with Denver and will attempt to fend off sophomore RJ Harvey for the team's lead-back job. With both active during Weeks 1-10 last season (10 games), Dobbins handled 153 carries (60% team share) and 15 targets (4%), compared to 50 carries (20%) and 29 targets (9%) for Harvey. Dobbins ran well (5.05 yards per carry) when healthy, but he was limited to four touchdowns and was a nonfactor as a receiver (37 yards on 15 targets) en route to averaging 11.6 fantasy points (27th). Dobbins enters his age-27 campaign having yet to play a full season in his career (seven-plus missed games in four of the past five years) and without much value even when active (he has never produced a top-20 fantasy campaign). Dobbins is an underwhelming flex option with added value in non-PPR formats."},{"id":15847,"name":"Travis Kelce","pos":"TE","nfl_team":"KC","status":"ACTIVE","slot_id":6,"slot":"TE","owner_id":5,"eligible_slots":[5,6,23,7,20,21],"projection":8.79253174,"actual":null,"kickoff":"2026-09-15T00:15:00+00:00","opponent":"vs DEN","game_state":"pre","locked":false,"availability":"ONTEAM","week_outlook":[{"week":1,"projection":8.79253174,"opponent":"vs DEN","kickoff":"2026-09-15T00:15:00+00:00"},{"week":2,"projection":9.60601601,"opponent":"vs IND","kickoff":"2026-09-21T00:20:00+00:00"},{"week":3,"projection":9.79322749,"opponent":"@ MIA","kickoff":"2026-09-27T17:00:00+00:00"}],"outlook":"Kelce re-signed with the Chiefs and is returning for what might be his final NFL season. The veteran tight end's days as an elite producer are behind him, and he saw a notable dip in usage last season (19.6% target share was his lowest since 2014). Kelce did hold up for 17 games and still finished in the top 10 at the position in snaps, routes, targets, catches, yards and fantasy PPG. Kelce has reeled off 10 consecutive top-five fantasy campaigns despite not offering much in the scoring department (he hasn't cleared five TDs in a season since 2022). The 36-year-old's role could dip even further this season, so he's best valued as a fringe TE1."},{"id":4362249,"name":"Jayden Reed","pos":"WR","nfl_team":"GB","status":"ACTIVE","slot_id":20,"slot":"Bench","owner_id":5,"eligible_slots":[3,4,5,23,7,20,21],"projection":9.26565661,"actual":null,"kickoff":"2026-09-13T20:25:00+00:00","opponent":"@ MIN","game_state":"pre","locked":false,"availability":"ONTEAM","week_outlook":[{"week":1,"projection":9.26565661,"opponent":"@ MIN","kickoff":"2026-09-13T20:25:00+00:00"},{"week":2,"projection":9.38799996,"opponent":"@ NYJ","kickoff":"2026-09-20T17:00:00+00:00"},{"week":3,"projection":9.95152952,"opponent":"vs ATL","kickoff":"2026-09-25T00:15:00+00:00"}],"outlook":"Reed began his NFL career with a pair of top-30 fantasy campaigns, but the Green Bay slot receiver was limited to only seven appearances last season due to injury. Even when active, Reed wasn't as effective as in years past, averaging 6.9 fantasy PPG and finding the end zone once (Week 1). This comes after the 2023 second-round pick produced 75 touches, 900-plus yards and seven-plus touchdowns in each of his first two seasons. The 26-year-old signed a contract extension in April and will battle the likes of Christian Watson, Matthew Golden and Savion Williams for targets this season. While he'll likely hit for the occasional solid game, his limited usage (career-high 18% target share) will put a cap on his fantasy upside. He's barely in the flex conversation in PPR leagues."},{"id":4429205,"name":"Jordan Addison","pos":"WR","nfl_team":"MIN","status":"ACTIVE","slot_id":20,"slot":"Bench","owner_id":5,"eligible_slots":[3,4,5,23,7,20,21],"projection":9.2299421,"actual":null,"kickoff":"2026-09-13T20:25:00+00:00","opponent":"vs GB","game_state":"pre","locked":false,"availability":"ONTEAM","week_outlook":[{"week":1,"projection":9.2299421,"opponent":"vs GB","kickoff":"2026-09-13T20:25:00+00:00"},{"week":2,"projection":9.50406505,"opponent":"@ CHI","kickoff":"2026-09-20T17:00:00+00:00"},{"week":3,"projection":8.9811504,"opponent":"@ TB","kickoff":"2026-09-27T20:05:00+00:00"}],"outlook":"After impressing with a 70-911-10 receiving line on 108 targets as a rookie in 2023, Addison has seen his target, reception, yardage and touchdown totals decrease each of the last two seasons. A few missed games were partially to blame for the dips, but Minnesota's quarterback woes were the main culprit in 2025, as Addison went from 10 TDs and a 65% catch rate in both 2023 and 2024 to three TDs and a 53% catch rate last season. Addison already has a pair of top-25 fantasy campaigns to his name, but it may be a stretch for him to get there in 2026 with Kyler Murray leading the Minnesota offense, not to mention Jauan Jennings' addition to the lineup. The 24-year-old is best valued as WR4/flex."},{"id":4362619,"name":"Chris Rodriguez Jr.","pos":"RB","nfl_team":"JAX","status":"ACTIVE","slot_id":20,"slot":"Bench","owner_id":5,"eligible_slots":[2,3,23,7,20,21],"projection":5.07245148,"actual":null,"kickoff":"2026-09-13T17:00:00+00:00","opponent":"vs CLE","game_state":"pre","locked":false,"availability":"ONTEAM","week_outlook":[{"week":1,"projection":5.07245148,"opponent":"vs CLE","kickoff":"2026-09-13T17:00:00+00:00"},{"week":2,"projection":3.8616202,"opponent":"@ DEN","kickoff":"2026-09-20T20:05:00+00:00"},{"week":3,"projection":4.46356295,"opponent":"vs NE","kickoff":"2026-09-27T17:00:00+00:00"}],"outlook":"Rodriguez, a 2023 sixth-round NFL draft pick, spent his first three seasons with Washington and has primarily played a depth role, but he did hit career-high marks in touches (115), yardage (530) and touchdowns (six) in 2025. Rodriguez has handled more than 10 touches in nine career games and averaged 13.1 touches, 65.9 yards and 11.7 fantasy points with a total of seven touchdowns in those outings. Though he's an effective rusher, Rodriguez is not an option in the passing game (seven career targets). The 26-year-old's contract included a healthy $6.2 million in guarantees, so he's likely to have a legitimate offensive role as a counterpart to second-year backs Bhayshul Tuten and LeQuint Allen Jr. Rodriguez might score the occasional touchdown, but his role won't allow consistent fantasy output. He's best stashed on benches."},{"id":-16024,"name":"Chargers D/ST","pos":"DST","nfl_team":"LAC","status":"ACTIVE","slot_id":16,"slot":"DST","owner_id":5,"eligible_slots":[16,20,21],"projection":7.50045922,"actual":null,"kickoff":"2026-09-13T20:25:00+00:00","opponent":"vs ARI","game_state":"pre","locked":false,"availability":"ONTEAM","week_outlook":[{"week":1,"projection":7.50045922,"opponent":"vs ARI","kickoff":"2026-09-13T20:25:00+00:00"},{"week":2,"projection":6.75424626,"opponent":" ill be an elite option whenever he's on the field."},{"id":4567048,"name":"Kenneth Walker III","pos":"RB","nfl_team":"KC","status":"ACTIVE","slot_id":2,"slot":"RB","owner_id":6,"eligible_slots":[2,3,23,7,20,21],"projection":14.82322762,"actual":null,"kickoff":"2026-09-15T00:15:00+00:00","opponent":"vs DEN","game_state":"pre","locked":false,"availability":"ONTEAM","week_outlook":[{"week":1,"projection":14.82322762,"opponent":"vs DEN","kickoff":"2026-09-15T00:15:00+00:00"},{"week":2,"projection":16.98880338,"opponent":"vs IND","kickoff":"2026-09-21T00:20:00+00:00"},{"week":3,"projection":18.12619723,"opponent":"@ MIA","kickoff":"2026-09-27T17:00:00+00:00"}],"outlook":"Walker signed with the Chiefs after spending his first four NFL seasons with the Seahawks. The reigning Super Bowl MVP and PFF's highest-graded running back from 2025, Walker is poised for feature-back duties in a good, Andy Reid-led offense. Having worked in a committee most of last season, Walker was limited to only five touchdowns and 11.3 fantasy points per game (both career lows), but he still generated 252 touches and a career-high 1,309 yards. He has yet to finish a season better than 18th in fantasy points (12th on a per-game basis) and has missed at least two games in three of four seasons in the league, but the 25-year-old's ability to contribute at a high level as a rusher and receiver is enough to position him as, at least, a fringe RB1 in 2026."},{"id":4241478,"name":"DeVonta Smith","pos":"WR","nfl_team":"PHI","status":"ACTIVE","slot_id":4,"slot":"WR","owner_id":6,"eligible_slots":[3,4,5,23,7,20,21],"projection":13.73229479,"actual":null,"kickoff":"2026-09-13T20:25:00+00:00","opponent":"vs WSH","game_state":"pre","locked":false,"availability":"ONTEAM","week_outlook":[{"week":1,"projection":13.73229479,"opponent":"vs WSH","kickoff":"2026-09-13T20:25:00+00:00"},{"week":2,"projection":12.97057254,"opponent":"@ TEN","kickoff":"2026-09-20T17:00:00+00:00"},{"week":3,"projection":13.32208297,"opponent":"@ CHI","kickoff":"2026-09-29T00:15:00+00:00"}],"outlook":"It's generally tough for a former Heisman Trophy winner and first-round draft pick to fly under the radar, but that has been the case for Smith in recent years. With all eyes on A.J. Brown, Smith has finished no lower than 30th among receivers in fantasy PPG in each of his five seasons (top 30 in PPG each of the last four). The \"slim reaper\" saw a big dip in touchdowns last season (four, after at least seven the prior three seasons), but remained very efficient (career 9.1 yards per target and 2.1 yards per route run). Smith has handled roughly one-quarter of the Eagles' targets throughout his career, and that may rise slightly after Brown was traded to New England. Smith, 27, is the Eagles' No. 1 receiver for the first time as a non-rookie and is well positioned for a strong WR2 campaign."},{"id":4612826,"name":"Ladd McConkey","pos":"WR","nfl_team":"LAC","status":"ACTIVE","slot_id":4,"slot":"WR","owner_id":6,"eligible_slots":[3,4,5,23,7,20,21],"projection":12.89578803,"actual":null,"kickoff":"2026-09-13T20:25:00+00:00","opponent":"vs ARI","game_state":"pre","locked":false,"availability":"ONTEAM","week_outlook":[{"week":1,"projection":12.89578803,"opponent":"vs ARI","kickoff":"2026-09-13T20:25:00+00:00"},{"week":2,"projection":12.72493558,"opponent":"vs LV","kickoff":"2026-09-20T20:05:00+00:00"},{"week":3,"projection":12.93052374,"opponent":"@ BUF","kickoff":"2026-09-27T17:00:00+00:00"}],"outlook":"McConkey is looking to rebound after falling short of high expectations in 2025. The 2024 second-round pick was terrific as a rookie (82-1,155-7 receiving line and a 12th-place finish among WRs in fantasy points), but dipped to 66-789-6 line and a 30th-place finish last season. Though he ran considerably more routes, saw similar target numbers and was used a lot more near the goal line (seventh among WRs with 12 end zone targets), McConkey's efficiency plummeted, with his catch rate dipping from 74% to 62% and his yards per target from 10.4 to 7.4. The good news is that there's reason for optimism that he'll bounce back, as he has a new playcaller in Mike McDaniel, the Chargers' offense figures to improve with a much healthier line, and Keenan Allen is out of the picture. McConkey, 24, makes for a fine fantasy WR3."},{"id":3121422,"name":"Terry McLaurin","pos":"WR","nfl_team":"WSH","status":"ACTIVE","slot_id":23,"slot":"FLEX","owner_id":6,"eligible_slots":[3,4,5,23,7,20,21],"projection":11.38023639,"actual":null,"kickoff":"2026-09-13T20:25:00+00:00","opponent":"@ PHI","game_state":"pre","locked":false,"availability":"ONTEAM","week_outlook":[{"week":1,"projection":11.38023639,"opponent":"@ PHI","kickoff":"2026-09-13T20:25:00+00:00"},{"week":2,"projection":12.16280433,"opponent":"@ DAL","kickoff":"2026-09-20T20:25:00+00:00"},{"week":3,"projection":11.39578216,"opponent":"vs SEA","kickoff":"2026-09-27T17:00:00+00:00"}],"outlook":"McLaurin is eyeing a bounce-back campaign following a lost 2025 season in which both he (seven missed games) and quarterback Jayden Daniels (10 missed games) were sidelined for extended periods. The dud season came after Daniels helped McLaurin to a career year in 2024, which included 13 touchdowns (second most among WRs) and a seventh-place finish in fantasy points. McLaurin's target ceiling remains a concern (he's been in the 21-25% target share range each of his seven seasons), but with his quarterback healthy and his role as a vertical threat in new playcaller David Blough's offense, McLaurin is certainly poised for a rebound. The 30-year-old is best valued as a mid-to-back-end WR2."},{"id":3916148,"name":"Tony Pollard","pos":"RB","nfl_team":"TEN","status":"ACTIVE","slot_id":20,"slot":"Bench","owner_id":6,"eligible_slots":[2,3,23,7,20,21],"projection":11.88203171,"actual":null,"kickoff":"2026-09-13T17:00:00+00:00","opponent":"vs NYJ","game_state":"pre","locked":false,"availability":"ONTEAM","week_outlook":[{"week":1,"projection":11.88203171,"opponent":"vs NYJ","kickoff":"2026-09-13T17:00:00+00:00"},{"week":2,"projection":10.46939353,"opponent":"vs PHI","kickoff":"2026-09-20T17:00:00+00:00"},{"week":3,"projection":11.13736994,"opponent":"@ NYG","kickoff":"2026-09-27T17:00:00+00:00"}],"outlook":"Pollard has handled a hefty 67.2% of the Titans' designed rushing attempts since his arrival two seasons ago (15.2 per game) and, even with solid efficiency, he has finished 22nd and 30th in fantasy points per game. The culprits? Tennessee's struggling offense (Pollard has exactly five TDs in both seasons) and a limited receiving role when Tyjae Spears has been healthy (Pollard's targets fell from 3.5 per game in 2024 to 2.5 per game in 2025). Barring a major leap from quarterback Cam Ward, Pollard is unlikely to deliver only the second top-20 fantasy campaign (in points per game) of his career. The 29-year-old, entering his eighth NFL season (third with Tennessee), is a low-ceiling flex."},{"id":16737,"name":"Mike Evans","pos":"WR","nfl_team":"SF","status":"ACTIVE","slot_id":20,"slot":"Bench","owner_id":6,"eligible_slots":[3,4,5,23,7,20,21],"projection":10.05376427,"actual":null,"kickoff":"2026-09-11T00:35:00+00:00","opponent":"@ LAR","game_state":"pre","locked":false,"availability":"ONTEAM","week_outlook":[{"week":1,"projection":10.05376427,"opponent":"@ LAR","kickoff":"2026-09-11T00:35:00+00:00"},{"week":2,"projection":11.29467392,"opponent":"vs MIA","kickoff":"2026-09-20T20:25:00+00:00"},{"week":3,"projection":10.62923471,"opponent":"vs ARI","kickoff":"2026-09-27T20:05:00+00:00"}],"outlook":"Evans signed with the 49ers after spending his first 12 NFL seasons with the Buccaneers. The future Hall of Famer famously opened his career with 11 consecutive 1,000-yard seasons, but that streak ended when he missed nine games due to injury last season. Even when active, Evans wasn't his usual, productive self, delivering only one weekly fantasy finish better than 23rd and none better than 11th. Now 33 years old, Evans is past his prime, but he's in line for a decent chunk of the targets, especially near the goal line, in Kyle Shanahan's high-scoring offense. Evans is best valued as a touchdown-dependent WR3/flex with more value in non-PPR formats."},{"id":4572680,"name":"Tucker Kraft","pos":"TE","nfl_team":"GB","status":"ACTIVE","slot_id":6,"slot":"TE","owner_id":6,"eligible_slots":[5,6,23,7,20,21],"projection":8.19755202,"actual":null,"kickoff":"2026-09-13T20:25:00+00:00","opponent":"@ MIN","game_state":"pre","locked":false,"availability":"ONTEAM","week_outlook":[{"week":1,"projection":8.19755202,"opponent":"@ MIN","kickoff":"2026-09-13T20:25:00+00:00"},{"week":2,"projection":8.29085836,"opponent":"@ NYJ","kickoff":"2026-09-20T17:00:00+00:00"},{"week":3,"projection":9.80284296,"opponent":"vs ATL","kickoff":"2026-09-25T00:15:00+00:00"}],"outlook":"Kraft's steady career progression had him on the cusp of a full-on breakout last season, but all was derailed by a torn ACL in Week 9. Prior to the injury, Kraft had seen 10 targets in consecutive games, one of which included a career-high 33.3 fantasy points. Through Week 8, only Jake Ferguson had more fantasy points. Granted, Kraft took advantage of a super easy schedule and was way over his head in the TD department (six TDs with an expected total of 1.8 and only two end zone targets), but his boost in usage and terrific RAC skills (he has led the position in the category each of his three seasons) were enough to get him into the weekly TE1 mix. Kraft's recovery will need to be monitored, but even if he's ready for Week 1, a dip in production is possible in his first year back from the major injury. He's a risky middle-round target."},{"id":-16007,"name":"Broncos D/ST","pos":"DST","nfl_team":"DEN","status":"ACTIVE","slot_id":16,"slot":"DST","owner_id":6,"eligible_slots":[16,20,21],"projection":5.8607573,"actual":null,"kickoff":"2026-09-15T00:15:00+00:00","opponent":"@ KC","game_state":"pre","locked":false,"availability":"ONTEAM","wee n five straight seasons and one rushing touchdown since 2017). Stafford still has receivers Puka Nacua and Davante Adams and a strong offensive line at his disposal, so another big passing season is possible. That's just enough to keep him in the fringe QB1 mix."},{"id":4688813,"name":"Josh Downs","pos":"WR","nfl_team":"IND","status":"ACTIVE","slot_id":20,"slot":"Bench","owner_id":6,"eligible_slots":[3,4,5,23,7,20,21],"projection":8.13135715,"actual":null,"kickoff":"2026-09-13T17:00:00+00:00","opponent":"vs BAL","game_state":"pre","locked":false,"availability":"ONTEAM","week_outlook":[{"week":1,"projection":8.13135715,"opponent":"vs BAL","kickoff":"2026-09-13T17:00:00+00:00"},{"week":2,"projection":8.08918958,"opponent":"@ KC","kickoff":"2026-09-21T00:20:00+00:00"},{"week":3,"projection":7.71937128,"opponent":"vs HOU","kickoff":"2026-09-27T17:00:00+00:00"}],"outlook":"Downs has settled in as a serviceable slot receiver, which has helped him to finish in the 35-to-45 range among WRs in total fantasy points in each of his three NFL seasons. Downs peaked with a 72-803-5 receiving line in 2024, but took a step back in a crowded offense last season, and failed to deliver a single fantasy week better than 15th at the position. The undersized Downs isn't an option near the goal line, as he hasn't cleared five touchdowns or three end zone targets in a single season. The 25-year-old has a path to a slightly larger role in 2026 with Michael Pittman Jr. gone, leaving Alec Pierce, Tyler Warren and Keenan Allen as his primary target competition. Downs is a sleeper for flex production in PPR formats."},{"id":4032473,"name":"Rashid Shaheed","pos":"WR","nfl_team":"SEA","status":"ACTIVE","slot_id":20,"slot":"Bench","owner_id":6,"eligible_slots":[3,4,5,23,7,20,21],"projection":8.01795103,"actual":0.9,"kickoff":"2026-09-10T00:20:00+00:00","opponent":"vs NE","game_state":"post","locked":true,"availability":"ONTEAM","week_outlook":[{"week":1,"projection":8.01795103,"opponent":"vs NE","kickoff":"2026-09-10T00:20:00+00:00"},{"week":2,"projection":8.49445573,"opponent":"@ ARI","kickoff":"2026-09-20T20:25:00+00:00"},{"week":3,"projection":8.5606328,"opponent":"@ WSH","kickoff":"2026-09-27T17:00:00+00:00"}],"outlook":"Shaheed re-signed with Seattle after the team acquired him at last year's trade deadline. Known primarily for his elite return ability, Shaheed made an impact at times as a receiver with New Orleans, but wasn't used much on offense after the trade. In 12 games with the Seahawks (including the playoffs), Shaheed cleared three touches in only two games and averaged 5.9 fantasy PPG. The team's financial investment in Shaheed suggests his role will expand in 2026, but he still has to fend off Jaxon Smith-Njigba, Cooper Kupp and second-year WR Tory Horton for snaps and targets. Shaheed enters his age-28 season yet to deliver a top-35 fantasy campaign, and he's unlikely to get there this season while also focusing on special teams and working in Seattle's low-pass-volume offense."},{"id":4385690,"name":"Dalton Kincaid","pos":"TE","nfl_team":"BUF","status":"ACTIVE","slot_id":20,"slot":"Bench","owner_id":6,"eligible_slots":[5,6,23,7,20,21],"projection":7.90168619,"actual":null,"kickoff":"2026-09-13T17:00:00+00:00","opponent":"@ HOU","game_state":"pre","locked":false,"availability":"ONTEAM","week_outlook":[{"week":1,"projection":7.90168619,"opponent":"@ HOU","kickoff":"2026-09-13T17:00:00+00:00"},{"week":2,"projection":8.42476228,"opponent":"vs DET","kickoff":"2026-09-18T00:15:00+00:00"},{"week":3,"projection":8.48308449,"opponent":"vs LAC","kickoff":"2026-09-27T17:00:00+00:00"}],"outlook":"Kincaid is perhaps fantasy's biggest wild card among tight ends. The 2023 first-round pick has occasionally flashed a high ceiling (he actually led qualified tight ends in YPT and YPRR last season), but he also has missed substantial action (nine games the past two years) and has disappeared way too often (he failed to clear 13.1 fantasy points in any game in 2 h among receivers in fantasy points (13th PPG), which marks his first finish better than 25th (31st PPG). A highly targeted, short-range RAC specialist, Flowers' ceiling is lower than other top receivers, but the 25-year-old remains positioned as Lamar Jackson's top target in Baltimore's new-look offense. Flowers makes for a solid fantasy WR2."},{"id":3916387,"name":"Lamar Jackson","pos":"QB","nfl_team":"BAL","status":"ACTIVE","slot_id":0,"slot":"QB","owner_id":7,"eligible_slots":[0,7,20,21],"projection":20.70651461,"actual":null,"kickoff":"2026-09-13T17:00:00+00:00","opponent":"@ IND","game_state":"pre","locked":false,"availability":"ONTEAM","week_outlook":[{"week":1,"projection":20.70651461,"opponent":"@ IND","kickoff":"2026-09-13T17:00:00+00:00"},{"week":2,"projection":20.99963793,"opponent":"vs NO","kickoff":"2026-09-20T17:00:00+00:00"},{"week":3,"projection":20.85914248,"opponent":"@ DAL","kickoff":"2026-09-27T20:25:00+00:00"}],"outlook":"Jackson, 29, is eyeing a rebound after a disappointing, injury-plagued 2025. Jackson started the season strong (26-plus fantasy points in each of his first three games) but left Week 4 because of an injury and wasn't the same once he returned in Week 9 (13.5 fantasy points per game in his final nine outings). Jackson's overall rushing was down, but that was likely a product of him not being fully healthy, especially considering his scramble rate (8.4%) remained high. Jackson has a new coach (Jesse Minter) and playcaller (Declan Doyle), but his supporting cast is otherwise similar to a 2024 campaign in which he paced all quarterbacks in fantasy points. Assuming he's back to full health, Jackson is a strong bet for a rebound and should be valued as a high-end QB1."},{"id":4431299,"name":"Rome Odunze","pos":"WR","nfl_team":"CHI","status":"QUESTIONABLE","slot_id":4,"slot":"WR","owner_id":7,"eligible_slots":[3,4,5,23,7,20,21],"projection":11.95550062,"actual":null,"kickoff":"2026-09-13T17:00:00+00:00","opponent":"@ CAR","game_state":"pre","locked":false,"availability":"ONTEAM","week_outlook":[{"week":1,"projection":11.95550062,"opponent":"@ CAR","kickoff":"2026-09-13T17:00:00+00:00"},{"week":2,"projection":12.02283708,"opponent":"vs MIN","kickoff":"2026-09-20T17:00:00+00:00"},{"week":3,"projection":11.63101619,"opponent":"vs PHI","kickoff":"2026-09-29T00:15:00+00:00"}],"outlook":"Odunze opened the 2025 season with a bang, scoring five touchdowns in his first four games and producing 15-plus fantasy points in each game. Things fell apart from there, as the 2024 first-round pick went on to deliver one touchdown and two double-digit fantasy outings over his next eight games prior to missing Weeks 14 through 18 due to injury. On the plus side, Odunze remained heavily targeted throughout the season, especially near the goal line, and he is ninth in the NFL with 24 end zone targets since he was drafted. On the other hand, his connection with Caleb Williams needs work, as his 48% catch rate ranked near the basement at the position. Odunze, 24, is still ascending and has a clearer path to targets with DJ Moore out of the mix. He's a candidate for a Year 3 leap and should be valued as a WR3 with upside."},{"id":4360248,"name":"Kyle Pitts Sr.","pos":"TE","nfl_team":"ATL","status":"ACTIVE","slot_id":6,"slot":"TE","owner_id":7,"eligible_slots":[5,6,23,7,20,21],"projection":9.23198568,"actual":null,"kickoff":"2026-09-13T17:00:00+00:00","opponent":"@ PIT","game_state":"pre","locked":false,"availability":"ONTEAM","week_outlook":[{"week":1,"projection":9.23198568,"opponent":"@ PIT","kickoff":"2026-09-13T17:00:00+00:00"},{"week":2,"projection":9.94381997,"opponent":"vs CAR","kickoff":"2026-09-20T17:00:00+00:00"},{"week":3,"projection":9.81817735,"opponent":"@ GB","kickoff":"2026-09-25T00:15:00+00:00"}],"outlook":"Right when it seemed like Pitts might never live up to the hype, the 2021 No. 4 pick put together the best season of his career. Pitts finished second among tight ends in routes, targets, catches, yards and fantasy points, setting career highs in all but the yardage category. He scored five touchdowns and has increased his total in that category (by exactly one) each season in the league. Pitts did a big chunk of his damage with Kirk Cousins under center (some with WR Drake London sidelined), which is notable as Tua Tagovailoa and Michael Penix Jr. are set to battle for the Atlanta QB job. There's some obvious risk here considering Pitts finished 17th or lower in PPG three straight seasons before 2025, but he nonetheless enters his age-25 season as a priority target in the Atlanta offense. Consider him a midrange TE1."},{"id":4241416,"name":"Chuba Hubbard","pos":"RB","nfl_team":"CAR","status":"ACTIVE","slot_id":2,"slot":"RB","owner_id":7,"eligible_slots":[2,3,23,7,20,21],"projection":11.7402522,"actual":null,"kickoff":"2026-09-13T17:00:00+00:00","opponent":"vs CHI","game_state":"pre","locked":false,"availability":"ONTEAM","week_outlook":[{"week":1,"projection":11.7402522,"opponent":"vs CHI","kickoff":"2026-09-13T17:00:00+00:00"},{"week":2,"projection":11.34087498,"opponent":"@ ATL","kickoff":"2026-09-20T17:00:00+00:00"},{"week":3,"projection":10.23587808,"opponent":"@ CLE","kickoff":"2026-09-27T17:00:00+00:00"}],"outlook":"Hubbard is coming off a disappointing 2025 campaign in which he battled injury and lost lead-back duties to Rico Dowdle. The veteran was limited to 734 yards on 164 touches (he cleared 275 touches and 1,100 yards in 2023 and 2024), and he ranked 64th among 65 qualified backs in forced missed tackle rate and elusive rating, per PFF. Still in his prime at age 27, a bounce-back season is possible, especially with Dowdle gone and unproven Jonathon Brooks as his competition for touches. Hubbard should be considered a flex/bench option."},{"id":2971573,"name":"Ka'imi Fairbairn","pos":"K","nfl_team":"HOU","status":"ACTIVE","slot_id":17,"slot":"K","owner_id":7,"eligible_slots":[17,20,21],"projection":9.07412246,"actual":null,"kickoff":"2026-09-13T17: ent":"@ TEN","kickoff":"2026-09-20T17:00:00+00:00"},{"week":3,"projection":9.68225084,"opponent":"@ CHI","kickoff":"2026-09-29T00:15:00+00:00"}],"outlook":"Goedert enters the 2026 season as the poster boy for inevitable touchdown regression to the mean. After scoring 24 touchdowns in his first seven seasons (3.4 per year), Goedert inexplicably leaped to 11 scores in 15 games in 2025. Goedert's expected TD total was 5.1, and he saw only five end zone targets (12 tight ends saw more). Goedert is a solid fantasy tight end -- he has finished 12th or better in PPG each of the past seven seasons -- but he often misses games (at least two in each of the past six years) and has never finished in the top eight at the position in targets or catches. The 31-year-old is likely to deliver fringe-TE1 numbers in 2026."},{"id":4361432,"name":"Romeo Doubs","pos":"WR","nfl_team":"NE","status":"ACTIVE","slot_id":20,"slot":"Bench","owner_id":7,"eligible_slots":[3,4,5,23,7,20,21],"projection":7.5245476,"actual":0.0,"kickoff":"2026-09-10T00:20:00+00:00","opponent":"@ SEA","game_state":"post","locked":true,"availability":"ONTEAM","week_outlook":[{"week":1,"projection":7.5245476,"opponent":"@ SEA","kickoff":"2026-09-10T00:20:00+00:00"},{"week":2,"projection":7.76016905,"opponent":"vs PIT","kickoff":"2026-09-20T17:00:00+00:00"},{"week":3,"projection":8.3272141,"opponent":"@ JAX","kickoff":"2026-09-27T17:00:00+00:00"}],"outlook":"Doubs signed with the Patriots during free agency after spending his first four NFL seasons with the Packers. He was a serviceable player during his Green Bay tenure, but he never finished a season in the top 30 among receivers in targets, catches, yards or fantasy points. Consistently mediocre, Doubs has averaged either 10.2 or 10.3 fantasy PPG each of the last three seasons. In New England, Doubs is likely to settle in as Drake Maye's No. 2 target behind A.J. Brown, though his target ceiling figures to be capped with the likes of DeMario Douglas, Mack Hollins and Kyle Williams also in the mix at receiver. Doubs, 26, is a fine addition to your bench, but his upside is limited."},{"id":4683062,"name":"Xavier Worthy","pos":"WR","nfl_team":"KC","status":"ACTIVE","slot_id":20,"slot":"Bench","owner_id":7,"eligible_slots":[3,4,5,23,7,20,21],"projection":9.01956331,"actual":null,"kickoff":"2026-09-15T00:15:00+00:00","opponent":"vs DEN","game_state":"pre","locked":false,"availability":"ONTEAM","week_outlook":[{"week":1,"projection":9.01956331,"opponent":"vs DEN","kickoff":"2026-09-15T00:15:00+00:00"},{"week":2,"projection":9.92491547,"opponent":"vs IND","kickoff":"2026-09-21T00:20:00+00:00"},{"week":3,"projection":10.15404271,"opponent":"@ MIA","kickoff":"2026-09-27T17:00:00+00:00"}],"outlook":"After impressing as a rookie with 101 touches and 12 touchdowns in 20 games (including the playoffs), Worthy had the look of an emerging star. Things didn't go as planned in Year 2, though, as the 2024 first-round pick was injured on his third snap of the season and wasn't productive or utilized as much as expected upon his return. Worthy was limited to one touchdown (Week 6) and reached 12 fantasy points once in 14 games (Week 4). The speedy Worthy is still only 23 years old, so a Year 3 breakout is certainly possible, especially with Rashee Rice and 36-year-old Travis Kelce as his only legit target competition. He's worth a late flier."},{"id":4702555,"name":"Jonah Coleman","pos":"RB","nfl_team":"DEN","status":"ACTIVE","slot_id":20,"slot":"Bench","owner_id":7,"eligible_slots":[25,2,3,23,7,20,21],"projection":4.03791397,"actual":null,"kickoff":"2026-09-15T00:15:00+00:00","opponent":"@ KC","game_state":"pre","locked":false,"availability":"ONTEAM","week_outlook":[{"week":1,"projection":4.03791397,"opponent":"@ KC","kickoff":"2026-09-15T00:15:00+00:00"},{"week":2,"projection":4.47954906,"opponent":"vs JAX","kickoff":"2026-09-20T20:05:00+00:00"},{"week":3,"projection":3.87868231,"opponent":"vs LAR","kickoff":"2026-09-28T00:20:00+00:00"}],"outlook
