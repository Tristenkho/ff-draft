name: Deploy draft terminal and season companion to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Prepare single-file site
        run: |
          mkdir _site
          cp out/draft_terminal.html _site/index.html
          # Season companion: a static export committed by agent-tools/publish-season.
          # Absent on purpose until that runs, so a missing file must not fail the build.
          if [ -f out/season_current.html ]; then
            mkdir -p _site/season
            cp out/season_current.html _site/season/index.html
          fi
          cp out/draft-terminal-icon-180.png _site/draft-terminal-icon-180.png
          cp out/draft-terminal-icon-32.png _site/draft-terminal-icon-32.png
          touch _site/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload site
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
